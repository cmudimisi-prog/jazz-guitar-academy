{id:25,title:'Counterpoint for Jazz Guitar',color:'#9ad1d4',blurb:'Independent voices: motion types, species, guide-tone duets, inner lines and two-voice improvisation.',lessons:[
 {id:'25-1',title:'Counterpoint Basics: Two Independent Voices',mins:25,bpm:70,comp:false,chords:['Cmaj7 G7','Am7 Em7','Fmaj7 Dm7','G7 Cmaj7'],
  tab:'[5/3,1/0]h [5/5,2/0]h | [4/2,2/1]h [4/5,2/0]h | [4/7,1/1]h [4/0,1/1]h | [5/2,1/1]h [5/3,1/0]h',
  html:'<p><b>Counterpoint</b> is the art of combining melodic lines that are <b>independent</b> yet sound good together. It comes from the classical tradition (Fux, Bach), and it is everywhere in jazz: walking bass against melody, guide-tone lines, inner voices in chord melody, and the conversation between two soloists.</p><p>Two voices can move in four ways. In <b>contrary</b> motion they move in opposite directions — the most independent. In <b>oblique</b> motion one voice holds while the other moves. In <b>similar</b> motion both move the same way by different intervals. In <b>parallel</b> motion both move the same way by the same interval. The classic rules are to prefer <b>3rds, 6ths and 10ths</b> (imperfect consonances) and to avoid <b>parallel 5ths and octaves</b>, which make two lines sound like one.</p><p>This duet ends with the most famous resolution in harmony: G7’s tritone (B–F) moves out by contrary motion to C–E.</p>',
  table:{title:'Motion & intervals',head:['Term','Meaning','Use'],rows:[['Contrary','Voices move in opposite directions','Most independent — use often'],['Oblique','One voice holds, one moves','Creates suspensions and pedal points'],['Similar','Same direction, different intervals','Fine into imperfect consonances'],['Parallel','Same direction, same interval','OK in 3rds/6ths/10ths; avoid 5ths & 8ves'],['Imperfect consonance','3rds, 6ths, 10ths','Sweet, keeps voices distinct'],['Perfect consonance','Unison, 5th, octave','Use at starts and endings'],['Dissonance','2nds, 7ths, tritone, 4th over the bass','Resolve by step']]},
  keys:['Independent lines that fit together','Contrary, oblique, similar, parallel','Prefer 3rds, 6ths, 10ths','Avoid parallel 5ths and octaves'],
  usage:['Use contrary motion between your bass notes and melody in chord melody and solo guitar','Comp with two-note dyads (3rds, 6ths, 10ths) to leave space for a soloist','Resolve dissonances (tritones, 7ths) by step — the strongest sound in tonal harmony','When duetting with another player, move against them (contrary) rather than with them'],
  drills:['Name the motion type between every pair of dyads in the exercise','Rewrite the duet so the top voice moves only by step','Play the bass line and sing the top line, then swap'],
  cues:['C–E (10th), then D–B (6th): contrary motion','E–C (6th), G–B (3rd)','A–F (6th), then D–F: oblique motion — the top holds','The tritone B–F resolves out to C–E'],
  figs:[{type:'dots',from:0,to:7,title:'The two voices',cap:'Gold = bass voice · Teal = upper voice',dots:[{s:5,f:3,l:'C',cls:'root'},{s:5,f:5,l:'D',cls:'root'},{s:4,f:2,l:'E',cls:'root'},{s:4,f:5,l:'G',cls:'root'},{s:4,f:7,l:'A',cls:'root'},{s:4,f:0,l:'D',cls:'root'},{s:5,f:2,l:'B',cls:'root'},{s:1,f:0,l:'E',cls:'ct'},{s:2,f:0,l:'B',cls:'ct'},{s:2,f:1,l:'C',cls:'ct'},{s:1,f:1,l:'F',cls:'ct'}]}]},
 {id:'25-2',title:'Species Counterpoint: Moving Against a Bass',mins:25,bpm:70,ring:4,comp:false,chords:['Cmaj7','Dm7','G7','Cmaj7'],
  tab:'[5/3,2/1]q 2/3q 1/0q 1/1q | [5/5,1/5]q 1/3q 1/1q 1/0q | [6/3,2/3]q 2/1q 2/0q 2/3q | [5/3,1/0]w',
  html:'<p>Classical teachers learn counterpoint in <b>species</b>. <b>First species</b> is note against note (Lesson 25-1). In <b>second species</b> the upper voice plays two notes for every bass note, and in <b>third species</b> it plays four. The rule is simple and very useful for jazz lines: <b>strong beats are consonant</b>, while weak beats may carry <b>passing tones</b> that move by step between consonances.</p><p>Here the bass note rings for the whole bar while the top voice moves in quarter notes. Beats 1 and 3 land on consonances with the bass; beats 2 and 4 are passing tones. Bebop lines follow the same principle — chord tones on the beat, passing tones off it.</p>',
  table:{title:'The species',head:['Species','Ratio','Rule'],rows:[['1st','1 : 1','Every interval consonant'],['2nd','2 : 1','Downbeat consonant, upbeat may pass'],['3rd','4 : 1','Beats 1 & 3 consonant, 2 & 4 passing/neighbour'],['4th','Syncopated','Suspensions: tie over, dissonate, resolve down'],['5th (florid)','Mixed','Combine all of the above — like a real melody']]},
  keys:['Species = rhythmic ratios between voices','Strong beats consonant','Weak beats: passing and neighbour tones','Same logic as bebop lines'],
  usage:['Check your improvised lines: consonant (chord tone) on the strong beats, passing tones between','Use a held bass note (pedal) and move a melody over it — perfect for intros and endings','Use 4th-species suspensions (e.g. 4 → 3) in chord melody for expressive tension'],
  drills:['Hold one bass note and improvise quarter notes above it following the beat rules','Write a 2nd-species line (two notes per bass note) over C–A–D–G','Add a 4–3 suspension at the end of each phrase'],
  cues:['Bass C rings: C (cons) D (pass) E (cons) F (pass)','Bass D: A (5th) G F (10th) E','Bass G: D (5th) C B (10th) D','Resolve: C under E'],
  figs:[{type:'dots',from:0,to:5,title:'Strong beats (gold) vs passing tones (grey), bar 1',dots:[{s:5,f:3,l:'C',cls:'root'},{s:2,f:1,l:'C',cls:'ct'},{s:2,f:3,l:'D'},{s:1,f:0,l:'E',cls:'ct'},{s:1,f:1,l:'F'}]}]},
 {id:'25-3',title:'Guide-Tone Duets: Two Lines Through the Changes',mins:25,bpm:100,comp:false,chords:['Dm7','G7','Cmaj7','A7','Dm7','G7','Cmaj7','Cmaj7'],
  tab:'[4/3,3/5]w | [4/3,3/4]w | [4/2,3/4]w | [4/5,3/6]w | [4/3,3/5]w | [4/3,3/4]w | [4/2,3/4]w | [4/2,3/5]w',
  html:'<p>The 3rds and 7ths of a progression form <b>two independent lines</b> that move mostly by half step or stay put. Played together they form a two-voice counterpoint that spells out the whole harmony. This is how pianists and guitarists comp with just two notes, and how horn sections write backgrounds.</p><p>Follow each voice separately. The lower voice goes F → F → E → G → F → F → E → E, and the upper goes C → B → B → C♯ → C → B → B → C. Most moves are oblique or by half step: maximum smoothness, minimum movement.</p>',
  keys:['3rds and 7ths = two counterpoint lines','Mostly half steps and common tones','Two notes are enough to state the harmony','Each voice is a melody'],
  usage:['Comp with only guide-tone dyads behind a soloist — clear harmony, lots of space','Practise two-voice guide-tone lines on every standard you learn','Play one guide-tone line yourself while the bassist plays the other implied line — a duet'],
  drills:['Play only the lower voice through the progression, then only the upper','Sing one voice while playing the other','Write the guide-tone duet for Autumn Leaves (Lesson 10-1)'],
  cues:['Dm7: F + C','G7: F + B — the C falls to B','Cmaj7: E + B — the F falls to E','A7: G + C♯','Dm7: F + C','G7: F + B','Cmaj7: E + B','Top voice resolves to C'],
  figs:[{type:'chords',title:'Guide-tone dyads',items:[{name:'Dm7',frets:[null,null,3,5,null,null]},{name:'G7',frets:[null,null,3,4,null,null]},{name:'Cmaj7',frets:[null,null,2,4,null,null]},{name:'A7',frets:[null,null,5,6,null,null]}]}]},
 {id:'25-4',title:'Inner-Voice Counterlines',mins:20,bpm:70,comp:false,chords:['Dm','Dmmaj7','Dm7','Dm6'],
  tab:'[5/5,3/7,2/6]w | [5/5,3/6,2/6]w | [5/5,3/5,2/6]w | [5/5,3/4,2/6]w',
  html:'<p>Counterpoint can live <b>inside</b> a chord. Here the bass (D) and the top (F) hold still while an inner voice descends chromatically: D → C♯ → C → B. The chord names change — Dm, Dm(maj7), Dm7, Dm6 — but really it is <b>one moving line</b> against two pedal notes. Jazz arrangers call this a <b>line cliché</b>.</p><p>Inner-voice motion is the secret of rich chord melody and lush comping: even when the harmony is static, something is always moving.</p>',
  keys:['Outer voices hold, an inner voice moves','Chromatic descent: 1 – 7 – ♭7 – 6','Static harmony, constant motion','The basis of the line cliché'],
  usage:['On a long minor chord, move an inner voice 1 – 7 – ♭7 – 6','On a long major chord, try 5 – ♯5 – 6 – ♭7 (C – C+ – C6 – C7)','In chord melody, keep the melody on top and move an inner voice underneath'],
  drills:['Play the line cliché on Am, Em and Gm','Try the ascending major version: C – C+ – C6 – C7','Add the inner line under a melody note you hold on the top string'],
  cues:['Dm — inner voice on D','Dm(maj7) — C♯','Dm7 — C','Dm6 — B'],
  figs:[{type:'chords',title:'The inner-voice line',items:[{name:'Dm',frets:[null,5,null,7,6,null]},{name:'Dmmaj7',frets:[null,5,null,6,6,null]},{name:'Dm7',frets:[null,5,null,5,6,null]},{name:'Dm6',frets:[null,5,null,4,6,null]}]}]},
 {id:'25-5',title:'Two-Voice Improvisation: Bass & Melody',mins:25,bpm:90,ring:2,band:false,click:true,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'5/5q 1/1q 4/7q 1/0q | 6/3q 1/1q 5/5q 2/0q | 5/3q 1/0q 4/5q 2/0q | [5/3,1/0]w',
  html:'<p>Solo guitarists create the illusion of two players by alternating a <b>bass voice</b> and a <b>melody voice</b>. Bass notes go on the strong beats and melody notes answer on beats 2 and 4. The bass notes ring so both lines are heard. This is the foundation of solo jazz guitar in the style of players such as Joe Pass.</p><p>Each voice should make sense on its own. Here the bass outlines the roots and 5ths (D–A, G–D, C–G), while the melody walks F–E, F–B, E–B with guide tones. Play it without the band: you <i>are</i> the band.</p>',
  keys:['Alternate bass and melody registers','Bass on strong beats, melody in between','Let bass notes ring','Each voice must work alone'],
  usage:['Play solo guitar or duo gigs without a bassist','Use a walking bass voice on beats 1–3 and melody stabs on the “and”s','Think of two characters in conversation: question in one voice, answer in the other'],
  drills:['Play just the bass voice, then just the melody, then both','Walk quarter-note bass on strings 5–6 while adding one melody note per bar on string 1','Improvise a two-voice chorus on the blues'],
  cues:['Bass D, melody F; bass A, melody E','Bass G, melody F; bass D, melody B','Bass C, melody E; bass G, melody B','Both voices together: C and E'],
  figs:[{type:'dots',from:0,to:7,title:'Two registers',cap:'Gold = bass voice (strings 4–6) · Teal = melody voice (strings 1–2)',dots:[{s:5,f:5,l:'D',cls:'root'},{s:4,f:7,l:'A',cls:'root'},{s:6,f:3,l:'G',cls:'root'},{s:5,f:3,l:'C',cls:'root'},{s:4,f:5,l:'G',cls:'root'},{s:1,f:1,l:'F',cls:'ct'},{s:1,f:0,l:'E',cls:'ct'},{s:2,f:0,l:'B',cls:'ct'}]}]}
]}

const Store=(()=>{const KEY='jazzGuitarAcademy.v1';let mem={};try{const raw=localStorage.getItem(KEY);if(raw)mem=JSON.parse(raw)||{};}catch(e){}
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}};
 return {get:(k,d)=>(k in mem?mem[k]:d),set:(k,v)=>{mem[k]=v;save();},reset:()=>{mem={};save();},dump:()=>JSON.parse(JSON.stringify(mem)),load:o=>{mem=o;save();}};})();
function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addPractice(sec){if(sec<5)return;const log=Store.get('log',{});const k=dayKey();log[k]=(log[k]||0)+Math.round(sec);Store.set('log',log);}
function lastDays(n){const log=Store.get('log',{});const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push({d,sec:log[dayKey(d)]||0});}return out;}
function calcStreak(){const log=Store.get('log',{});let s=0;const d=new Date();if(!(log[dayKey(d)]>=60))d.setDate(d.getDate()-1);while(log[dayKey(d)]>=60){s++;d.setDate(d.getDate()-1);}return s;}
const MIX_DEFAULT={guitar:1,bass:0.9,comp:0.7,drums:0.8,click:0.9};

// =====================================================================
//  AUDIO ENGINE  (all sounds synthesised — no files needed)
// =====================================================================
let ACTX=null,LIVE=null,FX=null;
function ctx(){
 if(!ACTX){const C=window.AudioContext||window.webkitAudioContext;if(!C){toast('Web Audio is not supported in this browser');return null;}
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  ACTX=new C({latencyHint:'interactive'});LIVE=makeGraph(ACTX);}
 if(ACTX.state!=='running')ACTX.resume();return ACTX;
}
function makeGraph(c){
 const g={c};g.master=c.createGain();g.master.gain.value=0.9;
 const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.attack.value=0.004;comp.release.value=0.2;
 g.master.connect(comp);comp.connect(c.destination);
 g.rev=c.createConvolver();g.rev.buffer=makeIR(c,1.7);const rg=c.createGain();rg.gain.value=0.2;g.revIn=c.createGain();g.revIn.connect(g.rev);g.rev.connect(rg);rg.connect(g.master);
 const len=c.sampleRate*2;g.noise=c.createBuffer(1,len,c.sampleRate);const d=g.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 return g;
}
function makeIR(c,sec){const len=Math.floor(c.sampleRate*sec);const b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4);}return b;}
function newSession(g,mix){const s={g,buses:{}};s.out=g.c.createGain();s.out.connect(g.master);s.out.connect(g.revIn);
 for(const k of ['guitar','bass','comp','drums','click']){const b=g.c.createGain();b.gain.value=(mix&&mix[k]!=null)?mix[k]:MIX_DEFAULT[k];b.connect(s.out);s.buses[k]=b;}return s;}
function endSession(s){if(!s)return;const t=s.g.c.currentTime;s.out.gain.setTargetAtTime(0,t,0.03);setTimeout(()=>{try{s.out.disconnect();}catch(e){}},500);}
function fx(){const c=ctx();if(!c)return null;if(!FX)FX=newSession(LIVE,{guitar:1,comp:0.8,click:1});return FX;}

// Karplus–Strong plucked string (warm archtop tone)
const KS=new Map();
function ksBuf(c,midi){const sr=c.sampleRate,key=sr+':'+midi;let v=KS.get(key);if(v)return v;
 const f=mtof(midi),N=Math.max(2,Math.floor(sr/f-0.5)),len=Math.floor(sr*2.8);const buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0);
 const bright=0.32+Math.min(0.4,Math.max(0,(midi-40)*0.012));let lp=0,mean=0;
 for(let i=0;i<N;i++){lp+=bright*((Math.random()*2-1)-lp);d[i]=lp;mean+=lp;}mean/=N;for(let i=0;i<N;i++)d[i]-=mean;
 const rho=0.9993-Math.max(0,midi-40)*0.00004;
 for(let i=N;i<len;i++){d[i]=rho*0.5*(d[i-N]+(i-N-1>=0?d[i-N-1]:0));}
 let pk=0;for(let i=0;i<len;i++){const x=Math.abs(d[i]);if(x>pk)pk=x;}if(pk>0){const k=0.9/pk;for(let i=0;i<len;i++)d[i]*=k;}
 v={buf,rate:f/(sr/(N+0.5))};KS.set(key,v);return v;}
function playGuitar(s,midi,t,dur,vel=0.85,bus='guitar'){const c=s.g.c;const {buf,rate}=ksBuf(c,midi);
 const src=c.createBufferSource();src.buffer=buf;src.playbackRate.value=rate;
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;lp.Q.value=0.5;
 const body=c.createBiquadFilter();body.type='peaking';body.frequency.value=210;body.Q.value=1;body.gain.value=4;
 const gn=c.createGain();const end=t+Math.max(0.09,dur);
 gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vel*0.6,t+0.003);gn.gain.setTargetAtTime(0,end,0.05);
 src.connect(lp);lp.connect(body);body.connect(gn);gn.connect(s.buses[bus]);src.start(t);src.stop(end+0.4);}
// FM electric piano
function playEP(s,midi,t,dur,vel=0.6,bus='comp'){const c=s.g.c,f=mtof(midi);
 const car=c.createOscillator(),mod=c.createOscillator(),mg=c.createGain(),amp=c.createGain(),p2=c.createOscillator(),p2g=c.createGain();
 car.frequency.value=f;mod.frequency.value=f;mg.gain.setValueAtTime(f*1.3*vel,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f*0.1),t+0.9);mod.connect(mg);mg.connect(car.frequency);
 p2.frequency.value=f*2;p2g.gain.setValueAtTime(0.05*vel,t);p2g.gain.exponentialRampToValueAtTime(0.0005,t+0.5);p2.connect(p2g);p2g.connect(amp);
 car.connect(amp);const end=t+Math.max(0.1,dur);
 amp.gain.setValueAtTime(0.0001,t);amp.gain.linearRampToValueAtTime(0.15*vel,t+0.006);amp.gain.setTargetAtTime(0.065*vel,t+0.01,0.5);amp.gain.setTargetAtTime(0,end,0.09);
 amp.connect(s.buses[bus]);[car,mod,p2].forEach(o=>{o.start(t);o.stop(end+0.7);});}
// Upright-ish bass
function playBass(s,midi,t,dur,vel=0.8){const c=s.g.c,f=mtof(midi);
 const o1=c.createOscillator(),o2=c.createOscillator(),o3=c.createOscillator(),g3=c.createGain(),lp=c.createBiquadFilter(),amp=c.createGain();
 o1.type='triangle';o1.frequency.value=f;o2.frequency.value=f;o3.type='sawtooth';o3.frequency.value=f;g3.gain.value=0.16;
 lp.type='lowpass';lp.Q.value=1.5;lp.frequency.setValueAtTime(1500,t);lp.frequency.exponentialRampToValueAtTime(420,t+0.25);
 o1.connect(lp);o3.connect(g3);g3.connect(lp);o2.connect(amp);lp.connect(amp);const end=t+Math.max(0.08,dur);
 amp.gain.setValueAtTime(0.0001,t);amp.gain.linearRampToValueAtTime(0.42*vel,t+0.008);amp.gain.setTargetAtTime(0.22*vel,t+0.012,0.25);amp.gain.setTargetAtTime(0,end,0.035);
 amp.connect(s.buses.bass);[o1,o2,o3].forEach(o=>{o.start(t);o.stop(end+0.3);});}
// Drums
function nz(s,t,filters,vel,attack,decay){const c=s.g.c;const src=c.createBufferSource();src.buffer=s.g.noise;let node=src;
 for(const [type,f,q] of filters){const b=c.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;node.connect(b);node=b;}
 const gn=c.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vel,t+attack);gn.gain.setTargetAtTime(0.0001,t+attack,decay);
 node.connect(gn);gn.connect(s.buses.drums);src.start(t,Math.random()*1.4);src.stop(t+attack+decay*7);}
function tone(s,t,type,f0,f1,vel,decay,bus='drums'){const c=s.g.c;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+0.08);
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vel,t+0.002);g.gain.setTargetAtTime(0.0001,t+0.002,decay);o.connect(g);g.connect(s.buses[bus]);o.start(t);o.stop(t+decay*8+0.02);}
const DR={
 ride:(s,t,v=1)=>{nz(s,t,[['highpass',4500],['bandpass',7800,0.7]],0.32*v,0.001,0.3);tone(s,t,'sine',5100,0,0.012*v,0.08);},
 hat:(s,t,v=1)=>nz(s,t,[['highpass',7500]],0.12*v,0.001,0.02),
 kick:(s,t,v=1)=>tone(s,t,'sine',95,45,0.6*v,0.11),
 snare:(s,t,v=1)=>{nz(s,t,[['bandpass',1900,0.7]],0.22*v,0.001,0.05);tone(s,t,'triangle',190,0,0.08*v,0.04);},
 brush:(s,t,v=1,len=0.4)=>nz(s,t,[['bandpass',2600,0.6]],0.07*v,0.06,len*0.4),
 rim:(s,t,v=1)=>{tone(s,t,'triangle',1750,0,0.16*v,0.012);nz(s,t,[['highpass',3000]],0.06*v,0.001,0.008);},
 shaker:(s,t,v=1)=>nz(s,t,[['highpass',6000]],0.07*v,0.008,0.022)
};
function click(s,t,acc){tone(s,t,'sine',acc?1650:1100,0,acc?0.5:0.35,0.016,'click');}

// =====================================================================
//  ARRANGER — walking bass, comping, drums
// =====================================================================
function swingPos(b,sw){const i=Math.floor(b+1e-9);const f=b-i;if(Math.abs(f*3-Math.round(f*3))<1e-6&&Math.abs(f-0.5)>1e-6&&f>1e-6)return b;return i+(f<=0.5?(f/0.5)*sw:sw+((f-0.5)/0.5)*(1-sw));}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function walk(P,N,beats,st){
 const lo=33,hi=50;const r=near(P.bass!=null?P.bass:P.root,st.bass==null?38:st.bass,lo,hi);const out=[r];if(beats===1){st.bass=r;return out;}
 const nr=near(N.bass!=null?N.bass:N.root,r,lo,hi);const iv=P.Q.iv,sc=SCALES[P.Q.sc].iv;
 const third=iv[1]>=5?iv[1]-0:iv[1];const fifth=iv.find(x=>x>=6&&x<=8)??7;const sev=iv.find(x=>x>=9&&x<=11)??10;
 const up=nr>=r;let mids=[];
 if(beats>=4){const opts=up?[[third,fifth],[sc[1],third],[fifth,sc[5]],[third,fifth]]:[[sev-12,fifth-12],[sc[6]-12,sc[5]-12],[third,sc[1]],[fifth-12,third-12]];
  for(let k=0;k<5;k++){const o=rnd(opts).map(x=>r+x);if(o.every(m=>m>=lo-2&&m<=hi+2)){mids=o;break;}}if(!mids.length)mids=[r+third,r+fifth];if(beats>4){}}
 else if(beats===3){mids=[up?r+third:r+sev-12];}
 const last=mids.length?mids[mids.length-1]:r;let ap;
 if(N.bass==null&&Math.random()<0.22){ap=near((N.root+7)%12,last,lo,hi);}else ap=last<nr?nr-1:nr+1;
 if(ap===last)ap=last<nr?nr+1:nr-1;
 out.push(...mids,ap);st.bass=ap;return out;}
function bassSeg(s,ch,next,b0,beats,T,spb,o,st){const P=ch.p,N=next.p;
 if(o.style==='bossa'){const r=near(P.bass!=null?P.bass:P.root,st.bass==null?40:st.bass,33,50);const f5=r+7>52?r-5:r+7;
  const ev=beats>=4?[[0,1.4,r],[1.5,0.45,f5],[2,1.4,f5],[3.5,0.45,r]]:[[0,1.4,r],[1.5,0.45,f5]];ev.forEach(([b,d,m])=>playBass(s,m,T(b0+b),d*spb,0.85));st.bass=r;return;}
 if(o.style==='pop'){const r=near(P.bass!=null?P.bass:P.root,st.bass==null?40:st.bass,33,50);const f5=r+7>52?r-5:r+7;const pat=beats>=4?[r,r,f5,r]:beats>=2?[r,f5]:[r];pat.forEach((m,i)=>playBass(s,m,T(b0+i),spb*0.85,i===0?0.95:0.8));st.bass=r;return;}
 if(o.style==='ballad'){const r=near(P.bass!=null?P.bass:P.root,st.bass==null?38:st.bass,33,50);if(beats>=4){const nr=near(N.root,r,33,50);const m2=Math.random()<0.5?(r+7>52?r-5:r+7):(nr<r?nr+1:nr-1);
   playBass(s,r,T(b0),1.9*spb,0.85);playBass(s,m2,T(b0+2),1.9*spb,0.75);st.bass=m2;}else{playBass(s,r,T(b0),beats*spb*0.95,0.85);st.bass=r;}return;}
 walk(P,N,beats,st).forEach((m,i)=>playBass(s,m,T(b0+i),spb*0.92,i===0?0.95:0.8));}
function compSeg(s,ch,b0,beats,T,spb,o,st){const P=ch.p;const center=st.center||62;
 let notes=[...new Set(P.Q.v.map(x=>near((P.root+x)%12,center,52,74)))].sort((a,b)=>a-b);
 st.center=notes.reduce((a,b)=>a+b,0)/notes.length*0.6+62*0.4;
 let hits;
 if(o.style==='bossa')hits=beats>=4?rnd([[[0,0.8],[1.5,0.8],[3,0.8]],[[0,0.8],[1.5,0.8],[2.5,0.8]],[[0.5,0.8],[1.5,0.8],[3,0.8]]]):[[0,0.8],[1.5,0.4]];
 else if(o.style==='pop')hits=beats>=4?[[0,1.4],[1.5,0.9],[2.5,1.4]]:[[0,1.4],[1.5,0.4]];
 else if(o.style==='ballad')hits=beats>=4?rnd([[[0,3.8]],[[0,1.8],[2,1.8]],[[0,2.4],[2.5,1.3]]]):[[0,beats*0.95]];
 else hits=beats>=4?rnd([[[0,1.2],[1.5,0.5]],[[1.5,0.5],[3,0.7]],[[0,0.9],[2.5,0.5]],[[1.5,1.2]],[[0,0.6],[2,0.6]],[[2.5,0.9]],[[1,0.5],[2.5,0.5]],[[0,1.2],[1.5,0.5],[3.5,0.4]]]):rnd([[[0,0.9]],[[1.5,0.4]],[[0,0.6],[1.5,0.4]],[[0.5,0.4]]]);
 for(const [h,d] of hits){if(h>=beats)continue;const t=T(b0+h);
  if(o.compInst==='guitar')notes.forEach((m,k)=>playGuitar(s,m,t+k*0.012,d*spb,0.5,'comp'));
  else notes.forEach(m=>playEP(s,m,t+(Math.random()*0.006),d*spb,0.6));}}
function drumsBar(s,t0,spb,sw,o,bi){const T=b=>t0+swingPos(b,sw)*spb;const H=()=>(Math.random()-0.5)*0.004;
 if(o.style==='bossa'){for(let k=0;k<8;k++)DR.shaker(s,T(k*0.5)+H(),k%2?0.6:1);
  (bi%2===0?[0,1.5,3]:[1,2]).forEach(b=>DR.rim(s,T(b),0.8));[0,1.5,2,3.5].forEach(b=>DR.kick(s,T(b),b%2===0?0.7:0.45));return;}
 if(o.style==='pop'){for(let k=0;k<8;k++)DR.hat(s,T(k*0.5)+H(),k%2?0.5:0.9);[0,2,2.5].forEach(b=>DR.kick(s,T(b),0.8));[1,3].forEach(b=>DR.snare(s,T(b),0.75));return;}
 if(o.style==='ballad'){for(let b=0;b<4;b++)DR.brush(s,T(b),b%2?1:0.7,spb*0.95);DR.hat(s,T(1),0.6);DR.hat(s,T(3),0.6);[0,2].forEach(b=>DR.kick(s,T(b),0.2));return;}
 [[0,0.75],[1,1],[1.67,0.55],[2,0.75],[3,1],[3.67,0.55]].forEach(([b,v])=>{const pos=b%1?Math.floor(b)+0.5:b;DR.ride(s,T(pos)+H(),v*(0.9+Math.random()*0.2));});
 DR.hat(s,T(1),0.9);DR.hat(s,T(3),0.9);for(let b=0;b<4;b++)DR.kick(s,T(b),0.13);
 if(Math.random()<0.35)DR.snare(s,T(rnd([1.5,2.5,3.5])),0.22+Math.random()*0.15);
 if(o.lastBar&&Math.random()<0.7){DR.snare(s,T(3.5),0.5);}}
function renderBar(s,bar,nextBar,t0,spb,o,st,bi){
 const sw=(o.style==='bossa'||o.style==='pop'||o.straight)?0.5:o.swing;const T=b=>t0+swingPos(b,sw)*spb;
 if(o.parts.drums)drumsBar(s,t0,spb,sw,o,bi);
 let beat=0;bar.chords.forEach((ch,i)=>{const next=bar.chords[i+1]||(nextBar?nextBar.chords[0]:ch);
  if(o.parts.bass)bassSeg(s,ch,next,beat,ch.beats,T,spb,o,st);
  if(o.parts.comp)compSeg(s,ch,beat,ch.beats,T,spb,o,st);beat+=ch.beats;});}
function scheduleMelody(s,song,bi,t0,spb,o,ui){
 const sw=(o.style==='bossa'||o.style==='pop'||o.straight)?0.5:o.swing;
 for(const e of song.melody){if(e.start<bi*4-1e-6||e.start>=(bi+1)*4-1e-6)continue;
  const rel=e.start-bi*4;const tt=t0+swingPos(rel,sw)*spb;const te=t0+swingPos(Math.min(4,rel+e.dur),sw)*spb;
  if(o.parts.guitar&&e.notes.length){const ns=[...e.notes].sort((a,b)=>e.up?a.s-b.s:b.s-a.s);const acc=(rel%1)>0.01?0.95:0.82;const low=Math.max(...e.notes.map(n=>n.s));const ringD=(o.ring||0)*spb;
   ns.forEach((n,k)=>{let d=Math.max(0.1,te-tt-0.02);if(ringD&&(n.s>=5||(e.notes.length>1&&n.s===low)))d=Math.max(d,ringD-0.03);playGuitar(s,n.midi,tt+k*(ns.length>1?0.014:0),d,acc*(ns.length>1?0.75:1));});}
  if(ui)ui.push({t:tt,type:'note',idx:e.idx,ev:e});}}

// =====================================================================
const TP={playing:false};
function tpStart(song,o){const c=ctx();if(!c)return;tpStop();metStop();
 Object.assign(TP,{song,o,s:newSession(LIVE,o.mix),st:{},ui:[],playing:true,started:Date.now(),loopN:0,endAt:null});
 TP.bar=o.countIn?-1:(o.startBar||0);TP.t=c.currentTime+0.12;
 TP.timer=setInterval(tpTick,25);tpTick();requestAnimationFrame(tpFrame);updateMini();}
function tpTick(){if(!TP.playing)return;const c=ACTX;while(TP.playing&&TP.endAt===null&&TP.t<c.currentTime+0.3)tpScheduleBar();
 if(TP.endAt!==null&&c.currentTime>TP.endAt+0.4)tpStop();}
function tpScheduleBar(){const o=TP.o,song=TP.song,spb=60/o.bpm,t0=TP.t;
 if(TP.bar<0){for(let b=0;b<4;b++){click(TP.s,t0+b*spb,b===0);TP.ui.push({t:t0+b*spb,type:'count',n:b+1});}TP.t+=4*spb;TP.bar=o.startBar||0;return;}
 if(TP.bar>=song.bars.length){TP.loopN++;if(o.loop){TP.bar=0;}else{TP.endAt=t0;TP.ui.push({t:t0,type:'end'});return;}}
 const i=TP.bar,bar=song.bars[i],next=song.bars[i+1]||(o.loop?song.bars[0]:null);
 o.lastBar=(i===song.bars.length-1);
 renderBar(TP.s,bar,next,t0,spb,o,TP.st,i);
 if(o.click)for(let b=0;b<4;b++)click(TP.s,t0+b*spb,b===0);
 if(song.melody)scheduleMelody(TP.s,song,i,t0,spb,o,TP.ui);
 for(let b=0;b<4;b++)TP.ui.push({t:t0+b*spb,type:'beat',bar:i,beat:b});
 TP.ui.sort((a,b)=>a.t-b.t);TP.t+=4*spb;TP.bar++;}
function tpFrame(){if(!TP.playing)return;const now=ACTX.currentTime;while(TP.ui.length&&TP.ui[0].t<=now){const e=TP.ui.shift();try{TP.o.onUI&&TP.o.onUI(e);}catch(err){}}requestAnimationFrame(tpFrame);}

 try{TP.o.onStop&&TP.o.onStop();}catch(e){}updateMini();}

async function renderWav(song,o,loops){const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const sr=44100,spb=60/o.bpm;

 const oo=Object.assign({},o);
 for(let L=0;L<loops;L++)for(let i=0;i<song.bars.length;i++){const next=song.bars[i+1]||song.bars[0];oo.lastBar=(i===song.bars.length-1);renderBar(s,song.bars[i],next,t,spb,oo,st,i);if(song.melody)scheduleMelody(s,song,i,t,spb,oo,null);t+=4*spb;}
 // final chord
 const last=song.bars[0].chords[0].p;playBass(s,near(last.root,40,33,50),t,2.5,0.9);last.Q.v.forEach(x=>playEP(s,near((last.root+x)%12,62,52,74),t,2.5,0.6));DR.ride(s,t,1);
 const buf=await oc.startRendering();return wavBlob(buf);}
function wavBlob(buf){const ch=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate;const data=new DataView(new ArrayBuffer(44+len*ch*2));
 const W=(o,s)=>{for(let i=0;i<s.length;i++)data.setUint8(o+i,s.charCodeAt(i));};
 W(0,'RIFF');data.setUint32(4,36+len*ch*2,true);W(8,'WAVE');W(12,'fmt ');data.setUint32(16,16,true);data.setUint16(20,1,true);data.setUint16(22,ch,true);data.setUint32(24,sr,true);data.setUint32(28,sr*ch*2,true);data.setUint16(32,ch*2,true);data.setUint16(34,16,true);W(36,'data');data.setUint32(40,len*ch*2,true);
 const chans=[];for(let c=0;c<ch;c++)chans.push(buf.getChannelData(c));let p=44;
 for(let i=0;i<len;i++)for(let c=0;c<ch;c++){const v=Math.max(-1,Math.min(1,chans[c][i]));data.setInt16(p,v<0?v*0x8000:v*0x7fff,true);p+=2;}
 return new Blob([data],{type:'audio/wav'});}

function yinPitch(buf,sr,minF=60,maxF=1400,thr=0.12){const W=Math.floor(buf.length/2);const maxT=Math.min(W-1,Math.floor(sr/minF)),minT=Math.max(2,Math.floor(sr/maxF));
 let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);if(rms<1e-4)return {f:0,conf:0,rms};
 const d=new Float32Array(maxT+2);for(let t=1;t<=maxT+1;t++){let s=0;for(let j=0;j<W;j++){const v=buf[j]-buf[j+t];s+=v*v;}d[t]=s;}
 const c=new Float32Array(maxT+2);c[0]=1;let run=0;for(let t=1;t<=maxT+1;t++){run+=d[t];c[t]=run>0?d[t]*t/run:1;}
 let tau=-1;for(let t=minT;t<=maxT;t++){if(c[t]<thr){while(t+1<=maxT&&c[t+1]<c[t])t++;tau=t;break;}}
 if(tau<0){let b=minT;for(let t=minT;t<=maxT;t++)if(c[t]<c[b])b=t;if(c[b]>0.35)return {f:0,conf:0,rms};tau=b;}
 const a=c[tau-1],b=c[tau],e=c[tau+1];const den=a+e-2*b;const shift=den?0.5*(a-e)/den:0;return {f:sr/(tau+(Math.abs(shift)<1?shift:0)),conf:1-b,rms};}

     $('#rprog').style.display='block';try{const hb=parseFloat(($('#ltempo')||{}).value);const R=await analyzeAudio(buf,v=>$('#rprog i').style.width=(v*100)+'%',hb>=40&&hb<=300?{bpm:hb}:null);if(REC.audioURL&&REC.audioURL.startsWith('blob:'))URL.revokeObjectURL(REC.audioURL);REC.audioURL=null;
      const title=($('#ltitle')&&$('#ltitle').value.trim())||'Captured song';Store.set('recLinkName',title);showResult(R,title);$('#rres').scrollIntoView({behavior:'smooth'});}

  function showResult(R,title){const st={bpm:R.bpm,off:0};const segs=R.segs;const keyName=pretty(FLAT[R.key.r])+(R.key.minor?' minor':' major');const keyObj={r:R.key.minor?(R.key.r+3)%12:R.key.r};

    <div style="overflow-x:auto" id="rtlw"><div id="rtl" style="position:relative;height:58px;width:${Math.ceil(R.dur*scale)}px">${segs.map((g,i)=>`<div class="rseg ${g.sym==='N'?'n':''}" data-i="${i}" style="left:${g.start*scale}px;width:${Math.max(2,(g.end-g.start)*scale-2)}px">${(g.end-g.start)*scale>34?pretty(g.sym==='N'?'·':g.sym):''}</div>`).join('')}<i id="rcur" style="position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0"></i></div></div>
    <div class="hint">Tap a block to jump there. Roman numerals are relative to ${R.key.minor?pretty(FLAT[keyObj.r])+' major (the relative major of '+keyName+')':keyName}.</div></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px">
    <div class="card"><h3 style="margin-bottom:10px">Chord shapes detected</h3><div class="cdgrid">${uniq.slice(0,24).map(sym=>{const fr=shapeOf(sym);const p=parseChord(sym);return fr?`<div class="ccard">${chordDiagram(fr,{root:p.root,q:p.q,name:sym})}<b>${pretty(sym)}</b><small>${romanOf(sym,keyObj)}</small><button class="btn sm" data-strum="${fr.map(f=>f==null?'':f).join(',')}">${ic('play',1)} Hear</button></div>`:'';}).join('')}</div></div>
    <div class="card"><h3 style="margin-bottom:10px">Timeline</h3><div class="tblwrap" style="max-height:340px;overflow:auto"><table class="atbl" style="min-width:0"><thead><tr><th>Time</th><th>Chord</th><th>Function</th><th>Length</th></tr></thead><tbody>${segs.filter(s=>s.sym!=='N').map(g=>`<tr><td>${Math.floor(g.start/60)}:${String(Math.floor(g.start%60)).padStart(2,'0')}</td><td>${pretty(g.sym)}</td><td>${romanOf(g.sym,keyObj)}</td><td>${(g.end-g.start).toFixed(1)} s</td></tr>`).join('')}</tbody></table></div></div></div>
   <div class="card" style="margin-top:14px;display:grid;gap:12px"><h3>Chord chart (bars of 4/4)</h3><div class="two"><label class="f">Tempo (BPM)<input type="text" id="rbpm" value="${R.bpm}"></label><label class="f">Shift bar lines (beats)<select id="roff">${[0,1,2,3].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></label></div>
    <div id="rgridw"></div><label class="f">Chart — edit freely<textarea id="rchart" rows="5"></textarea></label>
    <div class="row"><label class="f" style="flex:1">Title<input type="text" id="rtitle" value="${title.replace(/"/g,'')}"></label></div>
    <div class="row"><button class="btn pri" id="rsave">${ic('chord')} Save → tab, shapes & soundtrack</button><a class="btn" href="#/jam/custom" id="rjam">${ic('jam')} Send to Jam Room</button></a><button class="btn" id="rtxt">${ic('dl')} Chart (.txt)</button></div></div>`;
   const mkChart=()=>{const bars=segsToBars(segs,+$('#rbpm').value||R.bpm,R.phase,+$('#roff').value);$('#rchart').value=bars.length?bars.reduce((a,b,i)=>a+(i?(i%4===0?' |\n':' | '):'')+b,''):'';};mkChart();
   const drawRG=()=>{const bars=parseProg($('#rchart').value.replace(/\n/g,' '));$('#rgridw').innerHTML=bars.length?gridCard([{name:'',bars}],title,'Detected chords · '+keyName,'gridR'):'';if(bars.length)mountGrid('gridR',[{name:'',bars}],title,'Detected chords · '+keyName);};drawRG();$('#rchart').oninput=drawRG;
   $('#rbpm').onchange=()=>{mkChart();drawRG();};$('#roff').onchange=()=>{mkChart();drawRG();};
   const au=$('#rau');$('#rtl').onclick=ev=>{const d=ev.target.closest('[data-i]');if(d&&au){au.currentTime=segs[+d.dataset.i].start+0.01;au.play();}};
   let lastI=-1;const tick=()=>{if(!$('#rau'))return;const t=au.currentTime;$('#rcur').style.left=(t*scale)+'px';const i=segs.findIndex(g=>t>=g.start&&t<g.end);if(i!==lastI&&i>=0){lastI=i;$$('.rseg.on').forEach(x=>x.classList.remove('on'));const el=$(`.rseg[data-i="${i}"]`);if(el){el.classList.add('on');const w=$('#rtlw');if(!au.paused&&(el.offsetLeft<w.scrollLeft||el.offsetLeft>w.scrollLeft+w.clientWidth-60))w.scrollLeft=el.offsetLeft-40;}$('#rnow').textContent=segs[i].sym==='N'?'–':pretty(segs[i].sym);}REC.raf=requestAnimationFrame(tick);};REC.raf=requestAnimationFrame(tick);
   const chartStr=()=>$('#rchart').value.replace(/\n/g,' ');
   $('#rjam').onclick=()=>{JAM_PENDING={title:$('#rtitle').value,prog:chartStr(),bpm:+$('#rbpm').value||R.bpm,style:'swing'};};
   $('#rtxt').onclick=()=>{const blob=new Blob([`${$('#rtitle').value}\nKey: ${keyName}  Tempo: ${$('#rbpm').value} BPM\n\n${$('#rchart').value}\n`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slugOf($('#rtitle').value||'chart')+'-chords.txt';a.click();};
   $('#rsave').onclick=()=>{const t=($('#rtitle').value||'My transcription').trim();const ch=chartStr();if(!parseProg(ch).length){toast('The chart is empty');return;}const sl=slugOf(t);
    const my=Store.get('mySongs',[]);if(!my.includes(t))my.push(t);Store.set('mySongs',my);const all=Store.get('stdCharts',{});all[sl]={key:keyName,form:'Transcribed by ear-analysis',style:'swing',bpm:Math.max(40,Math.min(300,+$('#rbpm').value||R.bpm)),chart:'A: '+ch};Store.set('stdCharts',all);toast('Saved to Repertoire');location.hash='#/standard/'+sl;};}
 }
 if(T==='live'){
  ui.innerHTML=`<div class="card metro"><div class="eyebrow">Listening</div><div class="tuneNote" id="lchord">–</div><div class="muted" id="lconf">Tap Start, then play or strum a chord (or play a recording near the microphone).</div><div id="lbars">${chromaBars(new Float32Array(12).fill(0.01))}</div><div id="ldia"></div>

  $('#lgo').onclick=async()=>{if(REC.stream){recStop();$('#lgo').innerHTML=`${ic('ear')} Start listening`;return;}const c=ctx();if(!c)return;
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#lconf').textContent='Microphone not available in this browser.';return;}
   try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}catch(e){$('#lconf').textContent='Microphone permission was blocked.';return;}
   const src=c.createMediaStreamSource(REC.stream);const an=c.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0.5;src.connect(an);const db=new Float32Array(an.frequencyBinCount);const map=chromaMap(an.fftSize,c.sampleRate);
   const ema=new Float32Array(12),emb=new Float32Array(12);let last='',hist=[];$('#lgo').innerHTML=`${ic('stop',1)} Stop`;
   REC.timer=setInterval(()=>{if(!$('#lchord')){recStop();return;}an.getFloatFrequencyData(db);const cc=new Float32Array(12),bb=new Float32Array(12);let en=0;
    for(const [k,pc,w,isB] of map){const m=Math.pow(10,db[k]/20);const v=Math.sqrt(m);cc[pc]+=v*w;if(isB)bb[pc]+=v*isB;en+=m;}
    for(let i=0;i<12;i++){ema[i]=ema[i]*0.55+cc[i]*0.45;emb[i]=emb[i]*0.55+bb[i]*0.45;}$('#lbars').innerHTML=chromaBars(ema);
    if(en<1e-4){$('#lconf').textContent='Too quiet — play a little louder';return;}
    const sc=scoreChroma(ema,emb);let bi=0;for(let i=1;i<sc.length;i++)if(sc[i]>sc[bi])bi=i;const t=REC_T[bi];const sym=recSym(t.r,t.q);
    $('#lchord').textContent=pretty(sym);$('#lconf').textContent=`Confidence ${Math.round(Math.max(0,Math.min(1,(sc[bi]-0.55)/0.4))*100)}%`;
    if(sym!==last){last=sym;const fr=shapeOf(sym);const p=parseChord(sym);$('#ldia').innerHTML=fr?`<div class="ccard" style="max-width:170px;margin:auto">${chordDiagram(fr,{root:p.root,q:p.q,name:sym})}<small>Suggested shape</small></div>`:'';
     if(hist[hist.length-1]!==sym){hist.push(sym);if(hist.length>12)hist.shift();$('#lhist').textContent=hist.map(pretty).join(' → ');}}},160);};
 }
 if(T==='name'){const sel=[null,null,null,null,null,null];
  ui.innerHTML=`<div class="card"><div class="flabel">Tap one fret per string (tap again to clear; the open “o” column = open string)</div><div class="fbscroll" id="nfb"></div>

   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px"><div class="card ccard" id="ndia" style="align-items:center"></div><div class="card"><h3 style="margin-bottom:10px">This chord is…</h3><div id="nres" class="reps"></div></div></div>`;
  const draw=()=>{const dots=[];sel.forEach((f,i)=>{if(f!=null)dots.push({s:6-i,f,l:pretty(FLAT[(OPEN[6-i]+f)%12]),cls:'root'});});$('#nfb').innerHTML=fretboard({from:0,to:15,w:1100,sg:26,dots,hits:true});
   const midis=sel.map((f,i)=>f==null?null:OPEN[6-i]+f).filter(x=>x!=null);const names=nameChord(midis);
   $('#ndia').innerHTML=midis.length?`${chordDiagram(sel,names[0]?{root:names[0].r,q:names[0].q,name:names[0].name}:{})}<b style="font-family:var(--serif);font-size:24px">${names[0]?names[0].name:'?'}</b><small>${[...new Set(midis.map(m=>pretty(FLAT[m%12])))].join(' · ')}</small>`:'<span class="muted">Tap the fretboard to build a chord</span>';
   $('#nres').innerHTML=midis.length<2?'<p class="muted">Add at least two notes.</p>':names.length?names.map((n,i)=>`<div class="rep"><div class="rt2"><b>${n.name}</b><small>${i===0?'Most likely':'Alternative'} · ${QUALS[n.q].n}${n.missing.length?' · omits '+n.missing.join(', '):''}</small></div></div>`).join(''):'<p class="muted">No standard chord name — try adding or removing a note.</p>';};
  $('#nfb').onclick=e=>{const h=e.target.closest('[data-s]');if(!h)return;const s=+h.dataset.s,f=+h.dataset.f;sel[6-s]=sel[6-s]===f?null:f;draw();const fs=fx();if(fs&&sel[6-s]!=null)playGuitar(fs,OPEN[s]+f,ACTX.currentTime+0.01,1.2,0.8);};
  $('#nclr').onclick=()=>{sel.fill(null);draw();};$('#nplay').onclick=()=>strumFrets(sel,false);draw();}
