{id:14,title:'Instrument Basics',color:'#e6b450',blurb:'Parts of the guitar, string names, tuning, posture and picking.',lessons:[
 {id:'14-1',title:'Parts of the Guitar & String Names',mins:10,bpm:70,style:'pop',straight:true,chords:['Em7','Em7','Em7','Em7'],
  tab:'6/0q 5/0q 4/0q 3/0q | 2/0q 1/0q 2/0q 3/0q | 4/0q 5/0q 6/0h | [6/0,5/0,4/0,3/0,2/0,1/0]w',
  html:'<p>Before playing, learn the map of your instrument. The <b>headstock</b> holds the <b>tuning pegs</b>. The strings pass over the <b>nut</b> and run along the <b>neck</b>, whose <b>fretboard</b> is divided by metal <b>frets</b>. On the <b>body</b>, the strings are anchored at the <b>bridge</b>; jazz archtops have <b>f-holes</b> and a <b>pickup</b>.</p><p>The six open strings, from the thickest (6th) to the thinnest (1st), are <b>E A D G B E</b>. A handy phrase: <i>“Eddie Ate Dynamite, Good Bye Eddie.”</i> In tab, the top line is the thin high-E string, and the number on a line is the fret to press — 0 means open.</p>',
  table:{title:'The six strings (standard tuning)',head:['String','Name','Pitch','Frequency'],rows:[['6 (thickest)','E','E2','82.4 Hz'],['5','A','A2','110.0 Hz'],['4','D','D3','146.8 Hz'],['3','G','G3','196.0 Hz'],['2','B','B3','246.9 Hz'],['1 (thinnest)','E','E4','329.6 Hz']]},
  keys:['Headstock, nut, neck, frets, body, bridge','Strings 6→1: E A D G B E','Tab: top line = high E string','0 = open string; numbers = frets'],
  usage:['Use string numbers and names when reading lessons and tabs','Tab tells you where to play; your ear and the audio tell you rhythm','Learn the string names now — every later lesson relies on them'],
  drills:['Say each string name aloud as you pluck it, low to high and back','Close your eyes and pluck a string your partner (or the app) names','Read the tab and play it without looking at the screen'],
  cues:['Low to high: E, A, D, G','B, E… and back down','D, A, low E','Strum all six open strings'],
  figs:[{type:'parts',title:'Parts of the jazz guitar'}]},
 {id:'14-2',title:'Tuning Your Guitar',mins:15,bpm:60,band:false,straight:true,chords:['A','D','G','B','E','E'],
  tab:'6/5h 5/0h | 5/5h 4/0h | 4/5h 3/0h | 3/4h 2/0h | 2/5h 1/0h | [6/0,5/2,4/2,3/1,2/0,1/0]w',
  html:'<p>An out-of-tune guitar makes perfect playing sound wrong, so tune every time you pick it up. The easiest method is the <b>Tuner</b> in this app (Tools → Tuner): play a string, and turn its peg until the needle is centred and green. Turning the peg tightens the string and raises the pitch; loosening it lowers the pitch. Always tune <b>up</b> to the note — if you are sharp, go below the note and come back up.</p><p>To check by ear, use the <b>5th-fret method</b>. The 5th fret of each string matches the next open string — except on the G string, where you use the <b>4th fret</b> to match B. The exercise plays each matching pair.</p>',
  keys:['Use the built-in Tuner (Tools → Tuner)','Tighten = higher, loosen = lower','Always tune up to the note','5th-fret method (4th fret on G)'],
  usage:['Tune before every practice session — strings drift with temperature','Use the tuner’s reference tones if your microphone isn’t available','Use the 5th-fret method to fine-tune by ear and train your listening'],
  drills:['Detune one string slightly, then retune it by ear using the 5th-fret method','Check your tuning with an E chord: it should sound smooth, not “wobbly”','Tune with the Tuner, then compare against the reference tones'],
  cues:['5th fret low E = open A','5th fret A = open D','5th fret D = open G','4th fret G = open B','5th fret B = open high E','Check with an E chord'],
  figs:[{type:'dots',from:0,to:5,title:'Matching notes for tuning',cap:'Each pair should sound identical',dots:[{s:6,f:5,l:'A',cls:'root'},{s:5,f:0,l:'A',cls:'root'},{s:5,f:5,l:'D',cls:'ct'},{s:4,f:0,l:'D',cls:'ct'},{s:4,f:5,l:'G',cls:'root'},{s:3,f:0,l:'G',cls:'root'},{s:3,f:4,l:'B',cls:'ct'},{s:2,f:0,l:'B',cls:'ct'},{s:2,f:5,l:'E',cls:'root'},{s:1,f:0,l:'E',cls:'root'}]}]},
 {id:'14-3',title:'Holding the Guitar & Picking Mechanics',mins:15,bpm:70,style:'pop',straight:true,chords:['Em','Em','Em','Em'],
  tab:R('6/0',4)+' '+R('5/0',4)+' | '+R('4/0',4)+' '+R('3/0',4)+' | '+R('2/0',4)+' '+R('1/0',4)+' | 1/0q 2/0q 3/0q 4/0q',
  html:'<p><b>Posture:</b> sit upright with the guitar’s waist on your right leg (or left leg, classical style). Keep the neck angled slightly upward, and relax your shoulders. Your fretting thumb rests behind the neck, roughly opposite your middle finger.</p><p><b>Pick grip:</b> hold the pick between the pad of your thumb and the side of your index finger, with only 2–3 mm showing. Move from the <b>wrist</b>, not the elbow. <b>Alternate picking</b> means down-strokes on the beat and up-strokes on the “and”. It is the foundation of fast, even playing.</p>',
  keys:['Upright, relaxed posture','Thumb + side of index finger, little pick showing','Move from the wrist','Down on the beat, up on the “and”'],
  usage:['Alternate pick every eighth-note line in this course','Keep pick motion small — big swings slow you down','Practise slowly with the click before speeding up'],
  drills:['Play each open string 8 times, strictly down-up, at 60 BPM','Then 80 and 100 BPM','Record yourself and listen for even volume between down- and up-strokes'],
  cues:['Down-up on the low E, then A','D and G strings','B and high E strings','Quarter notes: all down-strokes'],
  figs:[{type:'parts',title:'Know your instrument'}]},
 {id:'14-4',title:'Fretting & Finger Independence',mins:15,bpm:70,band:false,click:true,straight:true,chords:['E','E','E','E'],
  tab:'6/1 6/2 6/3 6/4 5/1 5/2 5/3 5/4 | 4/1 4/2 4/3 4/4 3/1 3/2 3/3 3/4 | 2/1 2/2 2/3 2/4 1/1 1/2 1/3 1/4 | 1/4 1/3 1/2 1/1 2/4 2/3 2/2 2/1',
  html:'<p>Press the string with your fingertip <b>just behind the fret</b> — not on top of it and not in the middle of the gap. You need surprisingly little pressure: press just enough for a clean note.</p><p>This <b>chromatic “spider”</b> exercise uses one finger per fret: finger 1 on fret 1, finger 2 on fret 2, and so on. Leave each finger down until the next one lands. It builds strength, accuracy and finger independence, and it is the classic warm-up.</p>',
  keys:['Fingertip just behind the fret','Minimum pressure for a clean tone','One finger per fret','Keep fingers close to the strings'],
  usage:['Use as a 3-minute warm-up before every session','Shift the exercise up the neck (frets 5–8) when it gets easy','Watch for buzzing — it means you are too far from the fret or not pressing enough'],
  drills:['Play the spider at 60 BPM, then increase by 5 BPM each day','Reverse the finger order: 4-3-2-1','Try finger patterns 1-3-2-4 and 1-4-2-3'],
  cues:['Fingers 1-2-3-4 on the low strings','Middle strings','Top strings','Back down the high strings'],
  figs:[{type:'dots',from:0,to:5,title:'One finger per fret',cap:'Index on fret 1 … pinky on fret 4',dots:[1,2,3,4].map(f=>({s:6,f,l:String(f),cls:f===1?'root':'ct'}))}]}
]},
{id:15,title:'Open Chords & Strumming',color:'#ffb86c',blurb:'Your first chords, strumming patterns and songs.',lessons:[
 {id:'15-1',title:'Open Major Chords: A, D & E',mins:20,bpm:80,style:'pop',straight:true,strum:true,comp:false,chords:['A','D','E','A'],
  tab:Q4(CH.A)+' | '+Q4(CH.D)+' | '+Q4(CH.E)+' | '+CH.A+'w',
  html:'<p><b>Open chords</b> mix fretted and open strings. They are the first chords every guitarist learns. Start with <b>A</b>, <b>D</b> and <b>E</b>: together they are the I, IV and V chords of A major, so you can already play hundreds of songs.</p><p>In the diagrams, the vertical lines are strings (low E on the left), dots are fingers, “o” means play the string open and “×” means don’t play it. Strum with steady down-strokes, and change chord <b>on time</b> even if the new chord isn’t perfect yet.</p>',
  keys:['A, D and E = I, IV, V in A','“o” = open, “×” = don’t play','Steady down-strokes','Change on time, then clean up'],
  usage:['Use A–D–E for blues, rock, folk and country songs in A','Find “anchor” fingers that stay down between chords','Practise slow, even changes before strumming faster'],
  drills:['One-minute changes: count how many A→D changes you can make in 60 seconds','Repeat for D→E and E→A','Strum each chord 4 times, then 2, then 1'],
  cues:['A major — 4 down-strokes','D major','E major','Back to A'],
  figs:[{type:'chords',title:'A, D and E',items:[{name:'A',frets:FR.A},{name:'D',frets:FR.D},{name:'E',frets:FR.E}]}]},
 {id:'15-2',title:'C, G and the Minor Chords Am, Em, Dm',mins:25,bpm:80,style:'pop',straight:true,strum:true,comp:false,chords:['C','Am','Dm','G','Em','Am','Dm','G'],
  tab:[CH.C,CH.Am,CH.Dm,CH.G,CH.Em,CH.Am,CH.Dm,CH.G].map(Q4).join(' | '),
  html:'<p><b>C</b> and <b>G</b> complete the essential major chords. <b>Am</b>, <b>Em</b> and <b>Dm</b> are the core minor chords — darker in sound because their 3rd is lowered.</p><p>Notice how C and Am differ by just one finger, and so do E and Em. Learning chords in pairs like this makes changes much faster. The progression C–Am–Dm–G is the famous “I–vi–ii–V”, and it is also the ancestor of the jazz turnaround you will play later.</p>',
  keys:['Majors: C, G (plus A, D, E)','Minors: Am, Em, Dm','C ↔ Am and E ↔ Em: one finger changes','I–vi–ii–V = C Am Dm G'],
  usage:['Use C, G, Am, Em and Dm to play in the key of C or G','Look for shared fingers to make changes faster','I–vi–ii–V is everywhere — pop, doo-wop and jazz'],
  drills:['One-minute changes for C→Am, Am→Dm, Dm→G','Play the progression with 2 strums per chord','Swap Em in for C to hear how close they sound'],
  cues:['C major','A minor — move one finger','D minor','G major','E minor','A minor','D minor','G — back to the top'],
  figs:[{type:'chords',title:'C, G and the minor chords',items:[{name:'C',frets:FR.C},{name:'G',frets:FR.G},{name:'Am',frets:FR.Am},{name:'Em',frets:FR.Em},{name:'Dm',frets:FR.Dm}]}]},
 {id:'15-3',title:'Strumming Patterns',mins:20,bpm:80,style:'pop',straight:true,strum:true,comp:false,chords:['G','C','D','G'],
  tab:[CH.G,CH.C,CH.D,CH.G].map(STRUM1).join(' | '),
  html:'<p>Good rhythm is more important than fancy chords. The secret is to keep your strumming hand moving <b>down–up</b> in steady eighth notes all the time, like a pendulum. To make a pattern, you simply <b>miss</b> the strings on some strokes.</p><p>This classic pattern is <b>Down, Down-Up, Up-Down-Up</b> (counted “1, 2-and, and-4-and”). Down-strokes fall on the beat and up-strokes on the “and”. In the tab, ↓ and ↑ show the stroke direction.</p>',
  table:{title:'Useful strumming patterns',head:['Pattern','Count','Feel'],rows:[['D D D D','1 2 3 4','Steady, driving'],['D DU D DU','1 2& 3 4&','Folk / pop'],['D DU UDU','1 2& &4&','The classic pop strum'],['D – D – (muted)','1 (2) 3 (4)','Two-beat country']]},
  keys:['Hand always moves down–up','Miss the strings to create the pattern','Down on beats, up on “ands”','Rhythm beats fancy chords'],
  usage:['Use the D–DU–UDU pattern for most pop and folk songs','Keep the motion going even through chord changes','Accent beats 2 and 4 to sound more “in the groove”'],
  drills:['Mute the strings with your fretting hand and practise just the rhythm','Apply the pattern to the C Am Dm G progression','Invent your own pattern by missing different strokes'],
  cues:['G — Down, Down-Up, Up-Down-Up','C','D','G'],
  figs:[{type:'chords',title:'Chords used',items:[{name:'G',frets:FR.G},{name:'C',frets:FR.C},{name:'D',frets:FR.D}]}]},
 {id:'15-4',title:'Your First Song: a Folk Picking Pattern',mins:25,bpm:90,style:'pop',straight:true,comp:false,chords:['Am','C','D','F','Am','C','E','E'],
  tab:'5/0 4/2 3/2 2/1 1/0 2/1 3/2 4/2 | 5/3 4/2 3/0 2/1 1/0 2/1 3/0 4/2 | 4/0 3/2 2/3 1/2 2/3 3/2 4/0 3/2 | 4/3 3/2 2/1 1/1 2/1 3/2 4/3 3/2 | 5/0 4/2 3/2 2/1 1/0 2/1 3/2 4/2 | 5/3 4/2 3/0 2/1 1/0 2/1 3/0 4/2 | 6/0 5/2 4/2 3/1 2/0 3/1 4/2 5/2 | 6/0w',
  html:'<p>This is a traditional folk progression in A minor — Am C D F Am C E — which has been played for generations and made famous by a 1960s rock hit. Instead of strumming, you <b>arpeggiate</b> each chord: pick the bass note, then roll up and down through the chord one string at a time.</p><p>Hold the full chord shape down for the whole bar and let the notes ring into each other. Use alternate picking, or try fingerstyle with your thumb on the bass strings.</p>',
  keys:['Arpeggiate: one string at a time','Hold the whole chord shape','Bass note first','Let notes ring together'],
  usage:['Use picking patterns to make simple chords sound beautiful','Great for accompanying a singer quietly','The same pattern works on any chord — just start from its root'],
  drills:['Play the pattern on one chord until it is automatic','Then the whole song at 60 BPM','Try it fingerstyle: thumb on bass, fingers on top'],
  cues:['A minor','C major','D major','F major (small shape)','A minor','C major','E major — tension','E — resolve back to Am'],
  figs:[{type:'chords',title:'Chords used',items:[{name:'Am',frets:FR.Am},{name:'C',frets:FR.C},{name:'D',frets:FR.D},{name:'F',frets:[null,null,3,2,1,1]},{name:'E',frets:FR.E}]}]},
 {id:'15-5',title:'A Single-Note Riff',mins:15,bpm:100,style:'pop',straight:true,chords:['E5','E5','A5','E5'],
  tab:'6/0 6/0 6/3 6/5 6/0 6/0 5/2 6/3 | 6/0 6/0 6/3 6/5 6/0 6/0 5/2 6/3 | 5/0 5/0 5/3 5/5 5/0 5/0 4/2 5/3 | 6/0q [6/0,5/2,4/2]q. re [6/0,5/2,4/2]q',
  html:'<p>A <b>riff</b> is a short, repeated phrase that drives a song. This original riff uses the low E and A strings and the notes of the E minor pentatonic scale. You will study that scale properly in Level 3. Bar 3 moves the same riff to the A string, and bar 4 ends with an <b>E5 power chord</b> (root and 5th only).</p><p>Keep it tight: use down-strokes on the beats and up-strokes in between. Rest your picking-hand palm lightly near the bridge for a punchy, muted sound.</p>',
  keys:['Riff = repeated, memorable phrase','Same shape moves to another string','Power chord = root + 5th','Light palm muting for punch'],
  usage:['Riffs are the backbone of rock, blues and funk','Move a riff to a new root to follow the chords','Power chords work in any style that needs strength without colour'],
  drills:['Play the riff with all down-strokes, then alternate picking','Move it to the D string (start on 4/0)','Write your own 1-bar riff using frets 0, 2, 3 and 5'],
  cues:['Riff on the low E','Again','Moved to the A string','E5 power chord hits'],
  figs:[{type:'chords',title:'Power chords',items:[{name:'E5',frets:[0,2,2,null,null,null]},{name:'A5',frets:[null,0,2,2,null,null]},{name:'G5',frets:[3,5,5,null,null,null]}]}]}
]},
{id:16,title:'Fretboard & Pentatonic Scales',color:'#f1fa8c',blurb:'Notes on the neck, intervals and your first scale.',lessons:[
 {id:'16-1',title:'Natural Notes on the Fretboard',mins:20,bpm:80,style:'pop',straight:true,chords:['C','Am','C','C'],
  tab:'6/0 6/1 6/3 6/5 6/7 6/8 6/10 6/12 | 5/0 5/2 5/3 5/5 5/7 5/8 5/10 5/12 | 6/8q 4/10q 3/5q 1/8q | 5/3w',
  html:'<p>The musical alphabet has seven <b>natural notes</b>: A B C D E F G. Between most of them there is a gap of <b>two frets</b> (a whole step). The exceptions are <b>B–C</b> and <b>E–F</b>, which are only <b>one fret</b> apart (a half step). The notes in between are the sharps and flats.</p><p>Each string starts on its open-string name. At the <b>12th fret</b> everything repeats an octave higher, and the double dots mark it. Learn the 6th and 5th strings first — they hold the roots of most chords.</p>',
  keys:['7 natural notes: A–G','2 frets between notes, except B–C and E–F','12th fret = octave of the open string','Learn strings 6 and 5 first'],
  usage:['Find chord roots on strings 6 and 5 for barre chords (Level 4)','Name the notes of every scale and arpeggio you play','Use octave shapes to find the same note on other strings'],
  drills:['Say the note names as you play up the 6th string','Find every C on the neck in 60 seconds','Play octaves: 6th string fret 3 = 4th string fret 5 (both G)'],
  cues:['6th string: E F G A B C D E','5th string: A B C D E F G A','C in different places','Home on C'],
  figs:[{type:'naturals',title:'Natural notes, frets 0–12'}]},
 {id:'16-2',title:'Intervals: Whole Steps, Half Steps & More',mins:20,bpm:70,style:'pop',straight:true,chords:['C','C','C','C'],
  tab:'5/3q 5/4q 5/3q 5/5q | 5/3q 4/1q 5/3q 4/2q | 5/3q 4/3q 5/3q 4/5q | 5/3q 4/7q 5/3q 3/5q',
  html:'<p>An <b>interval</b> is the distance between two notes. One fret is a <b>half step</b> (semitone); two frets are a <b>whole step</b> (tone). Every interval is a number of half steps, and each has its own sound: minor 3rds are sad, major 3rds bright, perfect 5ths strong and open.</p><p>The exercise plays C followed by each interval in turn. Interval shapes are the same everywhere on the neck — except across the G and B strings, where you add one fret.</p>',
  table:{title:'Intervals from C',head:['Interval','Half steps','From C','Sound'],rows:[['Minor 2nd','1','D♭','Tense, dissonant'],['Major 2nd','2','D','Step'],['Minor 3rd','3','E♭','Sad'],['Major 3rd','4','E','Bright'],['Perfect 4th','5','F','Open, suspended'],['Tritone','6','F♯/G♭','Unstable'],['Perfect 5th','7','G','Strong, power chord'],['Minor 6th','8','A♭','Bittersweet'],['Major 6th','9','A','Sweet'],['Minor 7th','10','B♭','Bluesy'],['Major 7th','11','B','Dreamy'],['Octave','12','C','Same note, higher']]},
  keys:['Half step = 1 fret, whole step = 2','Intervals = number of half steps','Each interval has a sound','Shapes shift across the G–B strings'],
  usage:['Intervals build every scale and chord: a major chord = major 3rd + minor 3rd','Recognising intervals by ear lets you play what you hear','Use the Ear Training tool to drill them'],
  drills:['Play each interval from 5 different starting notes','Sing the interval before you play it','Do 10 Interval questions in Ear Training each day'],
  cues:['Half step, then whole step','Minor 3rd, major 3rd','Perfect 4th, perfect 5th','Major 6th, octave'],
  figs:[{type:'dots',from:2,to:7,title:'Interval map from C',cap:'Numbers = interval from the root C',dots:[{s:5,f:3,l:'R',cls:'root'},{s:5,f:4,l:'b2'},{s:5,f:5,l:'2'},{s:4,f:1,l:'b3'},{s:4,f:2,l:'3',cls:'ct'},{s:4,f:3,l:'4'},{s:4,f:4,l:'b5'},{s:4,f:5,l:'5',cls:'ct'},{s:4,f:6,l:'b6'},{s:4,f:7,l:'6'},{s:3,f:3,l:'b7'},{s:3,f:4,l:'7'},{s:3,f:5,l:'R',cls:'root'}]}]},
 {id:'16-3',title:'Minor Pentatonic — Position 1',mins:20,bpm:80,style:'pop',straight:true,chords:['Am7','Am7','Am7','Am7'],
  tab:'6/5 6/8 5/5 5/7 4/5 4/7 3/5 3/7 | 2/5 2/8 1/5 1/8 1/8 1/5 2/8 2/5 | 3/7 3/5 4/7 4/5 5/7 5/5 6/8 6/5 | 1/5q 2/8 2/5 3/7q 4/7q',
  html:'<p>The <b>minor pentatonic</b> scale has just five notes: 1 ♭3 4 5 ♭7. In A that is A C D E G. It is the most used scale in blues, rock and jazz-blues because every note sounds good over a minor chord or a blues.</p><p><b>Position 1</b> sits at the 5th fret: two notes per string, with your index finger on fret 5 and your ring or pinky finger on fret 7 or 8. The roots (A) are in gold.</p>',
  keys:['5 notes: 1 ♭3 4 5 ♭7','A minor pentatonic: A C D E G','Position 1 at the 5th fret for A','Two notes per string'],
  usage:['Solo over minor chords, minor blues and rock in A minor','Over a blues in A the same shape works on all three chords','Move the shape to change key: root at fret 3 = G minor pentatonic'],
  drills:['Play the shape up and down with alternate picking at 80 BPM','Move it to frets 3 (G) and 10 (D)','Make up 2-note and 3-note licks and repeat them'],
  cues:['Ascending from the low A','Over the top and back','Descending','A short lick to finish'],
  figs:[{type:'scale',root:'A',scale:'minpent',from:4,to:8,title:'A minor pentatonic — position 1'}]},
 {id:'16-4',title:'Your First Solo with the Pentatonic',mins:20,bpm:80,style:'pop',straight:true,chords:['Am7','Dm7','Am7','E7'],
  tab:'3/7q 3/5q 2/5h | 2/8q 2/5q 3/7h | 1/5q 1/8 1/5 2/8 2/5 3/7q | 2/5w',
  html:'<p>A solo is a conversation. Play a short phrase (the <b>call</b>), leave space, then play a phrase that answers it (the <b>response</b>). Use few notes, repeat ideas, and end phrases on strong notes such as the root or the 5th.</p><p>This 4-bar solo uses only A minor pentatonic. Notice that it ends on E — the root of the E7 chord — which pulls back to Am.</p>',
  keys:['Call and response','Leave space between phrases','Repeat and vary ideas','End phrases on strong notes'],
  usage:['Use pentatonic phrases over minor and blues progressions','Target the chord’s root or 3rd when the chord changes','Fewer notes played with good rhythm beat many random notes'],
  drills:['Improvise 2-bar phrases, leaving 2 bars of silence after each','Use only 3 notes for a whole chorus','Loop the Minor Blues preset in the Jam Room and solo with this shape'],
  cues:['Call: D C E','Response: G E D','A busier phrase','Land on E — the root of E7'],
  figs:[{type:'scale',root:'A',scale:'minpent',from:4,to:8,title:'A minor pentatonic'}]}
]},
{id:17,title:'Barre Chords, Triads & Major Pentatonic',color:'#50fa7b',blurb:'Movable chords that work in every key.',lessons:[
 {id:'17-1',title:'E-Shape Barre Chords (6th-String Root)',mins:25,bpm:80,style:'pop',straight:true,strum:true,comp:false,chords:['F','G','Am','F'],
  tab:['[6/1,5/3,4/3,3/2,2/1,1/1]','[6/3,5/5,4/5,3/4,2/3,1/3]','[6/5,5/7,4/7,3/5,2/5,1/5]','[6/1,5/3,4/3,3/2,2/1,1/1]'].map(c=>`${c}q ${c}e u${c}e ${c}q u${c}q`).join(' | '),
  html:'<p>A <b>barre chord</b> uses your index finger as a “movable nut”, pressing all six strings at once. Take an open E chord, re-finger it with fingers 2-3-4, then slide it up and barre behind it. The result is the <b>E-shape barre</b>: F at fret 1, G at fret 3, A at fret 5.</p><p>For the minor version, use the Em shape, so the 3rd string is covered by the barre. The root is on the 6th string — that is why you learned the notes on that string. Roll the index finger slightly onto its bony edge, and keep the thumb low behind the neck.</p>',
  keys:['Index finger = movable nut','E shape: root on the 6th string','Major ↔ minor: one finger','The root fret decides the chord'],
  usage:['Play any major or minor chord with one shape: find the root on string 6','Use them for keys open chords can’t reach (F, B♭, B…)','Release pressure between strums to avoid fatigue'],
  drills:['Barre at fret 5 and play each string separately — fix buzzing notes','Play F → G → A → B♭ moving one shape','Switch between major and minor at the same fret'],
  cues:['F major, barre at fret 1','G major at fret 3','A minor at fret 5','Back to F'],
  figs:[{type:'chords',title:'E-shape barre chords',items:[{name:'F',frets:[1,3,3,2,1,1]},{name:'G',frets:[3,5,5,4,3,3]},{name:'Fm',frets:[1,3,3,1,1,1]},{name:'Am',frets:[5,7,7,5,5,5]}]}]},
 {id:'17-2',title:'A-Shape Barre Chords (5th-String Root)',mins:25,bpm:80,style:'pop',straight:true,strum:true,comp:false,chords:['Dm','Bb','C','Dm'],
  tab:['[5/5,4/7,3/7,2/6,1/5]','[5/1,4/3,3/3,2/3,1/1]','[5/3,4/5,3/5,2/5,1/3]','[5/5,4/7,3/7,2/6,1/5]'].map(c=>`${c}q ${c}e u${c}e ${c}q u${c}q`).join(' | '),
  html:'<p>The <b>A-shape barre</b> takes the open A and Am chords up the neck with the root on the <b>5th string</b>. B♭ is at fret 1, C at fret 3, D at fret 5. For major, many players barre strings 4-3-2 with the ring finger; for minor, use the Am shape.</p><p>With both shapes you can play any major or minor chord in two places. Choose the one closest to your previous chord.</p>',
  keys:['A shape: root on the 5th string','Two shapes = every chord in 2 places','Choose the nearest shape','Am shape for minor'],
  usage:['Combine E- and A-shapes to stay in one area of the neck','A-shape chords are brighter and lighter than E-shapes','Use the root on string 5 to locate the chord quickly'],
  drills:['Play C in both shapes (A-shape at fret 3, E-shape at fret 8)','Play Dm → B♭ → C → Dm, then transpose up 2 frets','Mix shapes: E-shape G → A-shape C → A-shape D'],
  cues:['D minor, A-shape at fret 5','B♭ major at fret 1','C major at fret 3','D minor'],
  figs:[{type:'chords',title:'A-shape barre chords',items:[{name:'Bb',frets:[null,1,3,3,3,1]},{name:'C',frets:[null,3,5,5,5,3]},{name:'Cm',frets:[null,3,5,5,4,3]},{name:'Dm',frets:[null,5,7,7,6,5]}]}]},
 {id:'17-3',title:'Triads: The Building Blocks of Harmony',mins:20,bpm:80,style:'pop',straight:true,comp:false,chords:['C Dm','Em F','G F','Em Dm','C'],
  tab:'[3/5,2/5,1/3]h [3/7,2/6,1/5]h | [3/9,2/8,1/7]h [3/10,2/10,1/8]h | [3/12,2/12,1/10]h [3/10,2/10,1/8]h | [3/9,2/8,1/7]h [3/7,2/6,1/5]h | [3/5,2/5,1/3]w',
  html:'<p>A <b>triad</b> is a three-note chord stacked in 3rds: root, 3rd and 5th. Four types exist. A <b>major</b> triad is a major 3rd plus a minor 3rd. A <b>minor</b> triad is a minor 3rd plus a major 3rd. A <b>diminished</b> triad is two minor 3rds, and an <b>augmented</b> triad is two major 3rds.</p><p>Playing the triads of the C major scale on the top three strings, you climb C, Dm, Em, F, G. These small shapes are bright and clear, and they will later help you build jazz voicings and triad pairs.</p>',
  table:{title:'The four triad types',head:['Type','Formula','C example','Sound'],rows:[['Major','1 3 5','C E G','Bright, stable'],['Minor','1 ♭3 5','C E♭ G','Dark, stable'],['Diminished','1 ♭3 ♭5','C E♭ G♭','Tense'],['Augmented','1 3 ♯5','C E G♯','Floating, unresolved']]},
  keys:['Triad = 1 3 5','Major, minor, diminished, augmented','Diatonic triads climb the scale','Small shapes, clear sound'],
  usage:['Use top-string triads to comp lightly next to a bass player or pianist','Play triads up the neck to harmonise a scale','Triads are the basis of inversions (Lesson 9-1) and triad pairs (Lesson 11-1)'],
  drills:['Play all 7 diatonic triads of C on strings 3-2-1 (add Am and B°)','Repeat on strings 4-3-2','Name each triad’s quality as you play it'],
  cues:['C → Dm','Em → F','G → F','Em → Dm','Home: C'],
  figs:[{type:'chords',title:'Diatonic triads (strings 3-2-1)',items:[{name:'C',frets:[null,null,null,5,5,3]},{name:'Dm',frets:[null,null,null,7,6,5]},{name:'Em',frets:[null,null,null,9,8,7]},{name:'F',frets:[null,null,null,10,10,8]},{name:'G',frets:[null,null,null,12,12,10]}]}]},
 {id:'17-4',title:'The Major Pentatonic Scale',mins:20,bpm:90,style:'pop',straight:true,chords:['C','C','G','C'],
  tab:'6/8 5/5 5/7 4/5 4/7 3/5 3/7 2/5 | 2/8 1/5 1/8 1/5 2/8 2/5 3/7 3/5 | 3/5q 3/7 2/5 2/8q 2/5q | 3/5w',
  html:'<p>The <b>major pentatonic</b> (1 2 3 5 6) is the happy twin of the minor pentatonic. C major pentatonic (C D E G A) uses <b>the same notes</b> as A minor pentatonic, because they are relatives. So you already know the shape — just treat C as the root.</p><p>Major pentatonic sounds sweet and melodic over major chords. It is the sound of country, soul and many jazz melodies.</p>',
  keys:['1 2 3 5 6','C major pent = A minor pent notes','Same shape, different root','Sweet, melodic sound'],
  usage:['Solo over major chords and major-key songs','Major pentatonic on the 5 (G over C) adds the 7th and 9th','Mix major and minor pentatonic over a blues for a classic sound'],
  drills:['Play the shape, emphasising C instead of A','Improvise over a C major chord using only major pentatonic','Alternate C major and C minor pentatonic over a C7 vamp'],
  cues:['C major pentatonic up','Over the top and down to C','A melodic phrase over G','Home on C'],
  figs:[{type:'scale',root:'C',scale:'majpent',from:4,to:8,title:'C major pentatonic (same shape as A minor pentatonic)'}]}
]},
{id:18,title:'The Major Scale & CAGED',color:'#8be9fd',blurb:'Scale shapes, the CAGED map, seventh chords and keys.',lessons:[
 {id:'18-1',title:'Major Scale Shapes',mins:25,bpm:90,style:'pop',straight:true,chords:['Gmaj7','Gmaj7','Gmaj7','Gmaj7'],
  tab:'6/3 6/5 5/2 5/3 5/5 4/2 4/4 4/5 | 3/2 3/4 3/5 2/3 2/5 1/2 1/3 1/2 | 1/3 1/2 2/5 2/3 3/5 3/4 3/2 4/5 | 4/4 4/2 5/5 5/3 5/2 6/5 6/3q',
  html:'<p>The <b>major scale</b> follows the pattern <b>W W H W W W H</b> (whole and half steps). It is the parent of every mode and of most chords. This two-octave shape has its root on the 6th string. It covers frets 2–5 with one finger per fret — a stretch with the pinky on fret 5.</p><p>Move the shape to any root on the 6th string to play any major scale. Learn the root positions: they are your anchor points.</p>',
  keys:['W W H W W W H','Root on the 6th string','One finger per fret','Movable to any key'],
  usage:['Use the major scale to learn keys, chords and modes','Over a major chord, emphasise 1, 3 and 5','It is the source of the modes (Module “Modes in Practice”)'],
  drills:['Play the shape in G, A, C and D','Play it in 3rds: G-B, A-C, B-D …','Say the scale degrees aloud as you play'],
  cues:['G major scale ascending','Up to the high G','Descending','Back to the low G'],
  figs:[{type:'scale',root:'G',scale:'ionian',from:1,to:5,title:'G major — root on the 6th string'}]},
 {id:'18-2',title:'The CAGED System',mins:30,bpm:70,comp:false,style:'pop',straight:true,chords:['C','C','C','C'],
  tab:'[5/3,4/2,3/0,2/1,1/0]h [5/3,4/5,3/5,2/5,1/3]h | [6/8,5/7,4/5,3/5,2/5,1/8]h [6/8,5/10,4/10,3/9,2/8,1/8]h | [4/10,3/12,2/13,1/12]h [6/8,5/10,4/10,3/9,2/8,1/8]h | [5/3,4/5,3/5,2/5,1/3]h [5/3,4/2,3/0,2/1,1/0]h',
  html:'<p>The five open chord shapes <b>C, A, G, E and D</b> can each be moved up the neck. Played in that order, they link together to cover the whole fretboard for any chord. This is the <b>CAGED system</b>. For C major, the shapes are: C-shape (open), A-shape (fret 3), G-shape (fret 5), E-shape (fret 8) and D-shape (fret 10).</p><p>Each shape shares notes with its neighbours, so you can always see the chord, its arpeggio and its scale anywhere on the neck.</p>',
  table:{title:'C major across the neck',head:['Shape','Root string','Position','Notes'],rows:[['C','5th','open','C E G C E'],['A','5th','fret 3','C G C E G'],['G','6th','fret 5','C E G C E C'],['E','6th','fret 8','C G C E G C'],['D','4th','fret 10','C G C E']]},
  keys:['Five movable shapes: C A G E D','They link in order up the neck','Every chord in five places','Scales and arpeggios live around each shape'],
  usage:['Use CAGED to find any chord, arpeggio or scale anywhere on the neck','Pick the shape nearest your current position when comping or soloing','Map the major scale around each shape to connect scale positions'],
  drills:['Play G major in all five CAGED shapes','Arpeggiate each shape note by note','Find the major-scale notes around each shape'],
  cues:['C-shape, then A-shape','G-shape, then E-shape','D-shape, then back to E-shape','A-shape, then home to the open C'],
  figs:[{type:'chords',title:'C major in five CAGED shapes',items:[{name:'C (C-shape)',frets:[null,3,2,0,1,0]},{name:'C (A-shape)',frets:[null,3,5,5,5,3]},{name:'C (G-shape)',frets:[8,7,5,5,5,8]},{name:'C (E-shape)',frets:[8,10,10,9,8,8]},{name:'C (D-shape)',frets:[null,null,10,12,13,12]}]}]},
 {id:'18-3',title:'Seventh Chords & the Harmonised Scale',mins:25,bpm:90,comp:false,chords:['Cmaj7 Dm7','Em7 Fmaj7','G7 Am7','Bm7b5 Cmaj7'],
  tab:'[5/3,3/4,2/5]h [5/5,3/5,2/6]h | [5/7,3/7,2/8]h [5/8,3/9,2/10]h | [5/10,3/10,2/12]h [5/12,3/12,2/13]h | [5/2,3/2,2/3]h [5/3,3/4,2/5]h',
  html:'<p>Stack one more 3rd on a triad and you get a <b>seventh chord</b> — the basic chord of jazz. Harmonising the major scale in 7ths gives the same pattern in every key: <b>Imaj7 ii7 iii7 IVmaj7 V7 vi7 viiø7</b>. In C, that is Cmaj7 Dm7 Em7 Fmaj7 G7 Am7 Bm7♭5.</p><p>The exercise climbs the harmonised scale using root-on-5th-string shells. Once you know this pattern you can work out the chords of any key.</p>',
  table:{title:'Diatonic seventh chords in C',head:['Degree','Chord','Quality','Function'],rows:[['I','Cmaj7','maj7','Tonic'],['ii','Dm7','m7','Subdominant'],['iii','Em7','m7','Tonic'],['IV','Fmaj7','maj7','Subdominant'],['V','G7','7','Dominant'],['vi','Am7','m7','Tonic'],['vii','Bm7♭5','m7♭5','Dominant']]},
  keys:['7th chord = triad + 7th','Same pattern in every key','I ii iii IV V vi vii','Only V is dominant 7'],
  usage:['Use the pattern to work out the chords of any key','Spot ii–V–Is in songs using the roman numerals','The V7 is the only dominant 7th in a major key — the strongest pull home'],
  drills:['Play the harmonised scale in G and F','Name the roman numeral of each chord you play','Write the 7 chords for D, B♭ and E'],
  cues:['Cmaj7 (I) → Dm7 (ii)','Em7 (iii) → Fmaj7 (IV)','G7 (V) → Am7 (vi)','Bm7♭5 (vii) → Cmaj7 (I)'],
  figs:[{type:'arp',root:'C',q:'maj7',from:1,to:5,title:'Cmaj7 arpeggio'}]},
 {id:'18-4',title:'Key Signatures & the Circle of Fifths',mins:20,bpm:80,chords:['Cmaj7 Fmaj7 Bbmaj7 Ebmaj7','Abmaj7 Dbmaj7 Gbmaj7 Bmaj7','Emaj7 Amaj7 Dmaj7 Gmaj7','Cmaj7'],
  tab:'5/3q 4/3q 5/1q 4/1q | 6/4q 5/4q 6/2q 5/2q | 6/0q 5/0q 4/0q 3/0q | 3/5w',
  html:'<p>A <b>key signature</b> lists the sharps or flats in a key. Moving <b>up a 5th</b> adds a sharp (C → G → D …). Moving <b>up a 4th</b> adds a flat (C → F → B♭ …). Arrange the keys in a circle and you get the <b>circle of fifths</b>.</p><p>Jazz harmony usually moves <b>anticlockwise, in 4ths</b>: ii → V → I is a chain of 4ths. This exercise plays all 12 roots around the circle of 4ths with the band.</p>',
  table:{title:'Key signatures',head:['Key','Sharps / flats','Notes'],rows:[['C','0','—'],['G','1♯','F♯'],['D','2♯','F♯ C♯'],['A','3♯','F♯ C♯ G♯'],['E','4♯','F♯ C♯ G♯ D♯'],['B','5♯','F♯ C♯ G♯ D♯ A♯'],['F♯ / G♭','6♯ / 6♭','—'],['D♭','5♭','B♭ E♭ A♭ D♭ G♭'],['A♭','4♭','B♭ E♭ A♭ D♭'],['E♭','3♭','B♭ E♭ A♭'],['B♭','2♭','B♭ E♭'],['F','1♭','B♭']]},
  keys:['Up a 5th = add a sharp','Up a 4th = add a flat','Circle of fifths shows all 12 keys','Jazz moves in 4ths (ii–V–I)'],
  usage:['Know the key signature to know which notes are in the scale','Practise every exercise around the circle of 4ths','Use the Jam Room Key menu to drill all 12 keys'],
  drills:['Recite the circle of 4ths: C F B♭ E♭ A♭ D♭ G♭ B E A D G','Play the major scale in 3 new keys a week','Name the key signature of each Jam Room preset'],
  cues:['C, F, B♭, E♭','A♭, D♭, G♭, B','E, A, D, G','Back to C'],
  figs:[{type:'circle',title:'The circle of fifths'}]}
]},
{id:19,title:'Extended Harmony & Technique',color:'#ff79c6',blurb:'Colour chords plus alternate and sweep picking.',lessons:[
 {id:'19-1',title:'add9 & 6/9 Chords',mins:20,bpm:80,style:'pop',straight:true,strum:true,comp:false,chords:['Cadd9','G6/9','Am7','Dadd9'],
  tab:['[5/3,4/2,3/0,2/3,1/0]','[6/3,4/2,3/2,2/3,1/3]','[5/0,4/2,3/0,2/1,1/0]','[4/0,3/2,2/3,1/0]'].map(c=>`${c}q ${c}e u${c}e ${c}q u${c}q`).join(' | '),
  html:'<p><b>Extended chords</b> add colour notes beyond 1-3-5. An <b>add9</b> chord adds the 9th (the 2nd an octave up) to a triad, but with no 7th — fresh and modern. A <b>6/9</b> chord adds both the 6th and the 9th. It is a classic jazz ending chord, stable and shimmering.</p><p>These shapes use open strings that ring against fretted notes, which gives them their sparkle.</p>',
  table:{title:'Colour chords',head:['Chord','Formula','C example'],rows:[['add9','1 3 5 9','C E G D'],['m(add9)','1 ♭3 5 9','C E♭ G D'],['6','1 3 5 6','C E G A'],['6/9','1 3 5 6 9','C E G A D'],['maj9','1 3 5 7 9','C E G B D']]},
  keys:['add9 = triad + 9 (no 7th)','6/9 = triad + 6 + 9','Open strings add sparkle','6/9 is a classic final chord'],
  usage:['Use add9 in place of plain major chords for a modern sound','End jazz tunes on a 6/9 or maj9','The movable C6/9 (x32233) works on any 5th-string root'],
  drills:['Replace every major chord in Lesson 15-2 with add9','Move the C6/9 shape to F and G','Compare C, Cadd9, C6/9 and Cmaj9 back-to-back'],
  cues:['Cadd9','G6/9','Am7','Dadd9'],
  figs:[{type:'chords',title:'Colour chords',items:[{name:'Cadd9',frets:[null,3,2,0,3,0]},{name:'G6/9',frets:[3,null,2,2,3,3]},{name:'C6/9',frets:[null,3,2,2,3,3]},{name:'Dadd9',frets:[null,null,0,2,3,0]}]}]},
 {id:'19-2',title:'Alternate Picking: Three Notes per String',mins:25,bpm:70,style:'pop',straight:true,chords:['Gmaj7','Gmaj7','Gmaj7','Gmaj7'],
  tab:'6/3s 6/5s 6/7s 5/3s 5/5s 5/7s 4/4s 4/5s 4/7s 3/4s 3/5s 3/7s 2/5s 2/7s 2/8s 1/5s | 1/7s 1/5s 2/8s 2/7s 2/5s 3/7s 3/5s 3/4s 4/7s 4/5s 4/4s 5/7s 5/5s 5/3s 6/7s 6/5s | 6/3 6/5 6/7 5/3 5/5 5/7 4/4 4/5 | 6/3w',
  html:'<p><b>Strict alternate picking</b> — down, up, down, up, with no exceptions — gives an even, articulate sound at any speed. <b>Three-notes-per-string</b> scale shapes are ideal for it: the pick direction changes each time you cross to a new string, so both inside and outside string crossings get practised.</p><p>Keep the pick close to the strings and use a small wrist motion. Use a metronome, and only speed up when it feels effortless.</p>',
  keys:['Strict down-up, always','3 notes per string','Small wrist motion','Speed only after accuracy'],
  usage:['Use strict alternate picking for fast bebop lines and scales','Start the line with a down-stroke on a downbeat','Practise slowly — your hands learn what you repeat'],
  drills:['Play the 16th-note run at 60, 70, then 80 BPM','Accent every 4th note','Play the same shape in 3-note groupings'],
  cues:['G major, 3 notes per string — up in 16ths','Back down','Eighth notes — relax','Hold G'],
  figs:[{type:'scale',root:'G',scale:'ionian',from:2,to:8,title:'G major — 3 notes per string'}]},
 {id:'19-3',title:'Sweep Picking Triad Arpeggios',mins:25,bpm:60,style:'pop',straight:true,chords:['Am','G','F','E'],
  tab:R('3/9t 2/10t 1/8t 2/10t',3)+' | '+R('3/7t 2/8t 1/7t 2/8t',3)+' | '+R('3/5t 2/6t 1/5t 2/6t',3)+' | '+R('3/4t 2/5t 1/4t 2/5t',3),
  html:'<p><b>Sweep picking</b> plays an arpeggio with one string per note, using a single flowing pick motion in the same direction — like a slow strum — rather than alternating. Sweep down through strings 3-2-1, then sweep back up.</p><p>The secret is <b>muting</b>. Lift each fretting finger just after its note so the notes don’t ring together like a chord. Here, three-string triads move through Am G F E. Start very slowly.</p>',
  keys:['One pick motion per direction','One note per string','Lift fingers to mute','Slow and clean first'],
  usage:['Use sweeps for fast, fluid arpeggios','In jazz, use small 3-string sweeps inside lines rather than long rock sweeps','Combine with alternate picking: sweep across strings, alternate on one string'],
  drills:['Sweep each triad 10 times at 50 BPM','Add a 4th note (hammer-on or pull-off) at the top','Apply sweeps to the 7th-chord arpeggios of Module 2'],
  cues:['A minor sweeps','G major','F major','E major'],
  figs:[{type:'chords',title:'Sweep shapes (strings 3-2-1)',items:[{name:'Am',frets:[null,null,null,9,10,8]},{name:'G',frets:[null,null,null,7,8,7]},{name:'F',frets:[null,null,null,5,6,5]},{name:'E',frets:[null,null,null,4,5,4]}]}]}
]},
{id:20,title:'Non-Diatonic Theory & Improvisation',color:'#bd93f9',blurb:'Borrowed chords, hybrid picking and melodic soloing over moving keys.',lessons:[
 {id:'20-1',title:'Borrowed Chords & Modal Interchange',mins:25,bpm:100,comp:false,chords:['Cmaj7','Abmaj7 Bb7','Fm6','Cmaj7'],
  tab:'[5/3,3/4,2/5]q. [5/3,3/4,2/5]e rh | [6/4,4/5,3/5]q [6/4,4/5,3/5]q [6/6,4/6,3/7]q [6/6,4/6,3/7]q | [6/1,4/0,3/1]q. [6/1,4/0,3/1]e rh | [5/3,3/4,2/5]w',
  html:'<p><b>Non-diatonic</b> chords use notes outside the key. The most common source is <b>modal interchange</b>: borrowing chords from the parallel minor key (C minor, when you are in C major). They add drama and colour.</p><p>Here, ♭VImaj7 (A♭maj7) and ♭VII7 (B♭7) lead back to C. Then iv (Fm6) — the minor-plagal sound — resolves to I. Each borrowed chord contains A♭ or E♭, notes from C minor.</p>',
  table:{title:'Chords borrowed from C minor',head:['Numeral','Chord','Borrowed note(s)','Effect'],rows:[['iv','Fm6 / Fm7','A♭','Bittersweet, minor plagal'],['♭VI','A♭maj7','A♭ E♭','Cinematic, warm'],['♭VII7','B♭7','A♭','Backdoor dominant'],['♭III','E♭maj7','E♭ B♭','Bright surprise'],['♭II','D♭maj7','D♭ A♭','Neapolitan, exotic'],['iiø','Dm7♭5','A♭','Darker ii chord']]},
  keys:['Borrow from the parallel minor','A♭ and E♭ are the borrowed notes in C','♭VI–♭VII–I is a powerful cadence','iv–I = minor plagal'],
  usage:['Replace IV with iv (Fmaj7 → Fm6) before the I for an emotional ending','Use ♭VI–♭VII–I instead of IV–V–I for a big, cinematic cadence','When soloing, switch to the borrowed chord’s notes (A♭, E♭) — or use Lydian dominant on ♭VII7'],
  drills:['Rewrite a I–IV–V–I with borrowed chords','Find a borrowed chord in All the Things You Are (Lesson 10-2)','Paste C | A♭maj7 B♭7 | Fm6 | C into the Jam Room and solo'],
  cues:['Cmaj7 — home','A♭maj7 → B♭7 — borrowed from C minor','Fm6 — the minor iv','Cmaj7 — resolution'],
  figs:[{type:'chords',title:'Borrowed-chord shells',items:[{name:'Abmaj7',frets:[4,null,5,5,null,null]},{name:'Bb7',frets:[6,null,6,7,null,null]},{name:'Fm6',frets:[1,null,0,1,null,null]}]}]},
 {id:'20-2',title:'Hybrid Picking',mins:20,bpm:100,style:'pop',straight:true,comp:false,chords:['C','Am','Dm','G'],
  tab:'5/3 [3/0,2/1] 4/2 [3/0,2/1] 5/3 [3/0,2/1] 4/2 [3/0,2/1] | 5/0 [3/2,2/1] 4/2 [3/2,2/1] 5/0 [3/2,2/1] 4/2 [3/2,2/1] | 4/0 [2/3,1/1] 3/2 [2/3,1/1] 4/0 [2/3,1/1] 3/2 [2/3,1/1] | 6/3 [2/0,1/3] 4/0 [2/0,1/3] 6/3 [2/0,1/3] 4/0 [2/0,1/3]',
  html:'<p><b>Hybrid picking</b> combines the pick (held between thumb and index) with your free <b>middle and ring fingers</b>. The pick plays the bass notes, and the fingers pluck the higher strings at the same time or in between. You get the independence of fingerstyle with the attack of a pick.</p><p>The exercise alternates a picked bass note with a two-note “pinch” plucked by the middle and ring fingers. It is a great sound for comping, country-jazz and wide-interval lines.</p>',
  keys:['Pick + middle + ring fingers','Pick = bass, fingers = treble','Pluck “up” into your palm','Opens wide intervals'],
  usage:['Use for solo-guitar comping: bass with the pick, chords with the fingers','Play wide-interval lines (6ths, 10ths) that are awkward with a pick alone','Use for country-style double-stops and chicken-picking'],
  drills:['Play the pattern on one chord until relaxed','Alternate pick and middle finger on two strings (pick string 3, finger string 1)','Play 6ths on strings 3 and 1 with hybrid picking'],
  cues:['C — pick the bass, pluck the pair','A minor','D minor','G'],
  figs:[{type:'chords',title:'Chord shapes used',items:[{name:'C',frets:FR.C},{name:'Am',frets:FR.Am},{name:'Dm',frets:FR.Dm},{name:'G',frets:FR.G}]}]},
 {id:'20-3',title:'Melodic Soloing Over Moving Key Centres',mins:25,bpm:100,chords:['Cmaj7','Ebmaj7','Abmaj7','Dbmaj7'],
  tab:'1/0q 1/3q 2/0h | 1/3q 1/6q 2/3h | 2/1q 2/4q 1/3h | 1/1q 1/4q 2/1h',
  html:'<p>When the key changes every bar, running scales sounds lost. Melodic soloists <b>target a guide tone</b> — usually the 3rd — on beat 1 of each chord. They then connect the targets with the smallest possible moves and build a singable melody around them.</p><p>In this progression, which moves by minor 3rds and 4ths (C → E♭ → A♭ → D♭), each bar starts on a chord tone close to the previous one: E → G → C → F. The ear hears every key change clearly.</p>',
  keys:['Target the 3rd on beat 1','Connect targets with small moves','Melody first, scales second','Space helps the listener follow'],
  usage:['On unfamiliar changes, first plan a target-note line, then embellish it','Repeat a rhythmic motif while the notes adapt to each chord','Sing your line — if you can’t sing it, simplify it'],
  drills:['Play only the 3rds of each chord, one per bar','Add an approach note before each target','Solo over the Coltrane Changes preset using target notes'],
  cues:['Cmaj7 — E G B','E♭maj7 — G B♭ D','A♭maj7 — C E♭ G','D♭maj7 — F A♭ C'],
  figs:[{type:'dots',from:0,to:6,title:'Target 3rds',cap:'E (Cmaj7) · G (E♭maj7) · C (A♭maj7) · F (D♭maj7)',dots:[{s:1,f:0,l:'E',cls:'root'},{s:1,f:3,l:'G',cls:'root'},{s:2,f:1,l:'C',cls:'root'},{s:1,f:1,l:'F',cls:'root'}]}]}
]},
{id:21,title:'Complex Voicings & the Melodic Minor',color:'#ff6e6e',blurb:'11ths, 13ths, drop-3 voicings and the jazz minor scale.',lessons:[
 {id:'21-1',title:'11th & 13th Chords',mins:25,bpm:80,comp:false,chords:['Dm11','G13','Cmaj13','Cmaj13'],
  tab:'[5/5,4/5,3/5,2/6,1/5]q. [5/5,4/5,3/5,2/6,1/5]e rh | [6/3,4/3,3/4,2/5]q. [6/3,4/3,3/4,2/5]e rh | [5/3,4/2,3/2,2/0,1/0]h [5/3,4/2,3/2,2/0,1/0]h | [5/3,4/2,3/2,2/0,1/0]w',
  html:'<p>Keep stacking 3rds past the 7th and you get the <b>9th, 11th and 13th</b>. Guitarists can’t play all seven notes at once, so they <b>omit</b> the less important ones. The 5th goes first, and often the root (the bass covers it). The 3rd and 7th always stay, because they define the chord.</p><p>One rule: the natural 11th clashes with a major 3rd. So on major and dominant chords, jazz players use the <b>♯11</b> instead. On minor chords, the natural 11 sounds great (Dm11).</p>',
  table:{title:'Extended chords',head:['Chord','Formula','Keep','Omit'],rows:[['m11','1 ♭3 5 ♭7 9 11','♭3 ♭7 11','5, sometimes 9'],['13','1 3 5 ♭7 9 13','3 ♭7 13','5, 11'],['maj13','1 3 5 7 9 13','3 7 13','5, 11'],['13♯11','1 3 ♭7 9 ♯11 13','3 ♭7 ♯11 13','5'],['maj7♯11','1 3 5 7 ♯11','3 7 ♯11','5']]},
  keys:['9, 11, 13 = stacked 3rds','Always keep the 3rd and 7th','Omit the 5th (and often the root)','Natural 11 on minor, ♯11 on major/dominant'],
  usage:['Use m11 on minor and modal chords','Use 13 instead of a plain 7 for a sophisticated dominant','Use maj13 or 6/9 as a lush tonic chord','Avoid the natural 11 against a major 3rd — use ♯11'],
  drills:['Play Dm7 → Dm9 → Dm11 to hear each colour','Turn every V7 in a blues into a 13','Build G13♯11 using the A triad from Lesson 13-4'],
  cues:['Dm11 — quartal shape','G13','Cmaj13 — open strings shimmer','Let it ring'],
  figs:[{type:'chords',title:'11th & 13th voicings',items:[{name:'Dm11',frets:[null,5,5,5,6,5]},{name:'G13',frets:[3,null,3,4,5,null]},{name:'Cmaj13',frets:[null,3,2,2,0,0]},{name:'G13#11',frets:[null,2,3,2,2,0]}]}]},
 {id:'21-2',title:'Drop-3 Voicings',mins:20,bpm:90,comp:false,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'[5/5,3/5,2/6,1/5]q. [5/5,3/5,2/6,1/5]e rh | [6/3,4/3,3/4,2/3]q. [6/3,4/3,3/4,2/3]e rh | [6/8,4/9,3/9,2/8]h [6/8,4/9,3/9,2/8]h | [6/8,4/9,3/9,2/8]w',
  html:'<p><b>Drop-3</b> voicings take a close four-note chord and drop the <b>third</b>-highest note an octave. That leaves a gap: the voicing skips a string, with the root on the 6th or 5th string. Drop-3 voicings sound wide and full, like a big-band guitar section, and they put the root in the bass for solo playing.</p><p>Combine them with the drop-2 voicings from Lessons 4-1 and 9-2 and you have the full professional toolkit.</p>',
  keys:['Drop 3 = 3rd-from-top note dropped an octave','Skips a string','Root in the bass','Wide, full sound'],
  usage:['Use drop-3 voicings for solo guitar and duo playing (root in the bass)','Use drop 2 for lighter comping with a bassist','Learn the four inversions of drop 3 on strings 6-4-3-2'],
  drills:['Play maj7, 7, m7 and m7♭5 drop-3 shapes from a 6th-string root','Comp a blues using only drop-3 voicings','Alternate drop-2 and drop-3 voicings through a ii–V–I'],
  cues:['Dm7 drop 3 — root on string 5','G7 drop 3 — root on string 6','Cmaj7 drop 3','Ring'],
  figs:[{type:'chords',title:'Drop-3 voicings',items:[{name:'Dm7',frets:[null,5,null,5,6,5]},{name:'G7',frets:[3,null,3,4,3,null]},{name:'Cmaj7',frets:[8,null,9,9,8,null]}]}]},
 {id:'21-3',title:'The Melodic Minor Scale',mins:25,bpm:90,chords:['Cmmaj7','Cmmaj7','F7#11','F7#11'],
  tab:'5/3 5/5 4/1 4/3 4/5 3/2 3/4 3/5 | 3/5 3/4 4/5 4/1 5/3h | 4/3 4/5 3/2 3/4 3/5 2/3 2/4 2/6 | 2/6h 3/4h',
  html:'<p>The <b>melodic minor</b> scale — called “jazz minor” — is a major scale with a ♭3: 1 2 ♭3 4 5 6 7. It is the second most important scale family in jazz, because its modes produce the modern sounds. These include the <b>m(maj7)</b> chord, <b>Lydian dominant</b> (7♯11), <b>Locrian ♮2</b> (m7♭5) and the <b>altered scale</b> (7alt).</p><p>The exercise plays C melodic minor over Cm(maj7), then the same notes starting on F — F Lydian dominant — over F7♯11. Same notes, new chord.</p>',
  table:{title:'Key modes of melodic minor (from C)',head:['Mode','Starts on','Chord','Use'],rows:[['1 — Melodic minor','C','Cm(maj7), Cm6','Minor tonic'],['4 — Lydian dominant','F','F7♯11','Non-resolving dominants, tritone subs'],['6 — Locrian ♮2','A','Am7♭5','ii of minor keys'],['7 — Altered','B','B7alt','Resolving dominants (B7alt → Em)']]},
  keys:['1 2 ♭3 4 5 6 7','The “jazz minor”','Modes: Lydian dominant, Locrian ♮2, Altered','One scale, many modern sounds'],
  usage:['Play melodic minor on m6 and m(maj7) tonic chords','Lydian dominant on 7♯11 and tritone-sub chords','Altered scale on V7 resolving to I (G7alt = A♭ melodic minor)','Locrian ♮2 on m7♭5 chords'],
  drills:['Play C melodic minor in two positions','Find the melodic minor for G7alt (A♭) and play it over G7','Improvise over the Minor ii–V–i preset using only melodic minor modes'],
  cues:['C melodic minor ascending','Cm(maj7) arpeggio','F Lydian dominant — the same notes from F','Land on F, then B — the ♯11'],
  figs:[{type:'scale',root:'C',scale:'melmin',from:1,to:5,title:'C melodic minor'},{type:'scale',root:'F',scale:'lydiandom',from:1,to:6,title:'F Lydian dominant (mode 4)'}]},
 {id:'21-4',title:'Melodic Minor in Action: Minor ii–V–i',mins:25,bpm:100,chords:['Dm7b5','G7alt','Cmmaj7','Cmmaj7'],
  tab:'4/0 4/2 4/3 3/0 3/1 3/3 2/1 2/3 | 1/1 2/4 2/2 2/0 3/3 3/1 3/0 4/3 | 4/1q 4/5q 3/4q 2/1q | 2/4w',
  html:'<p>Melodic minor modes cover a whole <b>minor ii–V–i</b>. Over Dm7♭5, play D Locrian ♮2 (= F melodic minor). Over G7alt, play G altered (= A♭ melodic minor). Over Cm(maj7), play C melodic minor. Three scales, each a half or whole step apart, give smooth, modern lines.</p><p>The G altered line descends through ♭7, ♯9, ♭9, 3, ♭13 and ♭9 down to the root. Then the Cm(maj7) arpeggio resolves it.</p>',
  keys:['m7♭5 → Locrian ♮2 (mel. minor from ♭3)','7alt → altered (mel. minor a half step up)','m(maj7) → melodic minor','Smooth half-step connections'],
  usage:['Shortcut: altered = melodic minor a half step above the dominant root','Locrian ♮2 = melodic minor from the ♭3 of the m7♭5','Use these sounds in minor-key standards such as Blue Bossa (Lesson 10-3)'],
  drills:['Play F, A♭ and C melodic minor in one position','Write your own 1-bar G altered line resolving to C','Use it on Blue Bossa’s minor ii–V–is'],
  cues:['D Locrian ♮2 over Dm7♭5','G altered descending','Cm(maj7) arpeggio — resolution','Hold E♭'],

]},
{id:22,title:'Bergonzi Concepts: Inside Improvisation',color:'#ffd580',blurb:'Melodic structures, pentatonics, jazz line, rhythm, intervals, hexatonics and language.',lessons:[
 {id:'22-1',title:'Melodic Structures: The 1-2-3-5 Cell',mins:25,bpm:110,chords:['Dm7 G7','Cmaj7 A7','Dm7 G7','Cmaj7'],
  tab:'4/0 4/2 4/3 3/2 2/3 2/0 3/2 3/0 | 2/1 2/3 1/0 1/3 1/0 2/2 2/0 3/2 | 1/1 1/0 2/3 3/2 3/0 3/2 2/0 2/3 | 1/3 1/0 2/3 2/1 1/0h',
  html:'<p>Jerry Bergonzi’s <i>Inside Improvisation</i> series begins with <b>melodic structures</b>: small digital cells applied to every chord. The most famous is <b>1-2-3-5</b>, the first, second, third and fifth degrees of a chord’s scale. It always sounds musical, and it outlines the chord instantly.</p><p>The real power comes from <b>permutations</b>: 1235, 5321, 3215, 2135, 1253… Mix permutations as the chords change, choosing the one that starts closest to your last note. Exercises here are original; see the books for the complete method.</p>',
  table:{title:'Useful permutations of 1-2-3-5',head:['Permutation','On C','Shape'],rows:[['1 2 3 5','C D E G','Ascending'],['5 3 2 1','G E D C','Descending'],['3 2 1 5','E D C G','Down then leap'],['2 1 3 5','D C E G','Zig-zag up'],['1 2 5 3','C D G E','Up, leap, back'],['5 3 1 2','G E C D','Down, step up']]},
  keys:['1-2-3-5 = a chord in four notes','24 permutations','Pick the permutation nearest your last note','Works on major, minor and dominant chords'],
  usage:['Apply 1235 on every chord of a tune, one cell per chord','Over minor chords use 1-2-♭3-5; over m7♭5 use 1-2-♭3-♭5 (or 1-♭2)','Combine cells into long lines by connecting with steps','Transpose a cell through all 12 keys'],
  drills:['Play 1235 on all 12 major chords around the circle of 4ths','Practise four permutations on Dm7 G7 Cmaj7','Apply 1235 cells to the Autumn Leaves form'],
  cues:['Dm7 1235 → G7 5321','Cmaj7 1235 → A7 5321','Dm7 3215 → G7 1235','Cmaj7 5321 — resolve'],
  figs:[{type:'dots',from:0,to:5,title:'1-2-3-5 on Cmaj7',dots:[{s:2,f:1,l:'1',cls:'root'},{s:2,f:3,l:'2',cls:'ct'},{s:1,f:0,l:'3',cls:'ct'},{s:1,f:3,l:'5',cls:'ct'}]}]},
 {id:'22-2',title:'Pentatonic Cells in Groups of Four',mins:25,bpm:110,chords:['Cmaj7','Cmaj7','Am7','Am7'],
  tab:'1/0 2/3 2/0 3/2 2/3 2/0 3/2 3/0 | 2/0 3/2 3/0 4/2 3/2 3/0 4/2 4/0 | 4/0 4/2 3/0 3/2 4/2 3/0 3/2 2/0 | 3/0 3/2 2/0 2/3 3/2 2/0 2/3 1/0',
  html:'<p>Bergonzi’s second volume treats <b>pentatonics</b> as a modern jazz tool. Pentatonic scales lack half steps, so they sound open and fit many chords. By playing them in <b>four-note groupings</b> that step through the scale, you get the intervallic sound heard in post-bop.</p><p>Here G major pentatonic (G A B D E) is played over Cmaj7 — giving 5 6 7 9 3, with no root — and over Am7. The line descends in groups of four, then ascends.</p>',
  table:{title:'Pentatonic choices (major pentatonic built on…)',head:['Chord','Pentatonic','Result'],rows:[['Cmaj7','C major pent','Inside: 1 2 3 5 6'],['Cmaj7','G major pent','5 6 7 9 3 — no root'],['Cmaj7♯11','D major pent','9 3 ♯11 13 7 — Lydian'],['Dm7','F major pent','♭3 11 5 ♭7 1'],['G7alt','D♭ major pent','♭5 ♭13 ♭7 ♭9 ♯9']]},
  keys:['Pentatonics = no half steps = open sound','Groups of four through the scale','Major pent on the 5th avoids the root','One pentatonic fits several chords'],
  usage:['Use pentatonic groupings on long chords and modal tunes','Choose the pentatonic that contains the chord’s colour tones','Sequence groupings ascending and descending to avoid sounding like a rock lick'],
  drills:['Play G major pent in groups of 4 ascending and descending','Do the same with groups of 3 and 5','Map pentatonics onto each chord of a ii–V–I'],
  cues:['G major pent descending in 4s over Cmaj7','…continuing down','Ascending in 4s over Am7','…to the top'],
  figs:[{type:'scale',root:'G',scale:'majpent',from:0,to:4,title:'G major pentatonic'}]},
 {id:'22-3',title:'The Jazz Line: Chord Tones on the Beat',mins:25,bpm:110,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'4/0 4/2 4/3 3/1 3/2 3/4 3/5 3/6 | 3/7 3/5 3/4 3/3 3/2 3/0 4/3 4/4 | 4/5 4/4 4/2 5/5 5/3q 4/2q | 4/2w',
  html:'<p>A convincing <b>jazz line</b> places <b>chord tones on the downbeats</b> and uses the upbeats for passing tones and chromatic approaches. This is the core idea of bebop eighth-note language. In Bergonzi’s work, these principles are organised into a system.</p><p>In bar 1, D, F, A and C (the Dm7 chord tones) fall on beats 1–4. Between them sit a scale tone (E), a chromatic approach from below (G♯ → A), another scale tone (B) and a chromatic lead-in (C♯ → D). In bar 2, chromatic passing tones (B♭, F♯) fill whole steps so G7’s chord tones stay on beats.</p>',
  table:{title:'Jazz-line principles',head:['Device','Example','Effect'],rows:[['Chord tone on the beat','D on beat 1 of Dm7','Clarity'],['Scale tone on the “and”','E between D and F','Smooth motion'],['Chromatic approach from below','G♯ → A','Pull into the target'],['Chromatic passing tone','B → B♭ → A','Keeps chord tones on beats'],['Enclosure','F – D♯ – E','Bebop signature (Lesson 3-3)']]},
  keys:['Chord tones on downbeats','Passing and chromatic tones on upbeats','Chromatic notes fill whole steps','Change direction to keep shape'],
  usage:['Check your lines: are the chord tones landing on the beat?','Add a chromatic passing tone whenever a chord tone would fall off the beat','Approach targets from a half step below for maximum pull'],
  drills:['Write a 1-bar line over Dm7 with chord tones on all four beats','Add chromatic approaches to a G7 arpeggio','Analyse a bebop solo you love: circle the chord tones on downbeats'],
  cues:['D F A C on the beats','G7 — chromatic passing tones fill the gaps','Resolve to G, then descend','Land on E'],
  figs:[{type:'arp',root:'D',q:'m7',from:0,to:5,title:'Dm7 chord tones (targets)'}]},
 {id:'22-4',title:'Melodic Rhythms & Displacement',mins:20,bpm:110,chords:['Cmaj7','Cmaj7','Cmaj7','Cmaj7'],
  tab:'3/5 3/7 2/5 3/5 3/7 2/5 3/5 3/7 | 2/5 3/5 3/7 2/5 3/5 3/7 2/5 re | re 3/5 3/7 2/5q 2/8 2/5 3/7 | 3/5q rq rh',
  html:'<p>Bergonzi devotes a whole volume to <b>melodic rhythms</b>: the same notes become a completely different idea when you change the rhythm. Two key tools are <b>groupings</b> and <b>displacement</b>.</p><p>Bars 1–2 repeat a 3-note cell (C D E) in eighth notes. Because 3 doesn’t divide into 8, the accent shifts each time — a “3 over 4” effect. Bar 3 <b>displaces</b> a phrase by starting it an eighth note late. Bar 4 leaves <b>space</b>, the most underused rhythmic device.</p>',
  table:{title:'Rhythmic devices',head:['Device','How','Effect'],rows:[['Grouping','Repeat a 3- or 5-note cell in eighths','Accent shifts across the beat'],['Displacement','Start the same phrase an eighth later','Fresh feel, same notes'],['Anticipation','Arrive on the “and” of 4','Forward motion'],['Triplets','Switch from eighths to triplets','Change of energy'],['Space','Rest on purpose','Lets ideas breathe']]},
  keys:['Rhythm changes the meaning of notes','3-note groupings over 4/4','Displace phrases by an eighth','Space is a rhythm too'],
  usage:['Repeat one motif, changing only its rhythm, for a whole chorus','Start phrases on different eighths of the bar — not always beat 1','Mix eighths, triplets and rests to shape a solo’s energy'],
  drills:['Play a 4-note cell starting on each of the 8 eighth-note positions','Improvise using only 3-note groupings','Solo one chorus where every phrase starts on an upbeat'],
  cues:['C-D-E in groups of 3 — the accent moves','…and again','Displaced by an eighth note','Space'],
  figs:[]},
 {id:'22-5',title:'Intervallic Melodies',mins:20,bpm:100,chords:['Dm7','Dm7','Dm7','Dm7'],
  tab:'4/0 3/0 4/2 3/2 4/3 3/4 3/0 2/1 | 3/2 2/3 2/0 1/0 2/1 1/1 2/3 1/3 | 1/3 2/3 1/1 2/1 1/0 2/0 2/3 3/2 | 4/0w',
  html:'<p>Bergonzi’s <i>Thesaurus of Intervallic Melodies</i> builds lines from a <b>fixed interval</b> moved through a scale. Diatonic 4ths, 5ths, 6ths or 7ths replace stepwise motion. The result is wide, angular and modern, less predictable than scales or arpeggios.</p><p>This exercise moves diatonic 4ths up through D Dorian (D–G, E–A, F–B, G–C …) and back down. Notice the one augmented 4th (F–B): it is part of the mode.</p>',
  table:{title:'Intervals for intervallic lines',head:['Interval','Character','Tip'],rows:[['4ths','Open, modern, quartal','Same fret on adjacent strings (not G–B)'],['5ths','Strong, wide','Invert 4ths'],['6ths','Sweet, vocal','Skip a string; great with hybrid picking'],['7ths','Angular, tense','Alternate up and down'],['Mixed','Unpredictable','Combine with 1-2-3-5 cells']]},
  keys:['Fixed interval through a scale','4ths, 5ths, 6ths, 7ths','Wide, modern sound','Stays inside the mode'],
  usage:['Use 4ths lines on modal tunes and m7 chords','Use 6ths for a sweet, vocal sound on ballads','Alternate the interval up and down for a zig-zag shape','Combine with the quartal harmony of Lesson 13-1'],
  drills:['Play diatonic 4ths, then 6ths, through D Dorian','Play 4ths through C major in two positions','Improvise for one chorus using only 4ths and 5ths'],
  cues:['Diatonic 4ths ascending: D-G, E-A, F-B, G-C','A-D, B-E, C-F, D-G','Descending 4ths','Rest on D'],
  figs:[{type:'scale',root:'D',scale:'dorian',from:0,to:4,title:'D Dorian (source of the 4ths)'}]},
 {id:'22-6',title:'Hexatonics & the Augmented Scale',mins:25,bpm:90,chords:['Cmaj7#5','Cmaj7#5','Cmaj7#5','Cmaj7#5'],
  tab:R('3/5t 2/5t 1/3t 2/4t 2/0t 3/1t',2)+' | 3/1 2/0 2/4 3/5 2/5 1/3 2/4 2/0 | 1/3t 2/5t 3/5t 2/4t 2/0t 3/1t 1/3t 2/5t 3/5t 2/4t 2/0t 3/1t | 3/5w',
  html:'<p>Bergonzi’s <i>Hexatonics</i> volume organises six-note scales built from <b>two triads</b> with no shared notes. You met diatonic triad pairs in Module “Triad Pairs”. The most striking symmetrical example is the <b>augmented scale</b>: C major (C E G) plus A♭ minor (A♭ B E♭). Together they give C E♭ E G A♭ B, a pattern of minor 3rd, half step, minor 3rd, half step.</p><p>Over Cmaj7♯5 it gives the ♯9, the 3, the 5 and ♯5, and the 7 — a bright, modern colour. The pattern alternates the two triads in triplets and eighths.</p>',
  table:{title:'Hexatonic families',head:['Hexatonic','Triads','Use over'],rows:[['Diatonic pair','F + G','Dm7, G7sus, Fmaj7♯11'],['Altered pair','D♭ + E♭','G7alt'],['Augmented scale','C + A♭m','Cmaj7♯5, Cm(maj7)'],['Lydian pair','D + Em','Cmaj7♯11']]},
  keys:['Hexatonic = 2 triads, 6 notes','Augmented scale = C + A♭m','Symmetrical: m3 + half step pattern','Great on maj7♯5 and m(maj7)'],
  usage:['Use the augmented scale on maj7♯5 chords and as a colour on m(maj7)','Alternate triads in triplets for clarity','The augmented scale repeats every major 3rd — one shape moves in three places'],
  drills:['Play C + A♭m in every inversion','Move the pattern up a major 3rd (E + Cm, A♭ + Em)','Build your own hexatonic from two triads a tritone apart (C + F♯)'],
  cues:['C triad up, A♭ minor down — in triplets','Eighth-note permutation','Descending triplets','Rest on C'],
  figs:[{type:'scale',root:'C',scale:'augmented',from:0,to:5,title:'C augmented scale'}]},
 {id:'22-7',title:'Developing a Jazz Language',mins:25,bpm:110,chords:['Dm7 G7','Cmaj7','Cm7 F7','Bbmaj7'],
  tab:'5/5 5/8 4/7 3/5 3/4 4/7 4/5 5/8 | 5/7h 3/4h | 5/3 5/6 4/5 3/3 3/2 4/5 4/3 5/6 | 5/5h 3/2h',
  html:'<p>Jazz is a language. You learn it by collecting <b>vocabulary</b> — short phrases called cells or licks — and making them your own. Practise them in every key, connect them, and finally vary them in real time. Bergonzi’s sixth volume is built around this process.</p><p>Here, one ii–V–I cell is played in C, then moved down a whole step to B♭ with the same fingering. Learning a phrase as a <b>shape</b> lets you move it to any key instantly.</p>',
  table:{title:'The vocabulary process',head:['Step','What to do'],rows:[['1. Collect','Learn a short phrase from a solo or lesson'],['2. Analyse','Find its chord tones, approach notes and rhythm'],['3. Transpose','Play it in all 12 keys (around the circle of 4ths)'],['4. Connect','Link it to other cells across chord changes'],['5. Vary','Change rhythm, register and direction'],['6. Use','Play it in a jam — then forget it and listen']]},
  keys:['Vocabulary = learned cells','Learn phrases as shapes','Transpose through 12 keys','Vary them until they are yours'],
  usage:['Learn one new ii–V–I cell every week and play it in all keys','Shapes move: shift a cell 2 frets to change key','In a solo, quote a cell, then develop it with Lesson 6-3 motif techniques'],
  drills:['Play this cell around the circle of 4ths','Change its rhythm three different ways','Connect it to the 1-2-3-5 cells of Lesson 22-1'],
  cues:['ii–V cell in C','Resolve: E then B','Same shape, down a whole step: B♭','Resolve: D then A'],
  figs:[]}
]}

{id:23,title:'Berklee Method I: Positions, Reading & Chord-Scales',color:'#e8a0bf',blurb:'Position playing, reading studies, chord-scale theory and movable chord forms — in the spirit of the Berklee guitar curriculum.',lessons:[
 {id:'23-1',title:'Position Playing',mins:25,bpm:90,style:'pop',straight:true,chords:['Cmaj7','Cmaj7','Cmaj7','Cmaj7'],
  tab:'6/8 6/10 5/7 5/8 5/10 4/7 4/9 4/10 | 3/7 3/9 3/10 2/8 2/10 1/7 1/8 1/7 | 2/10 2/8 3/10 3/9 3/7 4/10 4/9 4/7 | 5/10 5/8 5/7 6/10 6/8h',
  html:'<p>The Berklee guitar tradition, built on William Leavitt’s <i>A Modern Method for Guitar</i> (Berklee Press), teaches the neck in <b>positions</b>. A position is named after the fret where your index finger sits, and each finger covers one fret. Occasional <b>stretches</b> of the index or pinky reach one fret outside the box. With this you can play any scale in any key without looking at the neck — and read music in that position.</p><p>This exercise plays C major in <b>7th position</b> (index on fret 7). The low C at fret 8 is played with the 2nd finger, and the index stretches back to fret 7 on strings 5, 4 and 1.</p>',
  table:{title:'Position-playing principles',head:['Principle','What it means'],rows:[['One finger per fret','Index = position fret, pinky = position + 3'],['Stretches','Index or pinky reaches one fret outside the position'],['Stay in position','Don’t shift unless the range requires it'],['Learn all positions','Play every key in every position, from 1st to 12th'],['Shifts','Move on a half step or open string, with a guide finger']]},
  keys:['Position = index-finger fret','One finger per fret + stretches','Play every key in every position','Positions make reading possible'],
  usage:['Choose the position that covers a melody’s range with no shifts','Practise each new scale in at least three positions','When reading, decide the position before you start'],
  drills:['Play C major in 2nd, 5th, 7th and 10th position','Play F and G major in 7th position (stretches change)','Play a scale in 3rds within one position'],
  cues:['C major, 7th position — ascending','Over the top','Descending','Back to the low C'],
  figs:[{type:'scale',root:'C',scale:'ionian',from:6,to:10,title:'C major — 7th position'}]},
 {id:'23-2',title:'Reading Studies in Position',mins:25,bpm:80,chords:['Cmaj7','Am7','Fmaj7','Cmaj7'],
  tab:'6/8q 5/7q 5/10q. 4/7e | 4/10h 4/9q 4/7q | 5/10 4/7 4/10 3/7 3/9q 3/7q | 4/10w',
  html:'<p>Reading music is central to Berklee training. The method pairs every position with <b>reading studies</b>, and Leavitt also wrote dedicated reading and rhythm books. Read <b>in position</b>: once you know which position covers the melody, every written note has exactly one place under your fingers.</p><p>This original study in 7th position mixes quarters, halves, a dotted quarter and eighth notes. Count aloud (“1 and 2 and…”), keep going through mistakes, and look ahead to the next bar.</p>',
  table:{title:'Rhythm values',head:['Value','Beats (4/4)','Count'],rows:[['Whole','4','1 2 3 4'],['Half','2','1 2'],['Quarter','1','1'],['Dotted quarter','1½','1 and 2'],['Eighth','½','1 and'],['Triplet eighth','⅓','1 trip let']]},
  keys:['Read in position','Count aloud','Never stop for mistakes','Look one bar ahead'],
  usage:['Sight-read something new every day, even for 5 minutes','Choose the position before playing the first note','Read jazz standards from lead sheets to combine reading and repertoire'],
  drills:['Clap and count the rhythm before playing it','Play the study in 2nd position (one octave lower)','Read one new melody from a fake book each day'],
  cues:['C – E – G (dotted) – A','C – B – A','Eighth notes, then D–E–D','Hold C'],
  figs:[{type:'scale',root:'C',scale:'ionian',from:6,to:10,title:'7th position — the notes you are reading'}]},
 {id:'23-3',title:'Chord-Scale Theory & Available Tensions',mins:30,bpm:80,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'1/0h 1/3h | 1/5h 1/0h | 2/3h 1/2h | 1/5w',
  html:'<p><b>Chord-scale theory</b> is the core of the Berklee harmony curriculum. Every chord has a matching <b>scale</b>, determined by its function in the key. The scale’s non-chord tones are either <b>available tensions</b> (9, 11, 13 and their alterations), which add colour, or <b>avoid notes</b>, which clash when held. An avoid note is typically a half step above a chord tone.</p><p>The exercise sustains only tensions. Over Dm7 it plays 9 and 11, over G7 it plays 9 and 13, and over Cmaj7 it plays 9, ♯11 and 13. Each sounds rich rather than wrong, because each is available on that chord.</p>',
  table:{title:'Diatonic chord-scales in C (tensions & avoid notes)',head:['Chord','Scale','Available tensions','Avoid / use with care'],rows:[['Imaj7 — Cmaj7','Ionian','9, 13','11 (F)'],['IIm7 — Dm7','Dorian','9, 11','13 (B) — use with care'],['IIIm7 — Em7','Phrygian','11','♭9, ♭13'],['IVmaj7 — Fmaj7','Lydian','9, ♯11, 13','—'],['V7 — G7','Mixolydian','9, 13','11 (C) — unless sus'],['VIm7 — Am7','Aeolian','9, 11','♭13 (F)'],['VIIm7♭5 — Bm7♭5','Locrian','11, ♭13','♭9 (C)']]},
  keys:['Every chord has a chord-scale','Non-chord tones = tensions or avoid notes','Avoid note ≈ a half step above a chord tone','Function decides the scale'],
  usage:['Before improvising, label each chord’s scale, tensions and avoid notes','Hold tensions on strong beats; pass through avoid notes quickly','Add available tensions to your voicings (9 and 13 on V7, 9 and 11 on IIm7)','On secondary dominants, tensions follow the target: major target → 9, 13; minor target → ♭9, ♭13'],
  drills:['Write the chord-scale and tensions for every chord of Autumn Leaves','Improvise holding only tensions on beat 1','Build voicings that put a tension on top'],
  cues:['Dm7 — 9 (E), then 11 (G)','G7 — 9 (A), then 13 (E)','Cmaj7 — 9 (D), then ♯11 (F♯)','Cmaj7 — 13 (A)'],
  figs:[{type:'dots',from:0,to:5,title:'Tensions held in this exercise',cap:'All on the top two strings',dots:[{s:1,f:0,l:'E',cls:'ct'},{s:1,f:3,l:'G',cls:'ct'},{s:1,f:5,l:'A',cls:'ct'},{s:2,f:3,l:'D',cls:'ct'},{s:1,f:2,l:'F♯',cls:'root'}]}]},
 {id:'23-4',title:'Movable Chord Forms Through the Cycle',mins:25,bpm:100,comp:false,chords:['A7 D7','G7 C7','F7 Bb7','Eb7 Ab7'],
  tab:'[5/12,3/12,2/14]q [5/12,3/12,2/14]q [6/10,4/10,3/11]q [6/10,4/10,3/11]q | [5/10,3/10,2/12]q [5/10,3/10,2/12]q [6/8,4/8,3/9]q [6/8,4/8,3/9]q | [5/8,3/8,2/10]q [5/8,3/8,2/10]q [6/6,4/6,3/7]q [6/6,4/6,3/7]q | [5/6,3/6,2/8]q [5/6,3/6,2/8]q [6/4,4/4,3/5]q [6/4,4/4,3/5]q',
  html:'<p>Berklee guitar study organises voicings into <b>chord forms</b> grouped by the string the root sits on (6th, 5th or 4th). You practise each form through the <b>cycle of 4ths</b> until every chord type can be found instantly, anywhere on the neck.</p><p>Here, dominant 7ths cycle down the neck by alternating root-5 and root-6 forms: A7 D7 G7 C7 F7 B♭7 E♭7 A♭7. Watch the guide tones — each 7th falls a half step to the next 3rd. That is why alternating the two forms moves the hand so little.</p>',
  keys:['Chord forms grouped by root string','Practise every form through the cycle','Alternate root-5 / root-6 forms','Guide tones move by half step'],
  usage:['Drill each chord type (maj7, m7, 7, m7♭5) through all 12 keys with this alternation','Use it on dominant cycles in standards (bridges of rhythm changes, Sweet Georgia Brown–type changes)','Add a tension on top of each form once the shells are automatic'],
  drills:['Repeat with m7 forms, then maj7 forms','Start on root-6 instead of root-5','Add the 9th on top of every chord'],
  cues:['A7 (root 5) → D7 (root 6)','G7 → C7','F7 → B♭7','E♭7 → A♭7'],
  figs:[{type:'chords',title:'Alternating dominant forms',items:[{name:'G7',frets:[null,10,null,10,12,null]},{name:'C7',frets:[8,null,8,9,null,null]},{name:'F7',frets:[null,8,null,8,10,null]},{name:'Bb7',frets:[6,null,6,7,null,null]}]}]}
]},
{id:24,title:'Berklee Method II: Function, Analysis & Practice',color:'#a0c4ff',blurb:'Harmonic function, Berklee-style analysis, structured practice and single-string studies.',lessons:[
 {id:'24-1',title:'Harmonic Function & Cadences',mins:25,bpm:90,comp:false,chords:['Cmaj7 Fmaj7','G7 Am7','Fmaj7 G7','Cmaj7'],
  tab:'[5/3,3/4,2/5]h [6/1,4/2,3/2]h | [6/3,4/3,3/4]h [6/5,4/5,3/5]h | [6/1,4/2,3/2]h [6/3,4/3,3/4]h | [5/3,3/4,2/5]w',
  html:'<p>Berklee analysis groups chords by <b>function</b>. <b>Tonic</b> chords (I, III, VI) feel at rest. <b>Subdominant</b> chords (II, IV) move away. <b>Dominant</b> chords (V7, VII) create tension that wants to resolve. A <b>cadence</b> is how a phrase ends.</p><p>This progression first sets up G7 → Cmaj7 but resolves <b>deceptively</b> to Am7 — a tonic-function substitute — and then completes the <b>authentic</b> cadence IV–V–I. Hearing function lets you predict where the harmony is going.</p>',
  table:{title:'Cadence types',head:['Cadence','Motion','Effect'],rows:[['Authentic','V7 → I','Strong, final'],['Plagal','IV → I (or IVm → I)','Gentle, “amen”'],['Deceptive','V7 → VIm','Surprise, extends the phrase'],['Half','… → V7','Open, unresolved'],['Backdoor','IVm7 → ♭VII7 → I','Soft, bluesy']]},
  keys:['Tonic, subdominant, dominant','Cadence = how a phrase ends','Deceptive: V → VI','Function predicts the harmony'],
  usage:['Label T / SD / D above every chord of a tune before learning it','Use a deceptive cadence to extend a phrase or a song ending','When soloing, release tension on the tonic chords'],
  drills:['Mark the function of each chord in All the Things You Are','Rewrite I–IV–V–I as a deceptive cadence','Play each cadence type in three keys'],
  cues:['Cmaj7 (T) → Fmaj7 (SD)','G7 (D) → Am7: deceptive!','Fmaj7 (SD) → G7 (D)','Cmaj7 (T): authentic cadence'],
  figs:[{type:'chords',title:'Voicings used',items:[{name:'Fmaj7',frets:[1,null,2,2,null,null]},{name:'Am7',frets:[5,null,5,5,null,null]},{name:'G7',frets:[3,null,3,4,null,null]}]}]},
 {id:'24-2',title:'Berklee-Style Analysis: Related ii and SubV7',mins:25,bpm:110,chords:['Cmaj7','Em7 A7','Dm7 Db7','Cmaj7'],
  tab:'1/0h 2/0h | 1/3q 2/3q 2/2q 1/3q | 1/1q 2/1q 2/0q 1/1q | 1/0w',
  html:'<p>Berklee harmonic analysis uses a standard set of labels. A secondary dominant is written <b>V7/II</b>, meaning “V of II”. Its paired minor chord is the <b>related IIm7</b>. A tritone substitute is written <b>SubV7</b>. A solid arrow marks a dominant resolving down a 5th, a dotted arrow marks a SubV7 resolving down a half step, and a bracket joins each II–V pair.</p><p>Analysed this way, the progression reads: Imaj7 | IIm7/II – V7/II | IIm7 – SubV7 | Imaj7. The guide-tone line connects it all with half steps.</p>',
  table:{title:'Analysis symbols',head:['Symbol','Meaning','Example in C'],rows:[['V7/II','Secondary dominant of II','A7 → Dm7'],['IIm7/II','Related II of that dominant','Em7 (before A7)'],['SubV7','Tritone substitute of V7','D♭7 → Cmaj7'],['SubV7/II','Tritone sub of V7/II','E♭7 → Dm7'],['Solid arrow','Dominant resolves down a 5th','G7 → C'],['Dotted arrow','SubV7 resolves down a half step','D♭7 → C'],['Bracket','A II–V pair','Em7–A7']]},
  keys:['V7/x = secondary dominant','Related IIm7 pairs with it','SubV7 = tritone substitute','Arrows and brackets show motion'],
  usage:['Analyse any standard with these labels before improvising','Every bracketed II–V suggests one scale area for both chords','Dotted arrows tell you a chromatic (half-step) bass line is coming'],
  drills:['Analyse the bridge of All the Things You Are with these symbols','Add a related II before every secondary dominant in a blues','Replace each V7/x with its SubV7 and listen'],
  cues:['Imaj7: E and B','Em7 → A7: related II – V7/II','Dm7 → D♭7: II – SubV7','Imaj7: resolve to E'],
  figs:[{type:'chords',title:'Shells for the analysis',items:[{name:'Em7',frets:[null,7,null,7,8,null]},{name:'A7',frets:[5,null,5,6,null,null]},{name:'Dm7',frets:[null,5,null,5,6,null]},{name:'Db7',frets:[null,4,null,4,6,null]}]}]},
 {id:'24-3',title:'The Structured Practice Method',mins:20,bpm:90,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'2/1h 2/3h | 2/0h 1/3h | 1/0h 2/1h | 2/1w',
  html:'<p>Conservatory programs like Berklee’s balance several areas every week: <b>technique</b>, <b>reading</b>, <b>harmony and chord forms</b>, <b>repertoire</b>, <b>improvisation</b> and <b>ear training</b>. Progress comes from regular, focused sessions with clear goals and tempo targets, not from long, random ones.</p><p>Use the table as a daily template, and log your time with the Metronome & Timer tool. This short guide-tone study is a good place to try the “tempo ladder”: play it at 60, 80, 100 and 120 BPM, only moving up when it is clean.</p>',
  table:{title:'A 60-minute daily practice template',head:['Area','Minutes','Example (from this course)'],rows:[['Technique','10','Spider, alternate & sweep picking (Lessons 14-4, 19-2, 19-3)'],['Reading','10','Reading studies in position (Lesson 23-2)'],['Chord forms & harmony','10','Forms through the cycle (Lesson 23-4)'],['Repertoire','10','One standard per month (Module “Jazz Standards”)'],['Improvisation','15','Jam Room with chord-scale goals'],['Ear training','5','Intervals & chord qualities']]},
  keys:['Balance six areas','Short, focused sessions','Tempo ladder: speed only when clean','Log your practice'],
  usage:['Pick one goal per area each week and write it down','Record yourself once a week and compare','Rotate keys: practise each exercise in a new key every week'],
  drills:['Plan this week’s six goals using the table','Play the guide-tone study at 60, 80, 100 and 120 BPM','Keep a 7-day streak on the Home page'],
  cues:['Dm7 — C then D','G7 — B then G','Cmaj7 — E then C','Hold C'],
  figs:[]},
 {id:'24-4',title:'Single-String Studies',mins:20,bpm:90,chords:['Cmaj7','Cmaj7','G7','Cmaj7'],
  tab:'2/1 2/3 2/5 2/6 2/8 2/10 2/12 2/13 | 2/13 2/12 2/10 2/8 2/6 2/5 2/3 2/1 | 3/0 3/2 3/4 3/5 3/7 3/9 3/10 3/12 | 2/1w',
  html:'<p>Former Berklee professor Mick Goodrick, in <i>The Advancing Guitarist</i>, encouraged guitarists to also learn the neck <b>horizontally</b>, playing scales up and down a <b>single string</b>. It reveals the interval pattern of a scale as plain distances (W W H W W W H) and breaks the habit of thinking only in boxes.</p><p>Bars 1–2 play C major along the B string. Bar 3 plays G Mixolydian along the G string. Use one or two fingers and slide between notes, listening to the melodic shape.</p>',
  keys:['Learn the neck horizontally too','Scale steps become visible distances','Breaks box-pattern habits','Connects positions'],
  usage:['Improvise on one string to focus on melody and phrasing','Use single-string runs to shift between positions smoothly','Combine with position playing: vertical + horizontal = the whole neck'],
  drills:['Play the major scale on each string, in C, F and G','Improvise a chorus of the blues using only the B string','Then two adjacent strings only'],

]}
