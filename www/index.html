<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>Jazz Guitar Academy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0e1014;--bg2:#141821;--card:#1a1f29;--card2:#222835;--line:#2c3341;--ink:#f1eadb;--ink2:#cfc7b6;--muted:#8f98a8;--brass:#d9a441;--brass2:#f3c969;--teal:#58b8ad;--rose:#e07a6a;--blue:#7aa2e3;--ok:#6cc488;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 560px at 85% -10%,rgba(217,164,65,.11),transparent 60%),var(--bg);min-height:100vh}
a{color:var(--brass2)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 12px;background:rgba(9,11,15,.55);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px;text-decoration:none;color:var(--ink)}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--brass);display:flex;align-items:center;justify-content:center;color:#1a1307;font-family:var(--serif);font-weight:700;font-size:20px}
.brand b{font-family:var(--serif);font-size:18px;display:block}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.navlink{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:15px}
.navlink:hover{background:var(--card)}
.navlink.on{background:var(--card2);color:var(--ink);box-shadow:inset 3px 0 0 var(--brass)}
.navlink svg{width:20px;height:20px;flex:none}
.sideFoot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;line-height:1.5}
main{padding:28px clamp(16px,4vw,48px) 130px;max-width:1200px;width:100%;outline:none;min-width:0}
.bottom{display:none}
@media (max-width:860px){
 .app{grid-template-columns:1fr}.side{display:none}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,20,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
 .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 0}
 .bottom a.on{color:var(--brass2)}.bottom svg{width:22px;height:22px}
 main{padding:18px 16px 160px}
}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px;margin:0}
h1{font-size:clamp(27px,4.2vw,40px);line-height:1.12}
h2{font-size:22px;line-height:1.2}
h3{font-size:17px}
p{line-height:1.62;color:var(--ink2)}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--brass);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{height:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);padding:10px 15px;border-radius:10px;cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink);min-height:44px;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:#414a5d}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#1a1307;font-weight:650}
.btn.pri:hover{background:var(--brass2)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13.5px;color:var(--ink2);min-height:36px}
.chip.on{background:var(--brass);color:#1a1307;border-color:var(--brass);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.badge{font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
select,input[type=text],textarea{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;min-height:44px;width:100%}
textarea{font-family:var(--mono);font-size:14px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
label.f b{color:var(--ink)}
.flabel{font-size:12.5px;color:var(--muted);margin-bottom:6px}
input[type=range]{accent-color:var(--brass);width:100%;height:28px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none;color:var(--ink2);padding:4px 0}
.toggle input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.2s;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle input:checked{background:var(--brass)}
.toggle input:checked::after{left:20px}
/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;margin-bottom:22px}
.hero p{font-size:16.5px;max-width:560px}
.heroArt{display:flex;justify-content:center}
.guitarArt{width:min(260px,70%);height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
@media (max-width:700px){.hero{grid-template-columns:1fr}.heroArt{order:-1}.guitarArt{width:150px}}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .v{font-family:var(--serif);font-size:32px;color:var(--ink)}
.stat .l{font-size:12.5px;color:var(--muted)}
.ringWrap{display:flex;gap:14px;align-items:center}
.routine{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.rt{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.rt:hover{border-color:#414a5d}
.rt .n{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);color:var(--brass2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);flex:none}
.rt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.secHead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:30px 0 12px}
/* modules */
.module{margin-bottom:30px}
.mhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.mnum{width:48px;height:48px;border-radius:12px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;flex:none}
.mhead p{margin:4px 0 0}
.mprog{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.lgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lcard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.lcard:hover{border-color:#414a5d;transform:translateY(-1px)}
.lcard .lnum{grid-row:span 2;font:600 13px var(--mono);color:var(--brass);background:var(--card2);border-radius:8px;padding:6px 7px}
.lcard .lt{font-weight:600;font-size:15px}
.lcard .lmeta{grid-column:2;font-size:12.5px;color:var(--muted)}
.lcard .lstat{grid-row:1/span 2;grid-column:3;color:var(--ok)}
.lcard .lstat svg{width:20px;height:20px}
.lcard.done{border-color:rgba(108,196,136,.35)}
/* lesson */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.lhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.lessonGrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:1050px){.lessonGrid{grid-template-columns:minmax(0,1fr)}}
.colMain{display:grid;gap:14px;min-width:0}
.colSide{display:grid;gap:14px;position:sticky;top:16px}
@media (max-width:1050px){.colSide{position:static}}
.screen{position:relative;background:linear-gradient(180deg,#0a0c10,#121720);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;gap:10px}
.chordNow{font-family:var(--serif);font-size:30px;color:var(--brass2);min-width:96px;line-height:1.1}
.barNow{font-family:var(--serif);font-size:20px;text-align:right}
.beats{display:flex;gap:7px}
.beats i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block;transition:background .05s}
.beats i.on{background:var(--brass2);box-shadow:0 0 12px var(--brass)}
.beats i.cnt{background:var(--rose);box-shadow:0 0 12px var(--rose)}
.fbwrap{padding:2px 8px}
.caption{min-height:48px;padding:8px 16px 14px;text-align:center;color:var(--ink);font-size:15px;line-height:1.4}
.progress{height:4px;background:var(--line)}.progress i{display:block;height:100%;background:var(--brass);width:0;transition:width .15s linear}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(8,9,12,.58);cursor:pointer;border:0;width:100%;color:var(--ink);-webkit-tap-highlight-color:transparent}
.overlay .pbig{width:72px;height:72px;border-radius:50%;background:var(--brass);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(217,164,65,.45);color:#1a1307}
.overlay .pbig svg{width:30px;height:30px;margin-left:4px}
.overlay .ovt{font-size:14px;letter-spacing:.5px}
.overlay[hidden]{display:none}
.ctrls{display:grid;gap:12px}
.toggles{gap:6px 18px}
.tabwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px 6px;overflow:hidden}
.tabhead{display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px}
.prose p:first-child{margin-top:0}.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink)}
.keys{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.keys li{display:flex;gap:10px;font-size:14.5px;line-height:1.45;color:var(--ink2)}
.keys li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brass);margin-top:7px;flex:none}
.steps{display:grid;gap:4px}
.steps label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4;color:var(--ink2);cursor:pointer;padding:6px 0}
.steps input{accent-color:var(--brass);width:18px;height:18px;margin:1px 0 0;flex:none}
.figs{display:grid;gap:14px}
.fig h3{margin-bottom:4px}.fig .cap{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.cdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.ccard b{font-family:var(--serif);font-size:17px}
.ccard small{color:var(--muted);font-size:11.5px}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.fbscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.fbscroll .fb{min-width:720px}
/* svg: fretboard */
.fb{width:100%;height:auto;display:block}
.fb .wood{fill:#2b1d13}
.fb .fret{stroke:#9ea4ad;stroke-width:2}
.fb .nut{stroke:#ece3d0;stroke-width:6}
.fb .str{stroke:#cdbd92}
.fb .inlay{fill:#efe4cc;opacity:.28}
.fb .fn{fill:var(--muted);font-size:11px;text-anchor:middle;font-family:var(--sans)}
.fb .hit{fill:transparent;cursor:pointer}
.fb .dot{transform-box:fill-box;transform-origin:center;pointer-events:none}
.fb .dot circle{fill:#3a4252;stroke:#8f98a8;stroke-width:1.4}
.fb .dot text{fill:var(--ink);font-size:10px;text-anchor:middle;dominant-baseline:central;font-weight:650;font-family:var(--sans)}
.fb .dot.root circle{fill:var(--brass);stroke:var(--brass2)}.fb .dot.root text{fill:#1a1307}
.fb .dot.ct circle{fill:#285a55;stroke:var(--teal)}
.fb .dot.ghost circle{fill:rgba(255,255,255,.03);stroke:#5d6778;stroke-dasharray:2.5 2}.fb .dot.ghost text{fill:#7d8696}
.fb .dot.on circle{fill:var(--brass2);stroke:#fff;stroke-width:2}.fb .dot.on text{fill:#1a1307}
.fb .dot.on{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.55)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fb .str.vib{animation:vib .09s linear 4}
@keyframes vib{0%,100%{transform:translateY(0)}25%{transform:translateY(-1.3px)}75%{transform:translateY(1.3px)}}
.fb .ripple{fill:none;stroke:var(--brass2);stroke-width:2;animation:rip .6s ease-out forwards;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes rip{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
/* svg: tab */
.tab{width:100%;height:auto;display:block}
.tab .tl{stroke:#4c5466;stroke-width:1}
.tab .bl{stroke:#727b8e;stroke-width:1.5}
.tab .tn rect{fill:var(--card)}
.tab .tn text{fill:var(--ink);font:650 14px var(--mono);text-anchor:middle;dominant-baseline:central}
.tab .tn.on rect{fill:var(--brass2)}
.tab .tn.on text{fill:#1a1307}
.tab .cs{fill:var(--brass2);font:600 15px var(--serif)}
.tab .stem{stroke:#727b8e;stroke-width:1.3}
.tab .tablbl{fill:var(--muted);font:700 10.5px var(--mono);text-anchor:middle}
.tab .bn{fill:#667084;font:10px var(--sans)}
/* svg: chord diagram */
.cd{width:100%;max-width:132px;height:auto}
.cd line{stroke:#7b8494;stroke-width:1.2}.cd .nut{stroke:var(--ink);stroke-width:4}
.cd circle{fill:var(--ink)}.cd circle.r{fill:var(--brass)}
.cd .dl{fill:#121212;font:700 7.6px var(--sans);text-anchor:middle;dominant-baseline:central}
.cd .mk{fill:var(--muted);font:600 11px var(--sans);text-anchor:middle}
.cd .bf{fill:var(--muted);font:11px var(--sans);text-anchor:end}
/* jam */
.jam{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.jam{grid-template-columns:minmax(0,1fr)}}
.jamCtl{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mixer{display:grid;gap:4px}
.mixer label{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.jamMain{display:grid;gap:14px;min-width:0}.jamMain>*,.colMain>*,.card{min-width:0}
.now .bigChord{font-family:var(--serif);font-size:46px;color:var(--brass2);line-height:1.05}
.nowTop{justify-content:space-between;align-items:flex-start}
.beats.big i{width:15px;height:15px}
.scaleTip{font-size:14px;color:var(--ink2);margin:8px 0 10px;line-height:1.5}
.scaleTip b{color:var(--teal)}
.chart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 8px;min-height:62px;display:flex;justify-content:space-around;align-items:center;gap:4px;cursor:pointer;font-family:var(--serif);font-size:17px;transition:.1s}
.bar span{white-space:nowrap}
.bar.on{background:color-mix(in srgb,var(--brass) 20%,var(--card));border-color:var(--brass);color:var(--brass2)}
.bar small{position:absolute}
@media (max-width:520px){.bar{font-size:14px;padding:10px 4px;flex-direction:column}}
/* tools */
.tools{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tool{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tool .ti{width:46px;height:46px;border-radius:12px;background:var(--card2);color:var(--brass2);display:flex;align-items:center;justify-content:center;flex:none}
.tool .ti svg{width:24px;height:24px}
.tool small{display:block;color:var(--muted);margin-top:3px;font-size:13px;line-height:1.4}
/* ear */
.earBig{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 16px;text-align:center}
.playOrb{width:96px;height:96px;border-radius:50%;background:var(--brass);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1a1307;box-shadow:0 12px 40px rgba(217,164,65,.35)}
.playOrb svg{width:36px;height:36px;margin-left:5px}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:100%}
.answers .btn.right{background:var(--ok);border-color:var(--ok);color:#0c1a10}
.answers .btn.wrong{background:var(--rose);border-color:var(--rose);color:#200a06}
.fb-msg{min-height:24px;font-size:15px}
/* metronome */
.metro{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.bpmBig{font-family:var(--serif);font-size:72px;line-height:1}
.mbeats{display:flex;gap:12px}
.mbeats i{width:22px;height:22px;border-radius:50%;background:var(--line);display:block}
.mbeats i.on{background:var(--brass2);box-shadow:0 0 16px var(--brass)}
.mbeats i.acc{outline:2px solid var(--brass);outline-offset:2px}
.timer{font-family:var(--mono);font-size:44px}
/* mini player + toast */
.mini{position:fixed;right:16px;bottom:16px;z-index:40;background:var(--card2);border:1px solid var(--brass);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.mini[hidden]{display:none}
.mini .eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.mini .eq i{width:3px;background:var(--brass2);animation:eq .8s ease-in-out infinite}
.mini .eq i:nth-child(2){animation-delay:-.3s}.mini .eq i:nth-child(3){animation-delay:-.55s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.mini .mt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
@media (max-width:860px){.mini{bottom:calc(74px + env(safe-area-inset-bottom));right:10px;left:10px}}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-250%);visibility:hidden;background:var(--ink);color:#15120c;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.atbl{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.atbl th{text-align:left;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass);padding:8px 10px;border-bottom:1px solid var(--line)}
.atbl td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;line-height:1.4}
.atbl td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
.drills{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink2);font-size:14.5px;line-height:1.45}
.phase{margin:34px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
.level{display:flex;gap:14px;align-items:center;margin:22px 0 14px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;scroll-margin-top:12px}

'use strict';
/*CORE-START*/
// =====================================================================
//  MUSIC THEORY

const OPEN={1:64,2:59,3:55,4:50,5:45,6:40};

 '13':{iv:[0,4,7,10,14,21],v:[4,10,14,21],sc:'mixolydian',n:'Dominant 13'},
 '7b9':{iv:[0,4,7,10,13],v:[4,7,10,13],sc:'halfwhole',n:'Dominant 7♭9'},
 '7#9':{iv:[0,4,7,10,15],v:[4,10,15],sc:'altered',n:'Dominant 7♯9'},
 '7alt':{iv:[0,4,10,15,20],v:[4,10,15,20],sc:'altered',n:'Altered dominant'},
 '7#11':{iv:[0,4,7,10,18],v:[4,10,14,18],sc:'lydiandom',n:'Dominant 7♯11'},
 '7sus4':{iv:[0,5,7,10],v:[5,10,14],sc:'mixolydian',n:'Dominant 7sus4'},
 m7:{iv:[0,3,7,10],v:[3,7,10,14],sc:'dorian',n:'Minor 7'},

const ALIAS={'':'maj','M':'maj','Maj7':'maj7','M7':'maj7','ma7':'maj7','Δ':'maj7','Δ7':'maj7','^7':'maj7','^':'maj7','M9':'maj9','Δ9':'maj9','maj13':'maj9','6/9':'6','69':'6','-':'m','min':'m','-7':'m7','min7':'m7','mi7':'m7','-9':'m9','m11':'m9','-6':'m6','m69':'m6','ø':'m7b5','ø7':'m7b5','-7b5':'m7b5','m7(b5)':'m7b5','o7':'dim7','°7':'dim7','dim':'dim7','o':'dim7','°':'dim7','alt':'7alt','+':'aug','aug':'aug','7+':'7#5','+7':'7#5','7b13':'7alt','7b9b13':'7alt','7#9b13':'7alt','7#5#9':'7alt','13b9':'7b9','7(b9)':'7b9','sus':'7sus4','7sus':'7sus4','9sus4':'7sus4','9sus':'7sus4','sus4':'7sus4','13sus':'7sus4','mM7':'mmaj7','m(maj7)':'mmaj7','-Δ':'mmaj7','-maj7':'mmaj7','11':'9','add2':'add9','m(add9)':'madd9','-add9':'madd9','maj7+5':'maj7#5','Δ#5':'maj7#5','Δ#11':'maj7#11','maj9#11':'maj7#11','M7#11':'maj7#11','9#11':'7#11','13#11':'7#11'};
function parseChord(sym){
 sym=String(sym).trim();const m=sym.match(/^([A-G])([#b]?)(.*)$/);if(!m)return null;
 let rest=m[3];let bass=null;const sl=rest.match(/^(.*)\/([A-G][#b]?)$/);if(sl){rest=sl[1];bass=pcOf(sl[2]);}
 let q=QUALS[rest]?rest:ALIAS[rest];
 if(!q||!QUALS[q]){q=/^(m(?!aj)|-)/.test(rest)?(rest.includes('b5')?'m7b5':'m7'):/maj|M|Δ/.test(rest)?'maj7':/dim|o/.test(rest)?'dim7':/\d/.test(rest)?'7':'maj';}
 return {sym,root:pcOf(m[1]+m[2]),q,Q:QUALS[q],bass};
}
function transposeSym(sym,n){const m=sym.match(/^([A-G][#b]?)(.*)$/);if(!m)return sym;let rest=m[2].replace(/\/([A-G][#b]?)$/,(x,b)=>'/'+FLAT[(pcOf(b)+n+120)%12]);return FLAT[(pcOf(m[1])+n+120)%12]+rest;}
function intervalLabel(x,q){const Q=QUALS[q]||{iv:[]};const iv=Q.iv.map(v=>v%12);const has7=iv.includes(10)||iv.includes(11);
 switch(x){case 0:return 'R';case 1:return 'b9';case 2:return has7?'9':'2';case 3:return iv.includes(4)?'#9':'b3';case 4:return '3';case 5:return has7&&!String(q).includes('sus')?'11':'4';case 6:return iv.includes(7)?'#11':'b5';case 7:return '5';case 8:return iv.includes(7)?'b13':'#5';case 9:return q==='dim7'?'bb7':(has7?'13':'6');case 10:return 'b7';default:return '7';}}

// Progression text -> song
function parseProg(text){const out=[];text.split('|').map(x=>x.trim()).filter(Boolean).forEach(b=>{if(b==='%'&&out.length)out.push(out[out.length-1]);else out.push(b);});return out;}
function buildSong(bars){
 return {bars:bars.map(str=>{const syms=str.trim().split(/\s+/).filter(Boolean).slice(0,4);const n=syms.length||1;const beats=n===1?[4]:n===2?[2,2]:n===3?[2,1,1]:[1,1,1,1];
  return {chords:(syms.length?syms:['C']).map((sym,k)=>({sym,beats:beats[k],p:parseChord(sym)||parseChord('Cmaj7')}))};})};
}
// Tab mini-notation:  s/f = string/fret, [a,b] = chord, r = rest, suffix w h q e s t (+ "." dotted). Default = eighth.
function parseTab(str){
 const DUR={w:4,h:2,q:1,e:0.5,s:0.25,t:1/3};const ev=[];let pos=0,idx=0;
 for(const tok of str.split(/\s+/)){if(!tok||tok==='|')continue;
  const m=tok.match(/^u?(\[[^\]]+\]|r|\d\/\d+)([whqest]?)(\.?)$/);if(!m)throw new Error('Bad tab token: '+tok);const up=tok[0]==='u';
  let d=DUR[m[2]||'e'];if(m[3])d*=1.5;
  const notes=m[1]==='r'?[]:m[1].replace(/[\[\]]/g,'').split(',').map(x=>{const [s,f]=x.split('/').map(Number);return {s,f,midi:OPEN[s]+f};});
  ev.push({start:pos,dur:d,notes,idx:idx++,up});pos+=d;}
 return {events:ev,total:pos};
}

//  CURRICULUM
// =====================================================================
const R=(tok,n)=>Array(n).fill(tok).join(' ');

 .map(b=>{let s=[];for(let i=0;i<b.length;i+=2)s.push(R(SH6[b[i]]+'q',b[i+1]));return s.join(' ');}).join(' | ');
const BOS=(bass,chord,fifth)=>`[${bass},${chord}]q [${chord}]e [${chord}]e ${fifth}q [${chord}]e [${chord}]e`;

const FR={C:[null,3,2,0,1,0],G:[3,2,0,0,0,3],D:[null,null,0,2,3,2],A:[null,0,2,2,2,0],E:[0,2,2,1,0,0],Am:[null,0,2,2,1,0],Em:[0,2,2,0,0,0],Dm:[null,null,0,2,3,1]};
const Q4=c=>R(c+'q',4);const STRUM1=c=>`${c}q ${c}e u${c}q u${c}e ${c}e u${c}e`;
const LEVELS=[
 {n:1,phase:'Beginner',title:'Instrument Basics',desc:'Parts of the guitar, string names, tuning, holding the instrument, picking and fretting.',mods:[14]},

];
const STD={
