{id:1,title:'Foundations of the Jazz Sound',level:'Beginner',color:'#d9a441',blurb:'Swing feel, your first jazz chords and the ii–V–I.',lessons:[
 {id:'1-1',title:'Swing Feel & the Major Scale',mins:15,bpm:90,chords:['Cmaj7','Cmaj7','Cmaj7','Cmaj7'],
  tab:'5/3 5/5 4/2 4/3 4/5 3/2 3/4 3/5 | 3/5 3/4 3/2 4/5 4/3 4/2 5/5 5/3 | 5/3 4/2 4/5 3/4 3/5 3/4 4/5 4/2 | 5/3w',
  html:'<p>Jazz eighth notes are not played evenly. In a <b>swing feel</b> each beat is split long–short, close to a triplet: the first eighth takes about two-thirds of the beat, the second one-third. Say <i>“doo-ba doo-ba”</i> and lean lightly on the off-beat “ba” — that small accent is what makes a line swing.</p><p>Jazz drummers put the weight on <b>beats 2 and 4</b> (the hi-hat closes there). Tap your foot on every beat, but feel the backbeat on 2 and 4.</p><p>You will play the C major scale in 2nd position with swung eighths, then a Cmaj7 arpeggio. Use alternate picking — down on the beat, up on the “and” — and keep every note connected (legato).</p>',
  keys:['Swing = long–short eighths (about 2:1)','Accent the off-beats lightly','Feel beats 2 & 4 as the backbeat','Alternate picking, legato phrasing'],
  cues:['Bar 1 — C major scale up. Swing those eighths: long-short.','Bar 2 — back down. Light accents on every “and”.','Bar 3 — Cmaj7 arpeggio: C E G B and back.','Bar 4 — let the root C ring for the full bar.'],
  figs:[{type:'scale',root:'C',scale:'ionian',from:0,to:6,title:'C major scale — 2nd position',cap:'Roots in gold. Numbers are scale degrees.'}]},
 {id:'1-2',title:'Shell Voicings: Your First Jazz Chords',mins:20,bpm:100,comp:false,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:R('[5/5,3/5,2/6]q',4)+' | '+R('[6/3,4/3,3/4]q',4)+' | '+R('[5/3,3/4,2/5]q',4)+' | '+R('[5/3,3/4,2/5]q',4),
  html:'<p>A <b>shell voicing</b> is the smallest chord that still states its quality: the <b>root</b>, the <b>3rd</b> and the <b>7th</b>. The 3rd tells you major or minor; the 7th tells you maj7, dominant 7 or minor 7. Big-band guitarists like Freddie Green comped almost entirely with three-note shapes like these.</p><p>Learn two families — root on the 6th string and root on the 5th string. Alternating between them lets you play a whole ii–V–I without leaving one area of the neck.</p><p>Comp four short, even quarter notes per bar (“four to the bar”). Release finger pressure right after each strum so the chord stays crisp, and let your fingers mute the unused strings.</p>',
  keys:['Root + 3rd + 7th defines any 7th chord','Two shape families: root on 6 and root on 5','Short, even quarter notes','Mute the strings you are not playing'],
  cues:['Dm7 — root on the 5th string, 5th fret.','G7 — root on the 6th string. Notice how little your hand moves.','Cmaj7 — back to a 5th-string root.','Keep it short, steady and relaxed.'],
  figs:[{type:'chords',title:'Shell voicings for ii–V–I in C',cap:'Root on 5th and 6th strings. Gold dot = root.',items:[{name:'Dm7',frets:[null,5,null,5,6,null]},{name:'G7',frets:[3,null,3,4,null,null]},{name:'Cmaj7',frets:[null,3,null,4,5,null]},{name:'Gmaj7',frets:[3,null,4,4,null,null]},{name:'Gm7',frets:[3,null,3,3,null,null]},{name:'C7',frets:[null,3,null,3,5,null]}]}]},
 {id:'1-3',title:'The ii–V–I & Guide Tones',mins:20,bpm:90,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'2/6h 2/1h | 3/4h 2/6h | 2/5h 3/4h | 2/1w',
  html:'<p>The <b>ii–V–I</b> is the most important progression in jazz. In C major it is <b>Dm7 → G7 → Cmaj7</b>. Most standards are built from chains of ii–V–Is moving through different keys, so hearing and playing it is essential.</p><p>The 3rds and 7ths of the chords are called <b>guide tones</b>. Notice the magic: the 7th of Dm7 (C) falls a half step to the 3rd of G7 (B), and the 7th of G7 (F) falls to the 3rd of Cmaj7 (E). Just these notes spell out the harmony without playing a single chord.</p><p>Play the half-note line and listen to how each change is outlined. Then sing it while the band plays.</p>',
  keys:['ii–V–I in C = Dm7 G7 Cmaj7','Guide tones = 3rds and 7ths','Each 7th resolves down a half step to the next 3rd','Guide-tone lines make the changes audible'],
  cues:['Dm7: F (the 3rd), then C (the 7th).','G7: C falls to B (3rd), then F (7th).','Cmaj7: F falls to E (3rd), then B (7th).','Resolve home to C.'],
  figs:[{type:'dots',from:0,to:7,title:'The guide tones of ii–V–I in C',cap:'F & C (Dm7) → B & F (G7) → E & B (Cmaj7)',dots:[{s:2,f:6,l:'F',cls:'root'},{s:2,f:1,l:'C',cls:'ct'},{s:3,f:4,l:'B',cls:'ct'},{s:2,f:5,l:'E',cls:'ct'}]}]}
]},
{id:2,title:'Arpeggios: Outlining the Changes',level:'Beginner',color:'#58b8ad',blurb:'Seventh-chord arpeggios and connecting them through chord changes.',lessons:[
 {id:'2-1',title:'Major 7 & Dominant 7 Arpeggios',mins:20,bpm:100,chords:['Cmaj7','Cmaj7','G7','G7'],
  tab:'5/3 4/2 4/5 3/4 3/5 2/5 1/3 1/7 | 1/7 1/3 2/5 3/5 3/4 4/5 4/2 5/3 | 6/3 5/2 5/5 4/3 4/5 3/4 3/7 2/6 | 2/6 3/7 3/4 4/5 4/3 5/5 5/2 6/3',
  html:'<p>An <b>arpeggio</b> is a chord played one note at a time. Arpeggios are the backbone of jazz lines because every note is a chord tone — nothing can clash.</p><p><b>Cmaj7</b> = C E G B (1 3 5 7). <b>G7</b> = G B D F (1 3 5 ♭7). The only difference between the two qualities is the 7th: a half step below the root sounds bright and at rest; a whole step below sounds bluesy and wants to resolve.</p><p>Play each arpeggio through two octaves, up and down, and say the chord-tone numbers out loud as you go.</p>',
  keys:['Arpeggio = chord tones one at a time','maj7 = 1 3 5 7','dom7 = 1 3 5 ♭7','Say the numbers while you play'],
  cues:['Cmaj7 — two octaves up from the 5th string.','…and back down to the root.','G7 — from the 6th-string root.','Back down. Feel G7 pulling home to C.'],
  figs:[{type:'arp',root:'C',q:'maj7',from:1,to:8,title:'Cmaj7 arpeggio'},{type:'arp',root:'G',q:'7',from:1,to:8,title:'G7 arpeggio'}]},
 {id:'2-2',title:'Minor 7 & Half-Diminished',mins:20,bpm:90,chords:['Bm7b5','E7','Am7','Am7'],
  tab:'6/7 5/5 5/8 4/7 4/9 3/7 2/6 2/10 | 1/10 1/7 2/9 3/9 3/7 4/9 4/6 5/7 | 6/5 6/8 5/7 5/10 4/7 4/10 3/9 2/8 | 4/7w',
  html:'<p><b>Minor 7</b> (1 ♭3 5 ♭7) is the ii chord in major keys. <b>Half-diminished</b>, written m7♭5 or ø (1 ♭3 ♭5 ♭7), is the ii chord in minor keys — darker and more unstable because of its flattened 5th.</p><p>This exercise outlines a minor ii–V–i: <b>Bm7♭5 → E7 → Am7</b>. Listen for the F of Bm7♭5 moving to the E of E7, and for E7’s G♯ — the leading tone — rising a half step to A. That leading tone is the sound of a minor key.</p>',
  keys:['m7 = 1 ♭3 5 ♭7','m7♭5 = 1 ♭3 ♭5 ♭7','Minor ii–V–i: Bm7♭5 E7 Am7','G♯ → A is the leading tone'],
  cues:['Bm7♭5 — ascending from the 6th string.','E7 — descending from the top. Hear the G♯?','Am7 — the resolution.','Hold the root A.'],
  figs:[{type:'arp',root:'B',q:'m7b5',from:5,to:10,title:'Bm7♭5 arpeggio'},{type:'arp',root:'A',q:'m7',from:5,to:10,title:'Am7 arpeggio'}]},
 {id:'2-3',title:'Connecting Arpeggios Through ii–V–I',mins:25,bpm:100,chords:['Gm7','C7','Fmaj7','Fmaj7'],
  tab:'6/3 5/1 5/5 4/3 4/5 3/3 3/7 2/6 | 2/5 2/1 3/3 4/5 4/2 5/3 6/6 6/3 | 6/5 5/3 5/7 5/8 4/7 3/5 2/5 2/6 | 1/5w',
  html:'<p>Running every arpeggio from its root sounds like an exercise. Real lines <b>connect</b> chords by moving to the <b>nearest chord tone</b> of the next chord, creating smooth voice leading inside the melody itself.</p><p>Here is a ii–V–I in F: <b>Gm7 → C7 → Fmaj7</b>. The Gm7 line climbs to F; C7 begins on E — its nearest chord tone, only a half step away — and descends; Fmaj7 then picks up by step from A.</p><p>Practice changing direction at every bar line, always stepping into the new chord.</p>',
  keys:['Move to the nearest chord tone','Change direction at the bar line','Half-step connections sound strongest','Sing the line before you play it'],
  cues:['Gm7 — up from the root to F.','C7 — step down from F to E, then descend.','Fmaj7 — step up from G to A and climb.','Land on A, the 3rd of Fmaj7.'],
  figs:[{type:'arp',root:'F',q:'maj7',from:1,to:8,title:'Fmaj7 arpeggio'},{type:'arp',root:'C',q:'7',from:1,to:8,title:'C7 arpeggio'}]}
]},
{id:3,title:'Scales & the Bebop Language',level:'Intermediate',color:'#7aa2e3',blurb:'Modes, bebop scales and the chromatic vocabulary of bebop.',lessons:[
 {id:'3-1',title:'Modes of the ii–V–I',mins:20,bpm:100,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'5/5 5/7 5/8 4/5 4/7 3/4 3/5 3/7 | 2/6 2/5 3/7 3/5 3/4 4/7 4/5 5/8 | 5/7 5/8 4/5 4/7 3/4 3/5 3/7 2/5 | 2/1w',
  html:'<p>Each chord of a ii–V–I can be paired with a scale. In C major they are the same seven notes, just centred on different degrees: <b>D Dorian</b> over Dm7, <b>G Mixolydian</b> over G7 and <b>C Ionian</b> over Cmaj7.</p><p>Thinking this way shows that the parent key stays constant through the progression. The art is in <b>emphasis</b>: put chord tones (1 3 5 7) on strong beats and use the other notes as passing tones on the off-beats.</p>',
  keys:['Dorian on ii, Mixolydian on V, Ionian on I','Same notes, different centre of gravity','Chord tones on strong beats','Passing tones on off-beats'],
  cues:['D Dorian over Dm7.','G Mixolydian — descending from F, the ♭7.','C Ionian, landing on E.','Resolve to C.'],
  figs:[{type:'scale',root:'D',scale:'dorian',from:4,to:8,title:'D Dorian'},{type:'scale',root:'G',scale:'mixolydian',from:3,to:8,title:'G Mixolydian'}]},
 {id:'3-2',title:'The Bebop Dominant Scale',mins:20,bpm:110,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'4/0 4/3 3/2 2/1 2/3 1/1 1/3 1/5 | 1/3 1/2 1/1 1/0 2/3 2/1 2/0 3/2 | 3/0q 2/0q 2/1h | 1/0w',
  html:'<p>Bebop players such as Charlie Parker added a <b>chromatic passing note</b> to Mixolydian: the natural 7th, between ♭7 and the root. The result is the eight-note <b>bebop dominant scale</b> (1 2 3 4 5 6 ♭7 7).</p><p>Why eight notes? Played in eighth notes descending from a chord tone on the beat, every chord tone (1 3 5 ♭7) lands <b>on a downbeat</b>, so the line sounds like the chord even at blistering tempos.</p><p>Bar 2 descends G bebop dominant from G: G F♯ F E D C B A, then resolves to Cmaj7.</p>',
  keys:['Bebop dominant = Mixolydian + natural 7','8 notes keep chord tones on the beat','Start descending from a chord tone','Resolve by step'],
  cues:['Dm7 arpeggio climbing to A.','G bebop dominant — G F♯ F E D C B A.','Resolve: G, B, C.','Cmaj7 — rest on E.'],
  figs:[{type:'scale',root:'G',scale:'bebopdom',from:0,to:5,title:'G bebop dominant (open position)'}]},
 {id:'3-3',title:'Enclosures & Chromatic Approach',mins:20,bpm:90,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'1/3 1/0 1/1q 1/6 1/4 1/5q | 2/1 3/3 2/0q 1/3 1/0 1/1q | 1/1 2/4 1/0h rq | 2/1w',
  html:'<p>An <b>enclosure</b> surrounds a target note from above and below before landing on it. The classic shape plays the scale tone above, the chromatic note below, then the target: <b>F – D♯ – E</b> lands on E.</p><p>Aim enclosures at chord tones — especially 3rds — and land the target on a strong beat. This is the most recognisable sound of bebop vocabulary.</p>',
  keys:['Above – below – target','Target chord tones, especially 3rds','Land the target on the beat','Chromatic notes go on weak parts of the beat'],
  cues:['Enclose F, then A — the 3rd and 5th of Dm7.','Enclose B, the 3rd of G7, then F, its 7th.','F – D♯ – E: the classic enclosure of the 3rd.','Rest on C.'],
  figs:[{type:'dots',from:0,to:5,title:'Enclosing E (3rd of Cmaj7)',cap:'F (above) → D♯ (below) → E (target)',dots:[{s:1,f:1,l:'F',cls:'ct'},{s:2,f:4,l:'D♯',cls:'ct'},{s:1,f:0,l:'E',cls:'root'}]}]}
]},
{id:4,title:'Harmony & Chord Melody',level:'Intermediate',color:'#e07a6a',blurb:'Four-note voicings, extensions and harmonising a melody.',lessons:[
 {id:'4-1',title:'Drop-2 Voicings & Voice Leading',mins:25,bpm:80,comp:false,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'[4/3,3/5,2/3,1/5]h [4/3,3/5,2/3,1/5]h | [4/3,3/4,2/3,1/3]h [4/3,3/4,2/3,1/3]h | [4/2,3/4,2/1,1/3]h [4/2,3/4,2/1,1/3]h | [4/2,3/4,2/1,1/3]w',
  html:'<p>A <b>drop-2 voicing</b> takes a close four-note chord and drops the second-highest note down an octave. The result spreads across four adjacent strings, and these are the most used four-note voicings in jazz guitar.</p><p>The shapes here, on strings 4–1, connect Dm7 → G7 → Cmaj7 with tiny finger movements: in each change some notes stay put and the others move by a step. That is <b>voice leading</b>, and it is what makes comping sound smooth and professional.</p>',
  keys:['Drop 2 = close voicing with 2nd-from-top dropped an octave','Four adjacent strings','Keep common tones, move others by step','Listen to the top note — it is a melody'],
  cues:['Dm7 — F C D A from low to high.','G7 — only two notes move.','Cmaj7 — F→E and D→C resolve.','Let it ring.'],
  figs:[{type:'chords',title:'Drop-2 ii–V–I on strings 4–1',items:[{name:'Dm7',frets:[null,null,3,5,3,5]},{name:'G7',frets:[null,null,3,4,3,3]},{name:'Cmaj7',frets:[null,null,2,4,1,3]}]}]},
 {id:'4-2',title:'Extensions & Altered Dominants',mins:25,bpm:80,comp:false,chords:['Dm9','G13 G7alt','Cmaj9','Cmaj9'],
  tab:'[5/5,4/3,3/5,2/5]q re [5/5,4/3,3/5,2/5]e rh | [6/3,4/3,3/4,2/5]h [6/3,4/3,3/4,2/4]h | [5/3,4/2,3/4,2/3]q re [5/3,4/2,3/4,2/3]e rh | [5/3,4/2,3/4,2/3]w',
  html:'<p>Jazz harmony colours chords with <b>extensions</b> — 9ths, 11ths and 13ths — and dominant chords can be <b>altered</b> with ♭9, ♯9, ♯11 or ♭13. Extensions sit on top of, or replace, the basic chord tones.</p><p>Dm9 adds E on top of Dm7. G13 adds E (the 13th) and then lowers it to E♭ (the ♭13) for an altered sound that pulls hard into Cmaj9. Bars 1 and 3 use the <b>Charleston</b> rhythm: beat 1 and the “and” of 2.</p>',
  keys:['9, 11, 13 are colour tones','Altered tones: ♭9 ♯9 ♯11 ♭13','13 → ♭13 creates a chromatic pull','Charleston rhythm: 1, and-of-2'],
  cues:['Dm9 — Charleston rhythm.','G13, then lower the 13th to ♭13.','Cmaj9 — Charleston again.','Let Cmaj9 ring.'],
  figs:[{type:'chords',title:'Extended voicings',items:[{name:'Dm9',frets:[null,5,3,5,5,null]},{name:'G13',frets:[3,null,3,4,5,null]},{name:'G7alt',frets:[3,null,3,4,4,null]},{name:'Cmaj9',frets:[null,3,2,4,3,null]}]}]},
 {id:'4-3',title:'Chord Melody Basics',mins:25,bpm:70,comp:false,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'[4/3,3/5,2/3,1/5]h 1/3q 1/1q | [4/3,3/4,2/3,1/1]h 1/0q 2/3q | [4/2,3/4,2/1,1/0]w | [4/2,3/4,2/1,1/3]h [4/2,3/4,2/1,1/0]h',
  html:'<p>In <b>chord melody</b> you play the melody on the top string while chords support it underneath. Place a chord under important melody notes (usually beat 1) and let single notes carry the melody in between.</p><p>Keep the melody louder than the chord: pick the top note slightly harder, or play fingerstyle and pluck it with your ring finger.</p>',
  keys:['Melody on top, harmony underneath','Chord on the strong beat, single notes in between','Make the top note sing','Choose voicings whose top note is the melody'],
  cues:['Dm7 with A on top — then G, F.','G7 with F on top — then E, D.','Cmaj7 with E on top.','G on top, then back to E.'],
  figs:[{type:'chords',title:'Voicings used',items:[{name:'Dm7',frets:[null,null,3,5,3,5]},{name:'G7',frets:[null,null,3,4,3,1]},{name:'Cmaj7',frets:[null,null,2,4,1,0]}]}]}
]},
{id:5,title:'The Blues & Rhythm Changes',level:'Intermediate',color:'#a98be0',blurb:'The two forms every jazz musician must know.',lessons:[
 {id:'5-1',title:'The Jazz Blues: Comping in F',mins:25,bpm:110,comp:false,chords:['F7','Bb7','F7','Cm7 F7','Bb7','Bdim7','F7','D7','Gm7','C7','F7 D7','Gm7 C7'],
  tab:blues,
  html:'<p>The <b>jazz blues</b> keeps the 12-bar blues form but adds ii–V movement. In F: F7 | B♭7 | F7 | Cm7 F7 | B♭7 | B°7 | F7 | D7 | Gm7 | C7 | F7 D7 | Gm7 C7.</p><p>Bar 4 sets up B♭7 with its own ii–V (Cm7 → F7). Bar 6’s B°7 is a passing chord leading back to F7. Bars 8–10 form a VI–ii–V (D7 → Gm7 → C7) and bars 11–12 are a turnaround to the top.</p><p>Comp the whole form with shell voicings, four to the bar, and count the bars out loud.</p>',
  keys:['12-bar form with added ii–Vs','Bar 4: ii–V to the IV chord','Bar 6: passing diminished chord','Bars 11–12: turnaround'],
  cues:['F7','B♭7 — the IV chord','F7','Cm7 → F7: ii–V into B♭7','B♭7','B°7 — passing diminished','F7','D7 — VI chord','Gm7 — ii','C7 — V','F7 → D7: turnaround','Gm7 → C7: back to the top'],
  figs:[{type:'chords',title:'Shells for the F blues',items:[{name:'F7',frets:[1,null,1,2,null,null]},{name:'Bb7',frets:[null,1,null,1,3,null]},{name:'Cm7',frets:[null,3,null,3,4,null]},{name:'Bdim7',frets:[null,2,null,1,3,null]},{name:'D7',frets:[null,5,null,5,7,null]},{name:'Gm7',frets:[3,null,3,3,null,null]},{name:'C7',frets:[null,3,null,3,5,null]}]}]},
 {id:'5-2',title:'Blues Soloing Vocabulary',mins:20,bpm:110,chords:['F7','Bb7','F7','F7'],
  tab:'3/3 3/4 2/1q 3/1 3/2 4/3q | 3/1q 2/3 2/1 3/3h | 2/4 2/1 3/3 3/2 4/3 4/1 4/2 4/3 | 3/2w',
  html:'<p>Great jazz-blues solos mix the <b>blues scale</b> (1 ♭3 4 ♭5 5 ♭7) with chord tones. The “blue” ♭3 (A♭ in F) often slides into the major 3rd (A) — the tension between them is the heart of the blues.</p><p>This lick opens with a chromatic climb B♭–B–C, answers with A♭ → A (♭3 to 3), and ends with a bebop descent that approaches F chromatically from E.</p>',
  keys:['Blues scale = 1 ♭3 4 ♭5 5 ♭7','♭3 → 3 is the core blues sound','Mix blues licks with chord tones','Chromatic approach notes into roots'],
  cues:['Chromatic climb B♭ B C, then A♭ → A.','Over B♭7, A♭ is the 7th — it fits perfectly.','Bebop descent into F.','Rest on A, the 3rd.'],
  figs:[{type:'scale',root:'F',scale:'blues',from:0,to:5,title:'F blues scale — 1st position'}]},
 {id:'5-3',title:'Rhythm Changes Comping',mins:20,bpm:120,comp:false,chords:['Bb6 G7','Cm7 F7','Dm7 G7','Cm7 F7'],
  tab:'[6/6,4/5,3/7]q. [6/6,4/5,3/7]e [6/3,4/3,3/4]q. [6/3,4/3,3/4]e | [5/3,3/3,2/4]q. [5/3,3/3,2/4]e [6/1,4/1,3/2]q. [6/1,4/1,3/2]e | [5/5,3/5,2/6]q. [5/5,3/5,2/6]e [6/3,4/3,3/4]q. [6/3,4/3,3/4]e | [5/3,3/3,2/4]q. [5/3,3/3,2/4]e [6/1,4/1,3/2]q. [6/1,4/1,3/2]e',
  html:'<p><b>Rhythm changes</b> are the chord changes of a famous 1930 Gershwin song, reused in countless bebop tunes. The A section is a fast chain of I–vi–ii–V and iii–VI–ii–V turnarounds in B♭: B♭6 G7 | Cm7 F7 | Dm7 G7 | Cm7 F7.</p><p>With two chords per bar, comp a bouncing figure: hit each chord on the beat (dotted quarter) and repeat it on the “and”. Keep the chords short and the shapes close together.</p>',
  keys:['Two chords per bar, 4-bar turnarounds','I–vi–ii–V then iii–VI–ii–V','Short, bouncing comping figure','Stay in one area of the neck'],
  cues:['B♭6 → G7','Cm7 → F7','Dm7 → G7','Cm7 → F7 and back to the top'],
  figs:[{type:'chords',title:'Voicings for rhythm changes',items:[{name:'Bb6',frets:[6,null,5,7,null,null]},{name:'G7',frets:[3,null,3,4,null,null]},{name:'Cm7',frets:[null,3,null,3,4,null]},{name:'F7',frets:[1,null,1,2,null,null]},{name:'Dm7',frets:[null,5,null,5,6,null]}]}]}
]},
{id:6,title:'Improvisation & Repertoire',level:'Advanced',color:'#6cc488',blurb:'Minor keys, classic cycles, motifs and bossa nova.',lessons:[
 {id:'6-1',title:'The Minor ii–V–i',mins:25,bpm:100,chords:['Em7b5','A7b9','Dm6','Dm6'],
  tab:'5/7 4/5 4/8 3/7 2/5 3/7 4/8 4/5 | 3/6 2/5 2/8 1/6 1/5 2/8 2/6 2/5 | 3/7q 2/6q 4/7q 3/4q | 3/7w',
  html:'<p>In minor keys the ii–V–i becomes <b>m7♭5 → 7♭9 → m6</b> (or m(maj7)). In D minor: Em7♭5 → A7♭9 → Dm6. The ♭9 (B♭) and ♭13 (F) of A7 come straight from D harmonic minor and give minor-key standards their dark, dramatic colour.</p><p>The line arpeggiates Em7♭5, outlines A7♭9 starting from its 3rd (C♯), then resolves E down to D.</p>',
  keys:['Minor ii–V–i: m7♭5 7♭9 m6','♭9 and ♭13 come from harmonic minor','Resolve the 9th of V down to the root','m6 is a classic jazz minor tonic'],
  cues:['Em7♭5 arpeggio.','A7♭9 from C♯ — hear the B♭ and F.','Dm6: D F A B.','Home on D.'],
  figs:[{type:'chords',title:'Minor ii–V–i in D',items:[{name:'Em7b5',frets:[null,7,null,7,8,null]},{name:'A7b9',frets:[5,4,5,3,null,null]},{name:'Dm6',frets:[null,5,null,4,6,null]}]},{type:'scale',root:'D',scale:'harmmin',from:4,to:9,title:'D harmonic minor'}]},
 {id:'6-2',title:'Guide-Tone Lines on a Classic Cycle',mins:25,bpm:110,chords:['Am7','D7','Gmaj7','Cmaj7','F#m7b5','B7','Em6','Em6'],
  tab:'2/1h 3/0h | 4/4h 2/1h | 2/0h 4/4h | 4/2h 2/0h | 3/2h 1/0h | 2/4h 3/2h | 3/0h 2/2h | 3/0w',
  html:'<p>One of the most played progressions in jazz cycles through a ii–V–I in G major and then a minor ii–V–i in E minor: <b>Am7 D7 Gmaj7 Cmaj7 F♯m7♭5 B7 Em6</b>.</p><p>This guide-tone line, moving mostly by half and whole steps, outlines the whole cycle. Learn it, then improvise by decorating it — add neighbour notes, enclosures and arpeggios around each target.</p>',
  keys:['Major ii–V–I, then minor ii–V–i','3rds and 7ths connect by step','Decorate targets to build a solo','Memorise the cycle — it is everywhere'],
  cues:['Am7 — C and G','D7 — F♯ and C','Gmaj7 — B and F♯','Cmaj7 — E and B','F♯m7♭5 — A and E','B7 — D♯ and A','Em6 — G and C♯','Rest on G'],
  figs:[{type:'arp',root:'E',q:'m6',from:0,to:5,title:'Em6 arpeggio'},{type:'arp',root:'B',q:'7',from:0,to:5,title:'B7 arpeggio'}]},
 {id:'6-3',title:'Motivic Development',mins:20,bpm:110,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'3/7 2/5 2/6 1/5 1/3h | 3/0 3/2 2/0 2/3 2/1h | 2/1 2/3 1/0 1/3 2/0h | 2/1w',
  html:'<p>Strong improvisers repeat and develop short ideas called <b>motifs</b>. Take a four-note cell — here scale degrees 1-2-3-5 — and <b>sequence</b> it on each chord. Listeners hear the logic, and you always have something to play.</p><p>Then develop it: change the rhythm, reverse the direction, or start it an eighth note later (rhythmic displacement).</p>',
  keys:['A motif is a short, memorable cell','Sequence it through the changes','Develop: rhythm, direction, displacement','Leave space between ideas'],
  cues:['1-2-3-5 on Dm7: D E F A.','Same cell on G7: G A B D.','Same cell on Cmaj7: C D E G.','Resolve to C.'],
  figs:[{type:'scale',root:'C',scale:'majpent',from:0,to:5,title:'C major pentatonic — a ready-made 1-2-3-5-6 motif source'}]},
 {id:'6-4',title:'Bossa Nova Groove',mins:25,bpm:120,style:'bossa',straight:true,comp:false,chords:['Dm9','G13','Cmaj9','A7b9'],
  tab:BOS('5/5','4/3,3/5,2/5','6/5')+' | '+BOS('6/3','4/3,3/4,2/5','5/5')+' | '+BOS('5/3','4/2,3/4,2/3','6/3')+' | '+BOS('6/5','5/4,4/5,3/3','6/0'),
  html:'<p><b>Bossa nova</b> fuses samba rhythm with jazz harmony. The guitar plays two parts at once: the thumb plays the bass on beats 1 and 3 (root, then fifth), while the fingers pluck the chord in a syncopated pattern. Eighth notes are <b>straight</b>, not swung.</p><p>Use your thumb (p) for bass notes and index–middle–ring (i-m-a) for the chord. Keep it relaxed and quiet — bossa should feel like a whisper.</p>',
  keys:['Straight eighths, not swing','Thumb: root on 1, fifth on 3','Fingers: syncopated chord stabs','Soft dynamics, relaxed hand'],
  cues:['Dm9 — thumb D, then A.','G13 — thumb G, then D.','Cmaj9 — thumb C, then G.','A7♭9 — thumb A, then E.'],
  figs:[{type:'chords',title:'Bossa voicings',items:[{name:'Dm9',frets:[null,5,3,5,5,null]},{name:'G13',frets:[3,null,3,4,5,null]},{name:'Cmaj9',frets:[null,3,2,4,3,null]},{name:'A7b9',frets:[5,4,5,3,null,null]}]}]}
]},
{id:7,title:'Modes in Practice',level:'Intermediate',color:'#f08a5d',blurb:'Which mode to use, on which chord, and why.',lessons:[
 {id:'7-1',title:'Major Modes: Ionian, Lydian & Mixolydian',mins:20,bpm:100,chords:['Cmaj7','Cmaj7','Fmaj7#11','Fmaj7#11'],
  tab:'5/3 5/5 4/2 4/3 4/5 3/2 3/4 3/5 | 3/5 3/4 4/5 4/2 5/3h | 6/1 6/3 5/0 5/2 5/3 4/0 4/2 4/3 | 5/2h 4/2h',
  html:'<p><b>Modes</b> are the seven scales you get by starting the major scale on each of its degrees. Each has one or two <b>character notes</b> that give it its colour. Three modes fit major-type and dominant chords.</p><p><b>Ionian</b> is the plain major scale. Its 4th clashes with the major 3rd when held, so jazz players treat it as a passing note. <b>Lydian</b> raises that 4th (♯4 = ♯11). It removes the clash and gives an open, modern sound. <b>Mixolydian</b> is major with a ♭7 — the sound of a dominant chord that is not resolving.</p><p>The exercise plays C Ionian over Cmaj7, then F Lydian over Fmaj7♯11. Notice how F Lydian uses exactly the notes of C major: B is the ♯4 of F.</p>',
  table:{title:'Choosing a major mode',head:['Mode','Formula','Character note','Use it on'],rows:[['Ionian','1 2 3 4 5 6 7','4 (passing only)','I chord, resolutions'],['Lydian','1 2 3 ♯4 5 6 7','♯4 / ♯11','IV chord, maj7♯11, final chords, modern major sound'],['Mixolydian','1 2 3 4 5 6 ♭7','♭7 with a major 3rd','Unresolving dominants: blues, funk, vamps, 7sus']]},
  keys:['Every mode has a character note','Ionian: treat the 4th as a passing tone','Lydian: ♯4 makes maj7 chords shine','Mixolydian: the static dominant sound'],
  usage:['On a I chord, pass through the 4th (F over C) — don’t hold it','On IV chords (Fmaj7 in C), Lydian is already in the key','Play Lydian on any maj7 chord for an open, modern sound — great for final chords','Use Mixolydian on dominant vamps; switch to bebop or altered scales when the V resolves'],
  drills:['Loop one chord in the Jam Room and play each mode from its root','Improvise with only 4 notes: 1, 3, 7 and the character note','Sing the character note before you play it'],
  cues:['C Ionian ascending — F is the “avoid note”','Cmaj7 arpeggio — chord tones are safest','F Lydian — B is the ♯4','Land on B, then E: hear the Lydian brightness'],
  figs:[{type:'scale',root:'F',scale:'lydian',from:0,to:5,title:'F Lydian'},{type:'scale',root:'G',scale:'mixolydian',from:2,to:6,title:'G Mixolydian'}]},
 {id:'7-2',title:'Minor Modes: Dorian, Aeolian & Phrygian',mins:20,bpm:100,chords:['Dm7','Dm7','Am7','Am7'],
  tab:'5/5 5/7 5/8 4/5 4/7 3/4 3/5 3/7 | 3/4q 3/7 3/4 4/7q 4/5q | 6/5 6/7 6/8 5/5 5/7 5/8 4/5 4/7 | 5/8q 5/7q 4/7h',
  html:'<p>Three modes fit minor 7 chords, and the difference is all in the <b>6th and 2nd</b> degrees. <b>Dorian</b> has a natural 6th — bright, hopeful minor, and the default jazz choice. <b>Aeolian</b> (natural minor) has a ♭6 — sadder and more classical. <b>Phrygian</b> adds a ♭2 for a dark, Spanish colour.</p><p>In the key of C, Dm7 (ii) takes D Dorian, Am7 (vi) takes A Aeolian and Em7 (iii) takes E Phrygian. All of them use the same seven white notes.</p>',
  table:{title:'Choosing a minor mode',head:['Mode','Formula','Character note','Use it on'],rows:[['Dorian','1 2 ♭3 4 5 6 ♭7','♮6','ii chords, minor vamps, modal tunes, minor blues'],['Aeolian','1 2 ♭3 4 5 ♭6 ♭7','♭6','vi chord, minor tonic with a sad colour'],['Phrygian','1 ♭2 ♭3 4 5 ♭6 ♭7','♭2','iii chord, sus♭9 chords, flamenco colour']]},
  keys:['Dorian = natural 6: the jazz minor','Aeolian = ♭6: darker','Phrygian = ♭2: Spanish colour','Same parent key, different chord'],
  usage:['Default to Dorian on any m7 chord','Use Aeolian when the melody or harmony contains the ♭6','Use Phrygian on iii chords and sus(♭9) chords','On a minor-key tonic (m6, m(maj7)), prefer Dorian or melodic minor'],
  drills:['Loop Dm7 and alternate a bar of Dorian with a bar of Aeolian — hear B vs B♭','Compose a 2-bar phrase that features the 6th','Play E Phrygian over Em7 and land on F to hear the ♭2'],
  cues:['D Dorian ascending','Feature B — the natural 6th','A Aeolian ascending','Feature F — the ♭6'],
  figs:[{type:'scale',root:'D',scale:'dorian',from:4,to:8,title:'D Dorian'},{type:'scale',root:'A',scale:'aeolian',from:4,to:8,title:'A Aeolian'},{type:'scale',root:'E',scale:'phrygian',from:0,to:4,title:'E Phrygian'}]},
 {id:'7-3',title:'Modal Jazz & Quartal Voicings',mins:25,bpm:130,comp:false,chords:['Dm7','Dm7','Ebm7','Ebm7'],jam:'MODAL32',
  tab:'rh [5/7,4/7,3/7,2/8,1/7]q. [5/5,4/5,3/5,2/6,1/5]e | [5/5,4/5,3/5,2/6,1/5]w | rh [5/8,4/8,3/8,2/9,1/8]q. [5/6,4/6,3/6,2/7,1/6]e | [5/6,4/6,3/6,2/7,1/6]w',
  html:'<p>In the late 1950s <b>modal jazz</b> replaced fast chord changes with long stretches of one mode. A typical form is 32 bars AABA: 16 bars of D Dorian, 8 of E♭ Dorian, then 8 of D again. Improvisers think in scales, melody and rhythm instead of chord tones.</p><p>The signature sound is the <b>quartal voicing</b>: three perfect 4ths with a major 3rd on top (E–A–D–G–B). These voicings are diatonic to Dorian and sound open and ambiguous. Move them stepwise inside the mode to create motion over a static bass.</p>',
  keys:['Few chords, long durations','Think mode and melody, not changes','Quartal voicings: stacked 4ths + a 3rd','Move voicings stepwise inside the mode'],
  usage:['When a chord lasts 4+ bars, think in the mode instead of the arpeggio','Create interest with motifs, rhythm and moving voicings, because the harmony stays still','Shift up a half step (D → E♭ Dorian) for contrast','Use quartal voicings on m7, 7sus4 and modal vamps'],
  drills:['Move the quartal shape up and down D Dorian, step by step, over a Dm7 vamp','Improvise for 16 bars using only 3 notes','Jam the full 32-bar AABA modal form in the Jam Room'],
  cues:['Rest two beats, then the quartal pair: E-A-D-G-B → D-G-C-F-A','Let it ring','Up a half step: E♭ Dorian','Let it ring — then back to D'],
  figs:[{type:'chords',title:'Quartal (“modal”) voicings',items:[{name:'Dm11',frets:[null,7,7,7,8,7]},{name:'Dm11',frets:[null,5,5,5,6,5]},{name:'Ebm11',frets:[null,8,8,8,9,8]}]}]}
]},
{id:8,title:'Arpeggios in Use',level:'Intermediate',color:'#4fc3f7',blurb:'Upper structures, sequences and diminished arpeggios on real changes.',lessons:[
 {id:'8-1',title:'Upper-Structure Arpeggios (3-5-7-9)',mins:20,bpm:100,chords:['Dm7','G7','Cmaj7','Cmaj7'],
  tab:'4/3 3/2 2/1 1/0 2/1 3/2 4/3 4/0 | 2/0 2/3 1/1 1/5 1/1 2/3 2/0 3/2 | 4/2 3/0 3/4 2/3 1/0 2/3 2/0 3/0 | 2/3w',
  html:'<p>Start an arpeggio from the <b>3rd</b> of a chord instead of the root and you get <b>3-5-7-9</b>. That is a new seventh chord a 3rd higher, and it adds the 9th for free. The root is left to the bass player, so the line sounds richer and more modern.</p><p>Over Dm7, play <b>Fmaj7</b> (F A C E = ♭3 5 ♭7 9). Over G7, play <b>Bm7♭5</b> (B D F A = 3 5 ♭7 9). Over Cmaj7, play <b>Em7</b> (E G B D = 3 5 7 9).</p>',
  table:{title:'Upper-structure arpeggios',head:['Chord','Play this arpeggio','Result'],rows:[['Cmaj7','Em7','Cmaj9'],['Dm7','Fmaj7','Dm9'],['G7','Bm7♭5','G9'],['G7♭9','B°7','G7♭9'],['Bm7♭5','Dm7 (from ♭3)','Bø with ♭9 colour'],['Cm7','E♭maj7','Cm9']]},
  keys:['3-5-7-9 = seventh chord a 3rd up','Adds the 9th, leaves out the root','Richer, more modern colour','Still 100% inside the chord'],
  usage:['Over any m7, play the maj7 arpeggio a minor 3rd up','Over dom7, the m7♭5 from the 3rd gives the 9th; the dim7 gives ♭9','Over maj7, the m7 from the 3rd gives the 9th','Mix 1-3-5-7 and 3-5-7-9 to vary the colour on long chords'],
  drills:['Play 3-5-7-9 arpeggios through the whole F blues','Alternate 1-3-5-7 and 3-5-7-9 every bar of a ii–V–I','Find the upper structure for every chord of Lesson 10-1'],
  cues:['Fmaj7 over Dm7 = Dm9 sound','Bm7♭5 over G7 = G9 sound','Em7 over Cmaj7 = Cmaj9 sound','Hold D — the 9th'],
  figs:[{type:'arp',root:'F',q:'maj7',from:0,to:5,title:'Fmaj7 arpeggio (over Dm7)'},{type:'arp',root:'B',q:'m7b5',from:0,to:5,title:'Bm7♭5 arpeggio (over G7)'}]},
 {id:'8-2',title:'Arpeggio Sequences Through Fast Changes',mins:20,bpm:120,chords:['Cmaj7 Am7','Dm7 G7','Cmaj7 Am7','Dm7 G7'],
  tab:'5/3 4/2 4/5 3/4 3/5 3/2 4/5 4/2 | 4/3 3/2 2/1 2/3 1/1 2/3 2/0 3/0 | 4/2 3/0 3/4 2/1 1/3 1/0 2/1 3/2 | 4/0 4/3 3/2 2/1 2/3 2/0 3/0 4/3',
  html:'<p>When chords change every two beats, four eighth notes give you exactly one arpeggio per chord. To make it musical, apply three rules:</p><p><b>1.</b> Start each arpeggio on the chord tone <b>nearest</b> to your last note. <b>2.</b> <b>Alternate direction</b> — up, then down. <b>3.</b> Start on different degrees — root, 3rd, 5th or 7th — so the pattern does not become predictable.</p>',
  keys:['One arpeggio per two beats','Nearest chord tone first','Alternate direction','Vary the starting degree'],
  usage:['Use on fast changes with two chords per bar: rhythm changes, turnarounds, bridges','Start each arpeggio as close as possible to the last note','Starting on 3rds and 7ths highlights the guide tones','Break the pattern with a rest or a long note every few bars'],
  drills:['Play the sequence starting every arpeggio on its 3rd','Then start every arpeggio on its 7th','Apply it to the Rhythm Changes preset in the Jam Room'],
  cues:['Cmaj7 up, Am7 down','Dm7 up, G7 down from F','Cmaj7 from the 3rd, Am7 from the 5th','Dm7 from the root, G7 from the 5th'],
  figs:[{type:'arp',root:'A',q:'m7',from:0,to:5,title:'Am7 arpeggio'},{type:'arp',root:'D',q:'m7',from:0,to:5,title:'Dm7 arpeggio'}]},
 {id:'8-3',title:'The Diminished Arpeggio over 7♭9',mins:20,bpm:100,chords:['Dm7','G7b9','Cmaj7','Cmaj7'],
  tab:'4/0 4/3 3/2 2/1 2/3 2/1 3/2 4/3 | 3/4 2/3 2/6 1/4 2/6 2/3 3/4 3/1 | 3/0q 3/4 2/1 1/0q 1/3q | 1/0w',
  html:'<p>A <b>diminished 7th arpeggio</b> built on the 3rd of a dominant gives 3 5 ♭7 ♭9 — the complete 7♭9 chord without its root. Over G7♭9, play <b>B°7</b> (B D F A♭).</p><p>A diminished 7th chord is symmetrical: it is stacked minor 3rds. So B°7, D°7, F°7 and A♭°7 contain the same notes, and the shape repeats every 3 frets. One shape therefore covers four dominant chords: G7, B♭7, D♭7 and E7.</p>',
  keys:['Dim7 from the 3rd = 7♭9 without the root','Symmetrical: repeats every 3 frets','One shape = four dominant chords','Resolve ♭9 down a half step'],
  usage:['Over any 7♭9 chord, play a dim7 arpeggio from its 3rd, 5th, ♭7 or ♭9','Ideal for V chords in minor keys (G7♭9 → Cm)','Move the shape up 3 frets for instant variation','Resolve the ♭9 down a half step to the 5th of the next chord (A♭ → G)'],
  drills:['Play B°7 in four positions, 3 frets apart','Use a dim7 arpeggio on every V chord of the Minor ii–V–i preset','Practise resolving every ♭9 down by half step'],
  cues:['Dm7 arpeggio','B°7 over G7♭9: B D F A♭','Resolve A♭ → G','Rest on E'],
  figs:[{type:'arp',root:'B',q:'dim7',from:0,to:6,title:'B°7 arpeggio — repeats every 3 frets'}]}
]},
{id:9,title:'Chord Inversions',level:'Intermediate',color:'#c792ea',blurb:'Inversions for voice leading, melody and bass lines.',lessons:[
 {id:'9-1',title:'Triad Inversions on the Top Strings',mins:20,bpm:90,comp:false,chords:['C','F','G','C'],
  tab:R('[3/5,2/5,1/3]q',4)+' | '+R('[3/5,2/6,1/5]q',4)+' | '+R('[3/4,2/3,1/3]q',4)+' | [3/5,2/5,1/3]w',
  html:'<p>Any triad can be stacked three ways. In <b>root position</b> the root is lowest (C E G). In <b>1st inversion</b> the 3rd is lowest (E G C). In <b>2nd inversion</b> the 5th is lowest (G C E). The notes are the same; the top note and the colour change.</p><p>Choose the inversion that is <b>closest</b> to the previous chord. In this I–IV–V–I, C → F (2nd inversion) → G (1st inversion) → C barely moves your hand, and the top line moves smoothly: G → A → G → G.</p>',
  table:{title:'The three inversions',head:['Inversion','Bottom → top','C major','Character'],rows:[['Root','1 3 5','C E G','Stable, grounded'],['1st','3 5 1','E G C','Lighter, smooth'],['2nd','5 1 3','G C E','Connecting, passing']]},
  keys:['Root, 1st and 2nd inversions','Same notes, different top note','Choose the nearest inversion','Small voicings cut through a band'],
  usage:['Pick the inversion nearest the previous chord: voice leading beats a fixed position','Use the top note as a melody — three inversions give three melody notes per chord','Top-string triads stay clear of the bass and cut through a band','A triad over a different bass note creates extended chords (D triad over C = C6/9♯11)'],
  drills:['Play C, F and G in all three inversions on strings 3-2-1','Repeat on strings 4-3-2','Play I–IV–V–I keeping the top note as still as possible'],
  cues:['C — root position','F — 2nd inversion: only two notes move','G — 1st inversion','Back to C'],
  figs:[{type:'chords',title:'C major inversions (strings 3-2-1)',items:[{name:'C (root)',frets:[null,null,null,5,5,3]},{name:'C (1st inv)',frets:[null,null,null,9,8,8]},{name:'C (2nd inv)',frets:[null,null,null,12,13,12]}]},{type:'chords',title:'F and G inversions used',items:[{name:'F (2nd inv)',frets:[null,null,null,5,6,5]},{name:'F (1st inv)',frets:[null,null,null,2,1,1]},{name:'G (1st inv)',frets:[null,null,null,4,3,3]}]}]},
 {id:'9-2',title:'Drop-2 Inversions of a Seventh Chord',mins:20,bpm:80,comp:false,chords:['Cmaj7','Cmaj7','Cmaj7','Cmaj7'],
  tab:'[4/2,3/4,2/1,1/3]h [4/5,3/5,2/5,1/7]h | [4/9,3/9,2/8,1/8]h [4/10,3/12,2/12,1/12]h | [4/9,3/9,2/8,1/8]h [4/5,3/5,2/5,1/7]h | [4/2,3/4,2/1,1/3]w',
  html:'<p>Four-note chords have <b>four inversions</b>. On strings 4–1, the drop-2 inversions of Cmaj7 have the 5th, 7th, root and 3rd on top: G, B, C and E. Each inversion is one step higher up the neck.</p><p>This is how jazz guitarists add <b>movement to a static chord</b>: climbing through the inversions keeps one chord interesting for several bars. It is also how you <b>harmonise a melody</b>: you choose the inversion whose top note is the melody note.</p>',
  keys:['4-note chords have 4 inversions','Top notes of Cmaj7: G, B, C, E','Climb the inversions to create motion','Pick the inversion by its top note'],
  usage:['On a long chord, climb through the inversions to create movement','To harmonise a melody note, choose the inversion with that note on top','Connect different chords using the nearest inversion (see Lesson 4-1)','Know which chord tone is on top of each inversion'],
  drills:['Play all four inversions of Dm7 and G7 on strings 4–1','Repeat on strings 5–2','Comp a ii–V–I staying within 5 frets using the nearest inversions'],
  cues:['Top notes G, then B','Top notes C, then E','Descending: C, then B','Home — top note G'],
  figs:[{type:'chords',title:'Cmaj7 drop-2 inversions (strings 4–1)',items:[{name:'Cmaj7/E',frets:[null,null,2,4,1,3]},{name:'Cmaj7/G',frets:[null,null,5,5,5,7]},{name:'Cmaj7/B',frets:[null,null,9,9,8,8]},{name:'Cmaj7',frets:[null,null,10,12,12,12]}]}]},
 {id:'9-3',title:'Slash Chords & Bass-Line Clichés',mins:25,bpm:90,comp:false,chords:['Cmaj7','Em7/B','Am7','Am7/G','Fmaj7','Fm6','Cmaj7/G','G7'],
  tab:'[5/3,3/4,2/5]h [5/3,3/4,2/5]h | [5/2,4/2,3/0,2/3]h [5/2,4/2,3/0,2/3]h | [5/0,4/2,3/0,2/1]h [5/0,4/2,3/0,2/1]h | [6/3,4/2,3/2,2/1]h [6/3,4/2,3/2,2/1]h | [6/1,4/2,3/2,2/1]h [6/1,4/2,3/2,2/1]h | [6/1,4/0,3/1,2/1]h [6/1,4/0,3/1,2/1]h | [6/3,5/3,4/2,3/4]h [6/3,5/3,4/2,3/4]h | [6/3,4/3,3/4,2/3]h [6/3,4/3,3/4,2/3]h',
  html:'<p>A <b>slash chord</b> such as Am7/G means “Am7 with G in the bass”. Inversions in the bass let the bass line move <b>by step</b> while the harmony moves slowly. This 8-bar progression walks the bass down C–B–A–G–F, then uses the classic <b>minor iv</b> (Fm6). Inside the chord, A falls to A♭, which gives the move its emotional pull.</p><p>The bass player follows the slash notes here — listen to the line it creates.</p>',
  table:{title:'Bass-line analysis',head:['Bar','Chord','Bass','Function'],rows:[['1','Cmaj7','C','I'],['2','Em7/B','B','iii — passing bass'],['3','Am7','A','vi'],['4','Am7/G','G','vi, 7th in the bass'],['5','Fmaj7','F','IV'],['6','Fm6','F','iv (minor plagal) — A → A♭'],['7','Cmaj7/G','G','I, 5th in the bass (cadential)'],['8','G7','G','V']]},
  keys:['X/Y = chord X over bass note Y','Inversions make stepwise bass lines','Minor iv: A → A♭ inner voice','I/5 → V prepares the cadence'],
  usage:['Use slash chords to walk the bass down by step under slow harmony','The IV → iv move (Fmaj7 → Fm6) is a classic, emotional route back to I','I with the 5th in the bass (C/G → G7) prepares the dominant strongly','In chord melody, play the slash note yourself as the lowest voice'],
  drills:['Play only the bass notes while singing the top line','Transpose the progression to G','Write a descending line under Am: Am, Am(maj7)/G♯, Am7/G, D/F♯'],
  cues:['Cmaj7 — bass C','Em7/B — bass B','Am7 — bass A','Am7/G — bass G','Fmaj7 — bass F','Fm6 — A falls to A♭','Cmaj7/G — bass G','G7 — the dominant'],
  figs:[{type:'chords',title:'Slash-chord voicings',items:[{name:'Em7/B',frets:[null,2,2,0,3,null]},{name:'Am7',frets:[null,0,2,0,1,null]},{name:'Am7/G',frets:[3,null,2,2,1,null]},{name:'Fm6',frets:[1,null,0,1,1,null]},{name:'Cmaj7/G',frets:[3,3,2,4,null,null]}]}]}
]},
{id:10,title:'Jazz Standards: Breakdown & Analysis',level:'Advanced',color:'#ffcb6b',blurb:'Form, key centres and practice strategies for core repertoire.',lessons:[
 {id:'10-1',title:'Standard Analysis: Autumn Leaves',mins:30,bpm:120,chords:['Am7','D7','Gmaj7','Cmaj7','F#m7b5','B7','Em6','Em6'],jam:'AUTUMN',
  tab:'3/2q 2/1q 1/0q 1/3q | 1/2q 2/3q 2/1q 3/2q | 3/0q 2/0q 2/3q 1/2q | 1/0q 2/1q 2/0q 3/0q | 4/4q 3/2q 2/1q 1/0q | 2/4q 2/0q 3/2q 4/4q | 4/2q 3/0q 2/0q 2/2q | 2/0h 1/0h',
  html:'<p><b>Autumn Leaves</b> (Joseph Kosma, 1945) is one of the most played standards. It is the perfect first tune because it uses only two key centres. It is a 32-bar <b>AABC</b> form, shown here in G major / E minor. The harmony alternates a <b>major ii–V–I</b> (Am7 D7 Gmaj7) with a <b>minor ii–V–i</b> (F♯m7♭5 B7 Em). The two are joined by Cmaj7, the IV chord, which continues the cycle of 4ths.</p><p>The exercise outlines the A section with nearest-note arpeggios. The melody is not included — learn it by ear from a recording; a classic version is on Cannonball Adderley’s <i>Somethin’ Else</i> (1958).</p>',
  table:{title:'Form & harmonic analysis (common version)',head:['Bars','Chords','Analysis','Notes'],rows:[['A 1–4','Am7 | D7 | Gmaj7 | Cmaj7','ii–V–I–IV in G','Cycle of 4ths'],['A 5–8','F♯m7♭5 | B7 | Em6 | Em6','iiø–V–i in E minor','Relative minor: same key signature'],['A 9–16','(repeat)','',''],['B 17–24','F♯m7♭5 | B7 | Em6 | Em6 | Am7 | D7 | Gmaj7 | Gmaj7','minor ii–V–i, then major ii–V–I','Order flipped: minor first'],['C 25–32','F♯m7♭5 | B7 | Em7 A7 | Dm7 G7 | F♯m7♭5 | B7 | Em6 | Em6','descending ii–Vs → minor ii–V–i','Bars 27–28 move down a whole step; try tritone subs (Em7 E♭7 Dm7 D♭7)']]},
  keys:['Two key centres: G major, E minor','Major ii–V–I + minor ii–V–i','Cmaj7 (IV) links them via the cycle of 4ths','Form: AABC, 32 bars'],
  usage:['Play G major sounds over bars 1–4 and E harmonic minor over the minor ii–V–i','B7 is the key moment — aim for its 3rd, D♯','Use upper structures (Lesson 8-1) on the long Em6 chords','Learn the melody by ear first; improvise around it before departing from it'],
  drills:['Play the arpeggio line, then the guide-tone line from Lesson 6-2','Solo one chorus using only chord tones','Jam the full 32-bar form in the Jam Room, counting A A B C aloud'],
  cues:['Am7 — ii in G','D7 — V','Gmaj7 — I','Cmaj7 — IV, the cycle continues','F♯m7♭5 — ii of E minor','B7 — V of E minor: hear D♯','Em6 — i','Em6 — get ready to repeat'],
  figs:[{type:'arp',root:'B',q:'7',from:0,to:5,title:'B7 arpeggio — the pivot chord'},{type:'scale',root:'E',scale:'harmmin',from:0,to:5,title:'E harmonic minor'}]},
 {id:'10-2',title:'Standard Analysis: All the Things You Are',mins:30,bpm:130,chords:['Fm7','Bbm7','Eb7','Abmaj7','Dbmaj7','G7','Cmaj7','Cmaj7'],jam:'ATTYA',
  tab:'1/4h 2/4h | 2/2h 3/1h | 3/0h 2/2h | 2/1h 3/0h | 4/3h 2/1h | 2/0h 1/1h | 1/0h 2/0h | 1/0w',
  html:'<p><b>All the Things You Are</b> (Jerome Kern, 1939) is a favourite of jazz musicians because it travels through <b>five key centres</b> in 36 bars: A♭ → C → E♭ → G → E → A♭. Each A section falls through the cycle of 4ths (vi–ii–V–I–IV), then a single dominant chord lifts it into a new key.</p><p>The guide-tone line below covers the first 8 bars. Every 7th falls a half step to the next 3rd, so one smooth line connects all the key changes.</p>',
  table:{title:'Form & key centres (36 bars, A A B A′)',head:['Bars','Chords','Analysis','Key'],rows:[['1–5','Fm7 | B♭m7 | E♭7 | A♭maj7 | D♭maj7','vi–ii–V–I–IV','A♭'],['6–8','G7 | Cmaj7 | Cmaj7','V–I (pivot from D♭: a tritone away)','C'],['9–13','Cm7 | Fm7 | B♭7 | E♭maj7 | A♭maj7','vi–ii–V–I–IV','E♭'],['14–16','D7 | Gmaj7 | Gmaj7','V–I','G'],['17–20 (B)','Am7 | D7 | Gmaj7 | Gmaj7','ii–V–I','G'],['21–24','F♯m7 | B7 | Emaj7 | C7alt','ii–V–I, then V of Fm','E → A♭'],['25–29','Fm7 | B♭m7 | E♭7 | A♭maj7 | D♭maj7','vi–ii–V–I–IV','A♭'],['30–32','D♭m7 | Cm7 | B°7','iv minor → iii → passing dim','A♭'],['33–36','B♭m7 | E♭7 | A♭maj7 | Gm7♭5 C7alt','ii–V–I + turnaround','A♭']]},
  keys:['Five key centres in 36 bars','Cycle of 4ths inside each section','A single V chord pivots to the next key','Guide tones move by half steps throughout'],
  usage:['Track key centres rather than individual chords: say “A♭… C… E♭… G… E… A♭”','Aim for the 3rd of every pivot dominant (B of G7, F♯ of D7, E of C7)','Use the guide-tone line as the skeleton of your solo','Practise slowly in the Jam Room with the full 36-bar form'],
  drills:['Extend the guide-tone line through all 36 bars','Arpeggiate each chord 1-3-5-7, then 3-5-7-9','Improvise using only the major scale of each key centre'],
  cues:['Fm7 — vi in A♭: A♭ then E♭','B♭m7 — ii: D♭ then A♭','E♭7 — V: G then D♭','A♭maj7 — I: C then G','D♭maj7 — IV: F then C','G7 — pivot to C: B then F','Cmaj7 — new key: E then B','Hold E'],
  figs:[{type:'chords',title:'Shells for the first 8 bars',items:[{name:'Fm7',frets:[1,null,1,1,null,null]},{name:'Bbm7',frets:[null,1,null,1,2,null]},{name:'Eb7',frets:[null,6,null,6,8,null]},{name:'Abmaj7',frets:[4,null,5,5,null,null]},{name:'Dbmaj7',frets:[null,4,null,5,6,null]},{name:'G7',frets:[3,null,3,4,null,null]},{name:'Cmaj7',frets:[null,3,null,4,5,null]}]}]},
 {id:'10-3',title:'Standard Analysis: Blue Bossa',mins:25,bpm:140,style:'bossa',straight:true,chords:['Cm7','Cm7','Fm7','Fm7','Dm7b5','G7b9','Cm7','Cm7'],jam:'BLUEBOSSA',
  tab:'5/3q 4/1q 4/5q 3/3q | 3/5q 3/3q 4/5q 4/1q | 4/3q 3/1q 3/5q 2/4q | 2/6q 2/4q 3/5q 3/1q | 4/3q 3/1q 2/1q 2/3q | 1/1q 2/3q 2/0q 3/1q | 3/0q 3/3q 2/1q 2/4q | 2/1w',
  html:'<p><b>Blue Bossa</b> (Kenny Dorham, recorded on Joe Henderson’s <i>Page One</i>, 1963) is a 16-bar Latin tune in C minor. It is a jam-session staple. The first 8 bars move from i to iv and back through a minor ii–V–i. Bars 9–12 then <b>lift a half step</b> into D♭ major with a major ii–V–I, before a minor ii–V brings it home.</p><p>The exercise arpeggiates bars 1–8 in straight quarter notes, connecting each chord to the nearest note of the next.</p>',
  table:{title:'Form & harmonic analysis (16 bars)',head:['Bars','Chords','Analysis','Scale idea'],rows:[['1–4','Cm7 | Cm7 | Fm7 | Fm7','i – iv in C minor','C Dorian / C minor'],['5–8','Dm7♭5 | G7♭9 | Cm7 | Cm7','iiø–V–i','C harmonic minor on G7♭9'],['9–12','E♭m7 | A♭7 | D♭maj7 | D♭maj7','ii–V–I in D♭ (up a half step)','D♭ major'],['13–16','Dm7♭5 | G7♭9 | Cm7 | Dm7♭5 G7♭9','iiø–V–i + turnaround','Back to C minor']]},
  keys:['16 bars, bossa feel, straight eighths','C minor with a lift to D♭ major','Two minor ii–V–is','Very common jam-session tune'],
  usage:['Play C Dorian or C minor over bars 1–4','Use C harmonic minor, or a B°7 arpeggio (Lesson 8-3), over G7♭9','In bars 9–12 switch to D♭ major — the half-step lift is the tune’s highlight','Keep the eighths straight and relaxed: it is a bossa'],
  drills:['Extend the arpeggio line through all 16 bars','Comp the form with the bossa voicings from Lesson 6-4','Solo two choruses: one inside, one with dim7 arpeggios on the V chords'],
  cues:['Cm7 — i','Cm7 — down from C','Fm7 — iv','Fm7','Dm7♭5 — iiø','G7♭9 — V','Cm7 — i','Cm7 — hold C'],
  figs:[{type:'scale',root:'C',scale:'dorian',from:1,to:6,title:'C Dorian'},{type:'scale',root:'Db',scale:'ionian',from:3,to:7,title:'D♭ major (bars 9–12)'}]}
]},
{id:11,title:'Triad Pairs',level:'Advanced',color:'#89ddff',blurb:'Hexatonic sounds from two triads — modern, angular lines.',lessons:[
 {id:'11-1',title:'Triad Pairs: The Basics',mins:25,bpm:90,chords:['Dm7','Dm7','Dm7','Dm7'],
  tab:'4/3t 3/2t 2/1t 3/0t 2/0t 2/3t 2/1t 3/2t 4/3t 2/3t 2/0t 3/0t | 4/3 3/2 2/1 3/0 2/0 2/3 1/1 1/3 | 1/5t 1/1t 2/1t 1/3t 2/3t 2/0t 1/1t 2/1t 3/2t 2/3t 2/0t 3/0t | 4/0w',
  html:'<p>A <b>triad pair</b> is two triads with no notes in common, usually a whole step apart, such as <b>F</b> (F A C) and <b>G</b> (G B D). Together they make a six-note (hexatonic) scale. Alternating the two triads produces wide, angular, modern-sounding lines while every note stays inside the mode.</p><p>Over Dm7, F + G gives D Dorian without the E. Notice the shape of the exercise: up F, up G, down F, down G in triplets. The pattern then crosses the beat in eighth notes.</p>',
  table:{title:'Common triad pairs',head:['Pair','Six notes','Works over'],rows:[['F + G','F A C · G B D','Dm7 (Dorian), G7sus, Fmaj7♯11, Em7 (Phrygian)'],['C + D','C E G · D F♯ A','Cmaj7♯11, D7sus, Am7 (Dorian), Bm7 (Phrygian)'],['D♭ + E♭','D♭ F A♭ · E♭ G B♭','G7alt, B♭m7 (Dorian), E♭7sus']]},
  keys:['Two triads, no common notes','Usually a whole step apart','6-note hexatonic sound','Wide, angular, modern lines'],
  usage:['Find the mode, then two adjacent major triads inside it (often IV and V of the parent key)','Alternate the triads in groups of 3 — the leaps sound modern','The pair leaves out one scale note (here E), which keeps the sound open','Best on long chords, modal vamps and sus chords'],
  drills:['Play F and G triads in every inversion on strings 3-2-1','Alternate them in 2-, 3- and 4-note groupings','Loop Dm7 in the Jam Room and improvise using only these six notes'],
  cues:['Triplets: F triad up, G triad up, then down','Eighth notes — the groups of 3 now cross the beat','Descending triplets from the top','Rest on D'],
  figs:[{type:'dots',from:0,to:5,title:'F + G triad pair over Dm7',cap:'Teal = F triad (F A C) · Gold = G triad (G B D)',dots:[{s:4,f:3,l:'F',cls:'ct'},{s:3,f:2,l:'A',cls:'ct'},{s:2,f:1,l:'C',cls:'ct'},{s:1,f:1,l:'F',cls:'ct'},{s:1,f:5,l:'A',cls:'ct'},{s:3,f:0,l:'G',cls:'root'},{s:2,f:0,l:'B',cls:'root'},{s:2,f:3,l:'D',cls:'root'},{s:1,f:3,l:'G',cls:'root'}]}]},
 {id:'11-2',title:'Triad Pairs over Altered Dominants',mins:25,bpm:100,chords:['Dm7','G7alt','Cmaj7','Cmaj7'],
  tab:'4/3 3/2 2/1 3/0 2/0 2/3 2/1 3/2 | 2/2t 1/1t 1/4t 2/4t 1/3t 1/6t 1/4t 1/1t 2/2t 1/3t 2/4t 3/3t | 2/0q 2/1q 1/0h | 2/3w',
  html:'<p>The <b>altered scale</b> (G A♭ B♭ B D♭ E♭ F over G7alt) contains two major triads a whole step apart, built on the ♭5 and ♭6 of the dominant: <b>D♭</b> (D♭ F A♭) and <b>E♭</b> (E♭ G B♭). Over G7 these give ♭5 ♭7 ♭9 and ♭13 R ♯9. That is every altered tension, organised into two easy, recognisable shapes.</p><p>After the tension, resolve by half step: B♭ → B → C into Cmaj7.</p>',
  keys:['7alt → major triads on ♭5 and ♭6','G7alt → D♭ + E♭','All tension, but organised','Resolve by half step'],
  usage:['For any 7alt chord, play major triads on its ♭5 and ♭6 (C7alt → G♭ + A♭)','Resolve to a chord tone of the next chord by half step','Works on the V of minor keys too','The same pair works over the tritone sub (D♭7) — they share the same tensions'],
  drills:['Find the pair for C7alt, F7alt and B♭7alt','Use the Lesson 11-1 patterns with D♭ + E♭','Play the pair on every V chord of the Minor ii–V–i preset'],
  cues:['Dm7 — F + G pair','G7alt — D♭ + E♭ triplets','Resolve B♭ → B → C','Hold D, the 9th'],
  figs:[{type:'scale',root:'G',scale:'altered',from:1,to:6,title:'G altered scale'}]},
 {id:'11-3',title:'Permutations & Lydian Colour',mins:25,bpm:100,chords:['Cmaj7#11','Cmaj7#11','Cmaj7#11','Cmaj7#11'],
  tab:'3/7 2/7 1/5 2/5 2/8 1/7 1/5 2/7 | 1/7 2/8 2/5 1/5 2/7 3/7 2/5 2/8 | 3/7t 2/7t 1/5t 2/5t 2/8t 1/7t 1/5t 2/7t 3/7t 1/7t 2/8t 2/5t | 2/7w',
  html:'<p>Over Cmaj7♯11 (C Lydian), pair <b>D major</b> (D F♯ A) with <b>E minor</b> (E G B). D gives 9 ♯11 13 and Em gives 3 5 7 — every colour tone, and no root to weigh the line down.</p><p>To avoid sounding like an exercise, use <b>permutations</b>: re-order the notes inside each triad (1-3-5, 5-3-1, 3-1-5…) and change the grouping. Groups of 3 played in eighth notes shift the accent across the beat. Groups played in triplets line up with the pulse.</p>',
  keys:['Lydian: triads on 2 and 3 (D + Em over C)','Colour tones only, no root','Permute note order inside each triad','Change grouping for rhythmic interest'],
  usage:['On maj7♯11 chords, use the triads built on the 2nd and 3rd degrees','The same six notes work over D7sus and Am7 (Dorian)','Permute the note order to avoid sounding mechanical','Play groups of 3 in eighth notes for a polyrhythmic effect'],
  drills:['Write six different permutations of D + Em and play each one','Combine the pair with the Lydian scale from Lesson 7-1','Use C + D over Am7 in the Modal Vamp preset'],
  cues:['Groups of 3 in eighth notes — the accent shifts','Descending permutation','Triplets: up, up, down, down','Hold F♯, the ♯11'],
  figs:[{type:'scale',root:'C',scale:'lydian',from:4,to:8,title:'C Lydian'}]}
]},
{id:12,title:'Chord Substitutions',level:'Advanced',color:'#f78c6c',blurb:'Tritone subs, diatonic swaps, secondary dominants and the backdoor.',lessons:[
 {id:'12-1',title:'Tritone Substitution',mins:25,bpm:110,comp:false,chords:['Dm7','Db7','Cmaj7','Cmaj7','Dm7','Db7','Cmaj7','Cmaj7'],
  tab:'[5/5,3/5,2/6]q. [5/5,3/5,2/6]e rh | [5/4,3/4,2/6]q. [5/4,3/4,2/6]e rh | [5/3,3/4,2/5]q. [5/3,3/4,2/5]e rh | [5/3,3/4,2/5]w | 4/0 4/3 3/2 2/1 2/3 2/1 3/2 4/3 | 4/3 3/1 3/4 2/2 1/1 2/2 3/4 3/1 | 3/0q 2/0q 2/1q 1/0q | 2/1w',
  html:'<p>Any dominant 7th chord can be replaced by the dominant 7th a <b>tritone</b> (three whole steps) away. G7 and D♭7 share the same two guide tones, B (C♭) and F, with the roles swapped. Because the tritone defines a dominant, the substitute resolves just as well, and the bass now moves chromatically: D – D♭ – C.</p><p>Bars 1–4 comp the substitution; bars 5–8 play a D♭7 arpeggio line. Heard over the original G7, D♭7’s notes are ♭5 ♭7 ♭9 3 — an instant altered sound.</p>',
  table:{title:'Tritone substitutes',head:['Original V','Tritone sub','Shared guide tones'],rows:[['G7','D♭7','B (C♭) & F'],['C7','G♭7','E (F♭) & B♭'],['D7','A♭7','F♯ & C'],['A7','E♭7','C♯ & G'],['E7','B♭7','G♯ & D']]},
  keys:['Sub V7 with the dom7 a tritone away','Same 3rd and 7th (swapped)','Chromatic bass: ii – ♭II7 – I','As a line, it sounds altered'],
  usage:['Swap any V7 for the dominant a tritone away, especially right before the I','Use it when you want the bass to descend chromatically','As a soloist, play a D♭7 arpeggio over G7 for an instant altered sound','Use it on secondary dominants too: A7 → E♭7 in a turnaround'],
  drills:['Rewrite the I–vi–ii–V turnaround with tritone subs: Cmaj7 E♭7 | Dm7 D♭7','Play a D♭7 arpeggio over a G7 backing','Compare both versions in the Jam Room (Tritone-sub Turnaround preset)'],
  cues:['Dm7 — Charleston rhythm','D♭7 replaces G7 — the bass falls a half step','Cmaj7','Let it ring','Now a line: Dm7 arpeggio','D♭7 arpeggio — over “G7” this is ♭5 ♭7 ♭9 3','Resolve to Cmaj7','Hold C'],
  figs:[{type:'chords',title:'G7 and its tritone substitute',items:[{name:'G7',frets:[3,null,3,4,null,null]},{name:'Db7',frets:[null,4,null,4,6,null]},{name:'G7',frets:[null,10,null,10,12,null]},{name:'Db7',frets:[9,null,9,10,null,null]}]}]},
 {id:'12-2',title:'Diatonic & Diminished Substitutions',mins:20,bpm:120,comp:false,chords:['Cmaj7 A7','Dm7 G7','Em7 Eb7','Dm7 Db7'],
  tab:'[5/3,3/4,2/5]h [6/5,4/5,3/6]h | [5/5,3/5,2/6]h [6/3,4/3,3/4]h | [5/7,3/7,2/8]h [5/6,3/6,2/8]h | [5/5,3/5,2/6]h [5/4,3/4,2/6]h',
  html:'<p>Chords fall into three <b>families</b>, and chords in the same family can usually replace each other. The <b>tonic</b> family is I, iii and vi. The <b>subdominant</b> family is ii and IV. The <b>dominant</b> family is V, vii° and the tritone sub. Em7 can replace Cmaj7 because they share E, G and B.</p><p>Bars 1–2 are a plain I–VI–ii–V turnaround. In bars 3–4 the I becomes iii (Em7), and both dominants are replaced by tritone subs (E♭7, D♭7). The result is a chromatic bass line: E – E♭ – D – D♭ – C.</p>',
  table:{title:'Chord families in C',head:['Family','Chords','Swap example'],rows:[['Tonic','Cmaj7, Em7, Am7','Cmaj7 → Em7 (iii for I)'],['Subdominant','Dm7, Fmaj7','Fmaj7 → Dm7 (ii for IV)'],['Dominant','G7, B°7, D♭7','G7 → B°7 or D♭7']]},
  keys:['Tonic, subdominant, dominant families','Swap chords within a family','B°7 = G7♭9 without the root','Stack substitutions for chromatic bass lines'],
  usage:['Replace a long I chord with I–vi or I–iii to create motion','Use iii (Em7) for I when the melody note is B, G or E','Use B°7 for G7 for a ♭9 colour and a smooth bass line (B → C)','Combine subs: iii + tritone subs = Em7 E♭7 Dm7 D♭7 Cmaj7'],
  drills:['Reharmonise four bars of Cmaj7 as I–vi–ii–V','Then apply iii-for-I and tritone subs','Paste your version into the Jam Room custom field and listen'],
  cues:['Original: Cmaj7 → A7','Dm7 → G7','Substituted: Em7 → E♭7','Dm7 → D♭7 — chromatic bass all the way'],
  figs:[{type:'chords',title:'Voicings used',items:[{name:'A7',frets:[5,null,5,6,null,null]},{name:'Em7',frets:[null,7,null,7,8,null]},{name:'Eb7',frets:[null,6,null,6,8,null]},{name:'Db7',frets:[null,4,null,4,6,null]}]}]},
 {id:'12-3',title:'Secondary Dominants & the Backdoor ii–V',mins:25,bpm:110,chords:['Cmaj7','A7','Dm7','G7','Cmaj7','Fm7 Bb7','Cmaj7','Cmaj7'],
  tab:'1/0h 2/0h | 2/2h 3/0h | 4/3h 2/1h | 2/0h 1/1h | 1/0h 2/0h | 3/1q 2/4q 2/3q 3/1q | 3/0q 2/0q 2/1q 1/0q | 1/0w',
  html:'<p>A <b>secondary dominant</b> is the V7 of a chord other than I. A7 is the V of Dm7 (written V/ii); it turns Dm7 into a temporary tonic. Every diatonic chord except vii° can be preceded by its own dominant.</p><p>The <b>backdoor ii–V</b> (Fm7 – B♭7 → Cmaj7) is borrowed from C minor. B♭7 resolves <i>up</i> a whole step to C, and its key note, A♭, falls to G. The result is softer and more soulful than a standard V–I.</p>',
  table:{title:'Secondary dominants in C',head:['Target','Dominant','Symbol'],rows:[['Dm7 (ii)','A7','V/ii'],['Em7 (iii)','B7','V/iii'],['Fmaj7 (IV)','C7','V/IV'],['G7 (V)','D7','V/V'],['Am7 (vi)','E7','V/vi'],['Cmaj7 (I), backdoor','Fm7 B♭7','iv – ♭VII7']]},
  keys:['Secondary dominant = V7 of a diatonic chord','A7 → Dm7 is V/ii','Backdoor: iv – ♭VII7 – I','A♭ → G is the backdoor sound'],
  usage:['Put any diatonic chord’s V7 in front of it to strengthen the arrival','Add the ii of that dominant for a mini ii–V (Em7 A7 → Dm7)','Use the backdoor (iv – ♭VII7) for a softer, bluesy return home','Over B♭7 in the backdoor, try B♭ Lydian dominant'],
  drills:['Insert V/ii, V/iii and V/vi into a I–vi–ii–V','Rewrite the last 2 bars of a blues with a backdoor ii–V','Find the secondary dominants in All the Things You Are (Lesson 10-2)'],
  cues:['Cmaj7 — E and B','A7 (V/ii) — C♯ pulls up to D','Dm7 — F and C','G7 — B and F','Cmaj7 — home','Backdoor: Fm7 → B♭7 — A♭ is the key note','A♭ falls to G — home','Hold E'],
  figs:[{type:'chords',title:'Backdoor voicings',items:[{name:'Fm7',frets:[1,null,1,1,null,null]},{name:'Bb7',frets:[null,1,null,1,3,null]},{name:'Cmaj7',frets:[null,3,null,4,5,null]},{name:'A7',frets:[5,null,5,6,null,null]}]}]}
]},
{id:13,title:'Modern Jazz Concepts',level:'Advanced',color:'#c3e88d',blurb:'Quartal harmony, pentatonic superimposition, outside playing and upper structures.',lessons:[
 {id:'13-1',title:'Quartal Harmony',mins:20,bpm:110,comp:false,chords:['Dm7','Dm7','Dm7','Dm7'],
  tab:'[5/5,4/5,3/5]q [5/7,4/7,3/7]q [5/8,4/9,3/9]q [5/10,4/10,3/10]q | [5/10,4/10,3/10]q. [5/8,4/9,3/9]e [5/7,4/7,3/7]h | [4/7,3/7,2/8]h [4/5,3/5,2/6]h | [5/5,4/5,3/5]w',
  html:'<p><b>Quartal harmony</b> stacks 4ths instead of 3rds. It was popularised in the 1960s by pianists like McCoy Tyner and Bill Evans. Quartal chords have no obvious major or minor quality; they sound open, modern and ambiguous.</p><p>On guitar, strings 6-5-4-3 are tuned in 4ths, so a three-note stack of perfect 4ths is just <b>one fret, barred</b>. Moving that shape step by step through D Dorian creates <b>planing</b>: parallel harmonies that stay in the mode. When the shape reaches F, it contains an augmented 4th (F–B), as the mode requires.</p>',
  keys:['Chords built from 4ths','Open, ambiguous quality','Strings 6-5-4-3: one-fret barre','Plane the shape through the mode'],
  usage:['Comp on modal tunes, m7 and 7sus4 chords','Move the shape diatonically (inside the mode), not chromatically, for planing','As a soloist, play lines in 4ths: D G C F … (wide, piano-like)','Combine with pentatonics (Lesson 13-2) — they are made of 4ths and 2nds'],
  drills:['Play the 3-note 4ths shape on every degree of D Dorian, strings 5-4-3','Then on strings 4-3-2 (raise the top note one fret)','Improvise a line using only 4th intervals'],
  cues:['Climbing in 4ths: D-G-C, E-A-D, F-B-E, G-C-F','Back down','Strings 4-3-2: A-D-G, then G-C-F','Home'],
  figs:[{type:'chords',title:'Quartal shapes in D Dorian (strings 5-4-3)',items:[{name:'Dm7 (4ths)',frets:[null,5,5,5,null,null]},{name:'Dm7 (4ths)',frets:[null,7,7,7,null,null]},{name:'Dm7 (4ths)',frets:[null,8,9,9,null,null]},{name:'Dm7 (4ths)',frets:[null,10,10,10,null,null]}]}]},
 {id:'13-2',title:'Pentatonic Superimposition',mins:25,bpm:110,chords:['Dm7','G7alt','Cmaj7','Cmaj7'],
  tab:'2/5 2/8 1/5 1/7 1/10 1/7 1/5 2/8 | 1/6 2/9 2/6 3/8 3/6 4/8 3/6 3/8 | 2/5q 2/8q 1/7h | 1/8w',
  html:'<p>A pentatonic scale is a ready-made, five-note melodic cell. Played from a <b>different root</b> than the chord, it brings out that chord’s extensions. This is <b>superimposition</b>. E minor pentatonic over Dm7 gives 9, 11, 5, 13 and the root — a bright, modern minor sound. B♭ minor pentatonic over G7alt gives ♯9, ♭5, ♭13, ♭7 and ♭9 — every altered tension.</p><p>Pentatonic shapes are also fast to finger, which is why modern players use them for intervallic lines.</p>',
  table:{title:'Superimposition map',head:['Chord','Pentatonic','Sound'],rows:[['Dm7','D minor pent','1 ♭3 4 5 ♭7 — inside'],['Dm7','A minor pent','5 ♭7 1 9 11'],['Dm7','E minor pent','9 11 5 13 1 — modern'],['G7alt','B♭ minor pent','♯9 ♭5 ♭13 ♭7 ♭9 — altered'],['Cmaj7','E minor pent','3 5 6 7 9'],['Cmaj7','D major pent','9 3 ♯11 13 7 — Lydian']]},
  keys:['Pentatonic from another root = extensions','Dm7 → E minor pent (9 11 13)','G7alt → B♭ minor pent','Fast, intervallic, modern'],
  usage:['Over m7, use minor pentatonics on the 1, 5 and 2 (D, A or E over Dm7)','Over 7alt, use minor pentatonic a minor 3rd up (G7alt → B♭m)','Over maj7, use major pentatonic on the 5 (inside) or the 2 (Lydian)','Use 4-note groupings (1-2-3-5) for modern patterns'],
  drills:['Over a Dm7 vamp, change between D, A and E minor pentatonic every 2 bars','Find the altered pentatonic for C7alt (hint: E♭m)','Play pentatonics in 4-note groupings'],
  cues:['E minor pentatonic over Dm7: the 9th and 13th','B♭ minor pentatonic over G7alt','Resolve E♭ → E','Hold C'],
  figs:[{type:'scale',root:'E',scale:'minpent',from:5,to:9,title:'E minor pentatonic (over Dm7)'},{type:'scale',root:'Bb',scale:'minpent',from:5,to:9,title:'B♭ minor pentatonic (over G7alt)'}]},
 {id:'13-3',title:'Side-Slipping & Playing Outside',mins:20,bpm:110,chords:['Dm7','Dm7','Dm7','Dm7'],
  tab:'1/5 1/3 1/1 2/3 1/5 1/3 1/1 2/3 | 1/6 1/4 1/2 2/4 1/6 1/4 1/2 2/4 | 1/5 1/3 1/1 2/3 2/1q 3/2q | 2/3w',
  html:'<p><b>Side-slipping</b> means moving a phrase a half step away from the harmony, then back. The band stays on Dm7 while you play “outside” in E♭ Dorian, creating tension that releases when you return. It is a hallmark of post-bop playing from the 1960s on.</p><p>The secret is <b>conviction</b>. Use a clear, strong shape so listeners hear it as deliberate, and play it inside first so they know where “home” is.</p>',
  keys:['Inside → outside → inside','Move a phrase up or down a half step','The band holds the harmony','Strong shape and rhythm = intentional'],
  usage:['Play a clear inside idea first so listeners hear the reference','Shift the same idea up or down a half step for a bar, then return','Keep the rhythm strong — confident outside playing sounds intentional','Use on static chords and vamps where the band holds the harmony'],
  drills:['Shift a short pentatonic lick up a half step and back','Try a whole-step shift and a tritone shift','Over the Modal Vamp preset, side-slip every 4th bar'],
  cues:['Inside: D Dorian motif','Outside: same motif up a half step — E♭ Dorian','Back inside — resolve','Release on D'],
  figs:[{type:'scale',root:'Eb',scale:'dorian',from:1,to:6,title:'E♭ Dorian — the side-slip'}]},
 {id:'13-4',title:'Upper-Structure Triads',mins:25,bpm:80,comp:false,chords:['Dm9','G13b9 G7alt','Cmaj9','Cmaj9'],
  tab:'[5/5,4/3,3/5,2/5]h [5/5,4/3,3/5,2/5]h | [5/2,4/3,3/4,2/5,1/4]h [5/2,4/3,3/3,2/4,1/3]h | [5/3,4/2,3/4,2/3]w | [5/3,4/2,3/4,2/3]h [5/3,4/2,3/4,2/3]h',
  html:'<p>An <b>upper-structure triad</b> (UST) is a major triad placed on top of a dominant’s 3rd and 7th. The triad supplies the tensions, so it is a quick way to build complex, piano-style voicings. With B and F (the guide tones of G7) on the bottom:</p><p>an <b>E triad</b> on top gives G13♭9; an <b>A triad</b> gives G13♯11; an <b>E♭ triad</b> gives G7♯9♭13. The exercise moves from E to E♭ over the G7 and resolves to Cmaj9.</p>',
  table:{title:'Upper structures on G7 (B + F underneath)',head:['Triad','Notes','Tensions','Chord'],rows:[['E','E G♯ B','13 ♭9 3','G13♭9'],['A','A C♯ E','9 ♯11 13','G13♯11'],['E♭','E♭ G B♭','♭13 R ♯9','G7♯9♭13 (alt)'],['D♭','D♭ F A♭','♭5 ♭7 ♭9','G7♭5♭9 (alt)'],['B♭','B♭ D F','♯9 5 ♭7','G7♯9']]},
  keys:['Major triad over the 3rd + 7th','Triad = the tensions','E/G7 = 13♭9, A/G7 = 13♯11, E♭/G7 = alt','Pick by the top note'],
  usage:['On any dominant, keep the 3rd + 7th low and put a triad on top','E (VI) and A (II) triads sound bright; E♭ (♭VI) and D♭ (♭V) sound altered','Choose the triad whose top note matches the melody','Soloists can arpeggiate the UST for instant tension'],
  drills:['Build E, A and E♭ upper structures on G7 and play them in sequence','Transpose to C7 (A, D and A♭ triads)','Comp the Minor ii–V–i preset using a ♭VI upper structure on every V'],
  cues:['Dm9','G13♭9 (E triad) → G7alt (E♭ triad)','Cmaj9 — resolution','Let it ring'],
  figs:[{type:'chords',title:'Upper-structure voicings on G7',items:[{name:'G13b9',frets:[null,2,3,4,5,4]},{name:'G13#11',frets:[null,2,3,2,2,0]},{name:'G7alt',frets:[null,2,3,3,4,3]}]}]}
]}
