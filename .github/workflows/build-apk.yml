name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Use the runner's preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" || echo "::error::Android SDK not found at $SDK"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Add microphone permission (tuner & live chord recognition)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $M
      - name: Set version and stable signing key
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + ${{ github.run_number }}))/" $G
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"2.3.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G
          mkdir -p ~/.android && cp android-debug.keystore ~/.android/debug.keystore
          cp android-debug.keystore android/app/jga.keystore
          python3 - <<'PY'
          import re
          p='android/app/build.gradle';g=open(p).read()
          if 'jga.keystore' not in g:
              g=re.sub(r'android\s*\{','android {\n    signingConfigs {\n        debug {\n            storeFile file("jga.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }',g,count=1)
              open(p,'w').write(g)
          PY
          grep -n -A5 "signingConfigs" android/app/build.gradle
      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log || { grep -E "error|What went wrong|FAILURE" -A4 ../build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk ../JazzGuitarAcademy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JazzGuitarAcademy-apk
          path: JazzGuitarAcademy.apk
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" JazzGuitarAcademy.apk --title "Jazz Guitar Academy (build ${{ github.run_number }})" --notes "Android APK built from commit ${{ github.sha }}. Download JazzGuitarAcademy.apk on your phone and open it to install." --latest
      - name: Store APK on the apk branch
        run: |
          mkdir /tmp/out && cp JazzGuitarAcademy.apk /tmp/out/
          cd /tmp/out && git init -q -b apk && git add JazzGuitarAcademy.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
