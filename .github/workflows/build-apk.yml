name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Add microphone permission (tuner & live chord recognition)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $M
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JazzGuitarAcademy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
